<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSPR Reception Survey &mdash; IO85LO, 28&ndash;30 Aug 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--card:#111827;--input:#1a2234;--border:#1e293b;
  --amber:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-weight:300;min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:2rem 1rem}
header{margin-bottom:1.25rem}
h1{font-family:'DM Serif Display',serif;font-size:1.7rem;color:var(--text);line-height:1.2}
.subtitle{color:var(--muted);font-size:0.875rem;margin-top:0.35rem}
h3{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--dim);margin-bottom:0.5rem;font-family:'IBM Plex Sans',sans-serif;font-weight:400}

/* Panels */
.panels{display:flex;gap:1.25rem;align-items:flex-start;flex-wrap:wrap}
.panel-geo{flex:1 1 620px;min-width:0}
.panel-polar{flex:0 0 390px}
@media(max-width:1040px){.panel-polar{flex:1 1 380px}}

.canvas-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.75rem;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:auto;cursor:crosshair}

/* Controls */
.controls{display:flex;gap:1.25rem;margin-top:1rem;flex-wrap:wrap;align-items:flex-start}
.band-filter{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.875rem 1rem;flex:0 0 auto}
.band-filter h3{margin-bottom:0.6rem}
.band-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.35rem;cursor:pointer;user-select:none}
.band-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--amber);cursor:pointer;flex-shrink:0}
.band-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.band-name{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;min-width:3.2rem}
.band-count{font-size:0.75rem;color:var(--dim)}

.stats-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.875rem 1rem;flex:1 1 0}
.stats-panel h3{margin-bottom:0.6rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.6rem}
.stat{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.75rem}
.stat-label{font-size:0.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em}
.stat-value{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:var(--amber);margin-top:0.15rem}
.stat-sub{font-size:0.68rem;color:var(--dim);margin-top:0.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tooltip */
.tooltip{
  position:fixed;background:var(--input);border:1px solid var(--border);
  border-radius:6px;padding:0.5rem 0.75rem;font-family:'IBM Plex Mono',monospace;
  font-size:0.77rem;color:var(--text);pointer-events:none;display:none;white-space:nowrap;z-index:100;
  line-height:1.65;
}
.tooltip b{color:var(--amber)}

/* Out-of-bounds note */
.oob-note{font-size:0.75rem;color:var(--dim);margin-top:0.4rem;text-align:right}
</style>
</head>

</div>

// ================================================================
// STATE
// ================================================================
const bandActive = [true, true, true, true, true];
let geoPos = [];   // {x, y, si} for geo canvas
let polPos = [];   // {x, y, si} for polar canvas
let pinnedIdx = -1;

// ================================================================
// CANVAS SETUP
// ================================================================
const geoCanvas   = document.getElementById('geo');
const polCanvas   = document.getElementById('polar');
const geoCtx      = geoCanvas.getContext('2d');
const polCtx      = polCanvas.getContext('2d');

geoCanvas.width  = GEO_W;  geoCanvas.height = GEO_H;
polCanvas.width  = POL_W;  polCanvas.height = POL_H;

// ================================================================
// PROJECTION HELPERS
// ================================================================
function latToY(lat) { return (LAT_MAX - lat) / (LAT_MAX - LAT_MIN) * GEO_H; }
function lonToX(lon) { return (lon - LON_MIN) / (LON_MAX - LON_MIN) * GEO_W; }

function bearPolarXY(dist, bearing) {
  const r = Math.min(dist / MAX_DIST * POL_R, POL_R);
  const a = (bearing - 90) * Math.PI / 180;
  return { x: POL_CX + r * Math.cos(a), y: POL_CY + r * Math.sin(a) };
}

function dotR(snrNorm) {
  return 1.5 + Math.max(0, Math.min(3, (snrNorm + 35) / 15));
}

// ================================================================
// GEO GRID
// ================================================================
function drawGeoGrid(ctx) {
  ctx.strokeStyle = '#1a2234';
  ctx.lineWidth = 1;
  ctx.font = '9px "IBM Plex Mono",monospace';
  ctx.fillStyle = '#334155';

  for (let lon = LON_MIN; lon <= LON_MAX; lon += 10) {
    const x = lonToX(lon);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GEO_H); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillText((lon >= 0 ? lon + '\u00b0E' : Math.abs(lon) + '\u00b0W'), x, GEO_H - 3);
  }
  for (let lat = LAT_MIN; lat <= LAT_MAX; lat += 10) {
    const y = latToY(lat);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GEO_W, y); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillText(lat + '\u00b0N', 3, y - 2);
  }
}

// ================================================================
// DRAW GEO MAP
// ================================================================
function drawGeo(highlightIdx) {
  const ctx = geoCtx;
  ctx.clearRect(0, 0, GEO_W, GEO_H);
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, GEO_W, GEO_H);
  drawGeoGrid(ctx);

  geoPos = [];
  let oob = 0;
  SPOTS.forEach(function(s, si) {
    if (!bandActive[s[0]]) return;
    const lat = s[3], lon = s[4];
    if (lat < LAT_MIN || lat > LAT_MAX || lon < LON_MIN || lon > LON_MAX) { oob++; return; }
    const x = lonToX(lon), y = latToY(lat);
    geoPos.push({x, y, si});
    const r = dotR(s[8]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = (si === highlightIdx) ? '#ffffff' : BAND_COLORS[s[0]] + 'bb';
    ctx.fill();
  });

  // Out-of-bounds note
  document.getElementById('oob-note').textContent =
    oob > 0 ? oob + '\u2009spot' + (oob === 1 ? '' : 's') + ' outside map extent \u2014 visible on polar plot' : '';

  // QTH marker
  const qx = lonToX(CFG.qth_lon), qy = latToY(CFG.qth_lat);
  ctx.beginPath(); ctx.arc(qx, qy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#f59e0b'; ctx.fill();
  ctx.beginPath(); ctx.arc(qx, qy, 8, 0, Math.PI * 2);
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#f59e0b';
  ctx.font = '9px "IBM Plex Mono",monospace';
  ctx.textAlign = 'left';
  ctx.fillText('IO85LO', qx + 11, qy + 3);

  // Highlight dot on top
  if (highlightIdx >= 0) {
    const s = SPOTS[highlightIdx];
    const lat = s[3], lon = s[4];
    if (lat >= LAT_MIN && lat <= LAT_MAX && lon >= LON_MIN && lon <= LON_MAX) {
      const hx = lonToX(lon), hy = latToY(lat);
      ctx.beginPath(); ctx.arc(hx, hy, Math.max(5, dotR(s[8]) + 2), 0, Math.PI * 2);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
}

// ================================================================
// POLAR GRID
// ================================================================
function drawPolarGrid(ctx) {
  // Distance rings
  const rings = [5000, 10000, 15000, 20000];
  ctx.font = '9px "IBM Plex Mono",monospace';
  ctx.fillStyle = '#334155';
  rings.forEach(function(km) {
    const r = km / MAX_DIST * POL_R;
    ctx.beginPath(); ctx.arc(POL_CX, POL_CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#1a2234'; ctx.lineWidth = 1; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillText(km >= 1000 ? (km/1000) + 'k km' : km + ' km', POL_CX, POL_CY - r + 10);
  });

  // Bearing spokes every 45°
  for (let b = 0; b < 360; b += 45) {
    const a = (b - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(POL_CX, POL_CY);
    ctx.lineTo(POL_CX + POL_R * Math.cos(a), POL_CY + POL_R * Math.sin(a));
    ctx.strokeStyle = '#1a2234'; ctx.lineWidth = 1; ctx.stroke();
  }

  // Cardinal labels
  const cards = [{b:0,l:'N'},{b:90,l:'E'},{b:180,l:'S'},{b:270,l:'W'}];
  const LR = POL_R + 12;
  ctx.font = 'bold 11px "IBM Plex Sans",sans-serif';
  cards.forEach(function(c) {
    const a = (c.b - 90) * Math.PI / 180;
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.l, POL_CX + LR * Math.cos(a), POL_CY + LR * Math.sin(a));
  });
}

// ================================================================
// DRAW POLAR MAP
// ================================================================
function drawPolar(highlightIdx) {
  const ctx = polCtx;
  ctx.clearRect(0, 0, POL_W, POL_H);
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, POL_W, POL_H);
  drawPolarGrid(ctx);

  polPos = [];
  SPOTS.forEach(function(s, si) {
    if (!bandActive[s[0]]) return;
    const p = bearPolarXY(s[5], s[6]);
    polPos.push({x: p.x, y: p.y, si});
    const r = dotR(s[8]);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = (si === highlightIdx) ? '#ffffff' : BAND_COLORS[s[0]] + 'bb';
    ctx.fill();
  });

  // QTH centre
  ctx.beginPath(); ctx.arc(POL_CX, POL_CY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#f59e0b'; ctx.fill();
  ctx.beginPath(); ctx.arc(POL_CX, POL_CY, 7, 0, Math.PI * 2);
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.stroke();

  // Highlight
  if (highlightIdx >= 0) {
    const s = SPOTS[highlightIdx];
    const p = bearPolarXY(s[5], s[6]);
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(5, dotR(s[8]) + 2), 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// ================================================================
// STATS
// ================================================================
function updateStats() {
  const active = SPOTS.filter(function(s) { return bandActive[s[0]]; });
  const total  = active.length;
  document.getElementById('st-total').textContent = total.toLocaleString();

  if (total === 0) {
    document.getElementById('st-far-dist').textContent = '\u2014';
    document.getElementById('st-far-info').textContent = '';
    document.getElementById('st-med').textContent = '\u2014';
    return;
  }

  // Furthest
  const far = active.reduce(function(a, b) { return b[5] > a[5] ? b : a; });
  document.getElementById('st-far-dist').textContent = far[5].toLocaleString() + ' km';
  document.getElementById('st-far-info').textContent = far[1] + ' \u00b7 ' + BANDS[far[0]];

  // Median distance
  const dists = active.map(function(s) { return s[5]; }).sort(function(a,b){return a-b;});
  const med = dists[Math.floor(dists.length / 2)];
  document.getElementById('st-med').textContent = Math.round(med).toLocaleString();

  // Best band by decodes/slot (among active)
  let bestDps = -1, bestBand = '';
  BANDS.forEach(function(b, i) {
    if (bandActive[i] && BAND_DPS[i] > bestDps) { bestDps = BAND_DPS[i]; bestBand = b; }
  });
  document.getElementById('st-best').textContent = bestBand;
  document.getElementById('st-best-sub').textContent = bestDps.toFixed(2) + ' decodes/slot';
}

// ================================================================
// DRAW ALL
// ================================================================
function drawAll(hi) {
  const h = (hi === undefined) ? -1 : hi;
  drawGeo(h);
  drawPolar(h);
  if (hi === undefined) updateStats();
}

// ================================================================
// TOOLTIP
// ================================================================
const tooltipEl = document.getElementById('tooltip');

function showTooltip(si, ex, ey) {
  const s = SPOTS[si];
  tooltipEl.innerHTML =
    '<b>' + s[1] + '</b> &nbsp;' + s[2] + '<br>' +
    'Band: ' + BANDS[s[0]] + ' &nbsp;&nbsp; Dist: ' + s[5].toLocaleString() + '\u2009km<br>' +
    'Bearing: ' + s[6] + '\u00b0 &nbsp;&nbsp; SNR: ' + s[7] + '\u2009dB<br>' +
    'SNR\u2099: ' + s[8] + '\u2009dB &nbsp;&nbsp; TX: ' + s[9].toFixed(3) + '\u2009W';
  let tx = ex + 14, ty = ey - 12;
  if (tx + 220 > window.innerWidth) tx = ex - 235;
  if (ty + 80 > window.innerHeight) ty = ey - 85;
  tooltipEl.style.left = tx + 'px';
  tooltipEl.style.top  = ty + 'px';
  tooltipEl.style.display = 'block';
}

function hideTooltip() { tooltipEl.style.display = 'none'; }

// ================================================================
// HIT TEST
// ================================================================
function hitTest(positions, mx, my, threshold) {
  const t2 = threshold * threshold;
  let best = -1, bestD = t2;
  for (const p of positions) {
    const d = (p.x - mx) * (p.x - mx) + (p.y - my) * (p.y - my);
    if (d < bestD) { bestD = d; best = p.si; }
  }
  return best;
}

function canvasMousePos(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width  / rect.width),
    y: (e.clientY - rect.top)  * (canvas.height / rect.height)
  };
}

// ================================================================
// MOUSE EVENTS
// ================================================================
let lastHover = -1;

function handleHover(canvas, positions, e) {
  if (pinnedIdx >= 0) return;
  const {x, y} = canvasMousePos(canvas, e);
  const si = hitTest(positions, x, y, 10);
  if (si === lastHover) return;
  lastHover = si;
  if (si >= 0) {
    drawAll(si);
    showTooltip(si, e.clientX, e.clientY);
  } else {
    drawAll();
    hideTooltip();
  }
}

function handleClick(canvas, positions, e) {
  const {x, y} = canvasMousePos(canvas, e);
  const si = hitTest(positions, x, y, 12);
  if (si >= 0) {
    pinnedIdx = (pinnedIdx === si) ? -1 : si;
    drawAll(pinnedIdx >= 0 ? pinnedIdx : undefined);
    if (pinnedIdx >= 0) showTooltip(pinnedIdx, e.clientX, e.clientY);
    else hideTooltip();
  } else if (pinnedIdx >= 0) {
    pinnedIdx = -1;
    drawAll();
    hideTooltip();
  }
}

geoCanvas.addEventListener('mousemove', function(e) { handleHover(geoCanvas, geoPos, e); });
polCanvas.addEventListener('mousemove', function(e) { handleHover(polCanvas, polPos, e); });
geoCanvas.addEventListener('mouseleave', function() { if (pinnedIdx < 0) { hideTooltip(); if (lastHover >= 0) { lastHover=-1; drawAll(); } } });
polCanvas.addEventListener('mouseleave', function() { if (pinnedIdx < 0) { hideTooltip(); if (lastHover >= 0) { lastHover=-1; drawAll(); } } });
geoCanvas.addEventListener('click', function(e) { handleClick(geoCanvas, geoPos, e); });
polCanvas.addEventListener('click', function(e) { handleClick(polCanvas, polPos, e); });

// ================================================================
// BAND FILTER
// ================================================================
function buildBandFilter() {
  const container = document.getElementById('band-rows');
  container.innerHTML = '';

  // Count per band
  const allCounts = [0,0,0,0,0];
  SPOTS.forEach(function(s) { allCounts[s[0]]++; });
  document.getElementById('cnt-all').textContent = SPOTS.length.toLocaleString() + ' decodes';

  BANDS.forEach(function(band, i) {
    const row = document.createElement('label');
    row.className = 'band-row';
    row.innerHTML =
      '<input type="checkbox" id="cb-' + i + '" checked>' +
      '<span class="band-dot" style="background:' + BAND_COLORS[i] + '"></span>' +
      '<span class="band-name">' + band + '</span>' +
      '<span class="band-count">' + allCounts[i].toLocaleString() + ' &nbsp;&nbsp; ' + BAND_DPS[i] + '/slot</span>';
    container.appendChild(row);
  });

  // Wire up checkboxes
  document.getElementById('cb-all').addEventListener('change', function() {
    const v = this.checked;
    for (let i = 0; i < 5; i++) {
      bandActive[i] = v;
      document.getElementById('cb-' + i).checked = v;
    }
    pinnedIdx = -1; lastHover = -1;
    drawAll(); hideTooltip();
  });

  BANDS.forEach(function(band, i) {
    document.getElementById('cb-' + i).addEventListener('change', function() {
      bandActive[i] = this.checked;
      const allOn = bandActive.every(Boolean);
      document.getElementById('cb-all').checked = allOn;
      document.getElementById('cb-all').indeterminate = !allOn && bandActive.some(Boolean);
      pinnedIdx = -1; lastHover = -1;
      drawAll(); hideTooltip();
    });
  });
}

// ================================================================
// INIT
// ================================================================
buildBandFilter();
drawAll();
updateStats();
</script>
