<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Symbols — RF-Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e2e8f0;font-family:'IBM Plex Sans',sans-serif;font-weight:300;padding:1.5rem;max-width:1400px;margin:0 auto}
h1{font-family:'DM Serif Display',serif;font-size:1.55rem;margin-bottom:0.2rem}
.subtitle{font-size:0.78rem;color:#64748b;font-family:'IBM Plex Mono',monospace;margin-bottom:1.1rem}

/* Mode / filter bar */
.top-bar{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.mbtn{background:#1a2234;border:1px solid #1e293b;color:#94a3b8;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:0.35rem 0.75rem;border-radius:4px;cursor:pointer;transition:background .15s,color .15s}
.mbtn:hover{background:#1e293b;color:#e2e8f0}
.mbtn.on{background:#1e293b;color:#e2e8f0;border-color:#a78bfa}
.mbtn.quiz-on{background:#1e293b;color:#f59e0b;border-color:#f59e0b}
.sep{width:1px;height:24px;background:#1e293b;margin:0 0.25rem}

/* Symbol grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0.65rem;margin-bottom:1rem}
.sym-card{background:#111827;border:1px solid #1e293b;border-radius:6px;padding:0.6rem 0.5rem 0.5rem;cursor:pointer;transition:border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center}
.sym-card:hover{background:#141e30;border-color:#334155}
.sym-card.active{border-color:#a78bfa;background:#13182a}
.sym-card.dim{opacity:0.22;pointer-events:none}
.sym-canvas{display:block}
.sym-name{font-size:0.67rem;color:#94a3b8;font-family:'IBM Plex Mono',monospace;text-align:center;margin-top:0.4rem;line-height:1.3}
.cat-tag{font-size:0.58rem;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-top:0.2rem}

/* Detail panel */
#detail{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:1.25rem;margin-bottom:1rem;display:none;grid-template-columns:180px 1fr;gap:1.5rem;align-items:start}
#detail.show{display:grid}
#detail-canvas{display:block;border-radius:4px}
.detail-name{font-family:'DM Serif Display',serif;font-size:1.2rem;margin-bottom:0.3rem}
.detail-cat{font-size:0.68rem;color:#64748b;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.07em;margin-bottom:0.7rem}
.detail-desc{font-size:0.85rem;line-height:1.7;color:#cbd5e1;margin-bottom:0.75rem}
.exam-fact{background:#0d1321;border-left:3px solid #f59e0b;padding:0.55rem 0.85rem;font-size:0.78rem;color:#fbbf24;font-family:'IBM Plex Mono',monospace;line-height:1.5;border-radius:0 4px 4px 0}
.exam-label{font-size:0.62rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;margin-bottom:0.3rem}

/* Quiz overlay */
#quiz-panel{background:#111827;border:1px solid #f59e0b;border-radius:8px;padding:1.25rem;margin-bottom:1rem;display:none}
#quiz-panel.show{display:block}
.quiz-q{font-size:0.85rem;color:#94a3b8;margin-bottom:0.9rem;font-family:'IBM Plex Mono',monospace}
#quiz-canvas{display:block;margin:0 auto 1rem;border-radius:4px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;max-width:480px;margin:0 auto}
.qbtn{background:#1a2234;border:1px solid #1e293b;color:#e2e8f0;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:0.5rem 0.75rem;border-radius:4px;cursor:pointer;text-align:left;transition:background .12s}
.qbtn:hover{background:#1e293b}
.qbtn.correct{background:#14532d;border-color:#22c55e;color:#86efac}
.qbtn.wrong{background:#450a0a;border-color:#ef4444;color:#fca5a5}
.quiz-result{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;margin-top:0.85rem;min-height:1.4rem}
.quiz-score{font-size:0.72rem;color:#64748b;font-family:'IBM Plex Mono',monospace;margin-top:0.5rem;text-align:center}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  #detail{grid-template-columns:1fr}
  .quiz-opts{grid-template-columns:1fr}
}
</style>
</head>
<body>

<h1>Electronic Component Symbols</h1>
<p class="subtitle">Foundation &amp; Intermediate reference &mdash; click any symbol to expand &middot; quiz mode to test yourself</p>

<div class="top-bar">
  <button class="mbtn on" onclick="setFilter('all')" id="f-all">All</button>
  <button class="mbtn" onclick="setFilter('passive')" id="f-passive">Passive</button>
  <button class="mbtn" onclick="setFilter('semi')" id="f-semi">Semiconductors</button>
  <button class="mbtn" onclick="setFilter('source')" id="f-source">Sources &amp; Output</button>
  <button class="mbtn" onclick="setFilter('switch')" id="f-switch">Switches</button>
  <button class="mbtn" onclick="setFilter('rf')" id="f-rf">RF / Signal</button>
  <div class="sep"></div>
  <button class="mbtn" onclick="toggleQuiz()" id="btn-quiz">&#127299; Quiz mode</button>
</div>

<!-- Detail panel -->
<div id="detail">
  <canvas id="detail-canvas" width="180" height="180"></canvas>
  <div>
    <div class="detail-name" id="d-name"></div>
    <div class="detail-cat" id="d-cat"></div>
    <div class="detail-desc" id="d-desc"></div>
    <div class="exam-label">Exam point</div>
    <div class="exam-fact" id="d-exam"></div>
  </div>
</div>

<!-- Quiz panel -->
<div id="quiz-panel">
  <div class="quiz-q">Name this component:</div>
  <canvas id="quiz-canvas" width="200" height="200"></canvas>
  <div class="quiz-opts" id="quiz-opts"></div>
  <div class="quiz-result" id="quiz-result"></div>
  <div class="quiz-score" id="quiz-score"></div>
</div>

<!-- Symbol grid -->
<div class="grid" id="grid"></div>

<script>
// ── Drawing helpers ────────────────────────────────────────────────────────────
function drawOn(ctx, fn, size) {
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(size / 2, size / 2);
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  fn(ctx, size);
  ctx.restore();
}

const W = '#e2e8f0';   // wire / default
const A = '#f59e0b';   // amber accent
const C = '#06b6d4';   // cyan accent
const P = '#a78bfa';   // purple accent
const G = '#22c55e';   // green

// ── Component draw functions (ctx centred at 0,0) ─────────────────────────────

function drawResistor(ctx) {
  // IEC rectangle style
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-18,0); ctx.stroke();
  ctx.strokeRect(-18,-9,36,18);
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawResistorUS(ctx) {
  // ANSI zigzag — left lead -28→-18, zigzag -18→18, right lead 18→28
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-18,0); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-18,0);
  [[-13,-10],[-7,10],[-1,-10],[5,10],[11,-10],[18,0]].forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawVarResistor(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-18,0); ctx.stroke();
  ctx.strokeRect(-18,-9,36,18);
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(28,0); ctx.stroke();
  // arrow
  ctx.strokeStyle = A;
  ctx.beginPath(); ctx.moveTo(-12,18); ctx.lineTo(12,-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,-18); ctx.lineTo(4,-14); ctx.moveTo(12,-18); ctx.lineTo(8,-10); ctx.stroke();
}

function drawCapacitor(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6,-16); ctx.lineTo(-6,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,-16); ctx.lineTo(6,16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawElecCap(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6,-16); ctx.lineTo(-6,16); ctx.stroke();
  // curved negative plate — bezier, clearly shorter than positive plate
  ctx.beginPath();
  ctx.moveTo(8,-5);
  ctx.quadraticCurveTo(13,0,8,5);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(28,0); ctx.stroke();
  // + marker
  ctx.strokeStyle = A;
  ctx.beginPath(); ctx.moveTo(-14,-8); ctx.lineTo(-14,-2); ctx.moveTo(-17,-5); ctx.lineTo(-11,-5); ctx.stroke();
}

function drawVarCap(ctx) {
  drawCapacitor(ctx);
  ctx.strokeStyle = A;
  ctx.beginPath(); ctx.moveTo(-12,18); ctx.lineTo(12,-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,-18); ctx.lineTo(4,-14); ctx.moveTo(12,-18); ctx.lineTo(8,-10); ctx.stroke();
}

function drawInductor(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-30,0); ctx.lineTo(-22,0); ctx.stroke();
  // 4 bumps
  for(let i=0;i<4;i++){
    const x=-22+i*13;
    ctx.beginPath(); ctx.arc(x+6.5,0,6.5,Math.PI,0); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(38,0); ctx.stroke();
}

function drawTransformer(ctx) {
  ctx.strokeStyle = W;
  // Primary: left coils
  ctx.beginPath(); ctx.moveTo(-38,-10); ctx.lineTo(-32,-10); ctx.stroke();
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-32+i*10+5,-10,5,Math.PI,0);ctx.stroke();}
  ctx.beginPath(); ctx.moveTo(-2,-10); ctx.lineTo(2,-10); ctx.stroke();
  // Secondary: right coils (mirrored)
  ctx.beginPath(); ctx.moveTo(38,-10); ctx.lineTo(32,-10); ctx.stroke();
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(32-i*10-5,-10,5,0,Math.PI);ctx.stroke();}
  ctx.beginPath(); ctx.moveTo(2,-10); ctx.lineTo(-2,-10); ctx.stroke();
  // Connections
  ctx.beginPath(); ctx.moveTo(-38,-10); ctx.lineTo(-38,10); ctx.lineTo(-32,10); ctx.stroke();
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-32+i*10+5,10,5,Math.PI,0);ctx.stroke();}
  ctx.beginPath(); ctx.moveTo(-2,10); ctx.lineTo(2,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(38,10); ctx.lineTo(38,-10); ctx.stroke();
  // Iron core
  ctx.strokeStyle = A;
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-1,-20); ctx.lineTo(-1,20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-20); ctx.lineTo(2,20); ctx.stroke();
  ctx.lineWidth=1.8;
}

function drawFuse(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-18,0); ctx.stroke();
  ctx.strokeRect(-18,-8,36,16);
  ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(18,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawCrystal(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-14,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14,-14); ctx.lineTo(-14,14); ctx.stroke();
  ctx.fillStyle='#1e293b'; ctx.fillRect(-12,-10,24,20);
  ctx.strokeRect(-12,-10,24,20);
  ctx.beginPath(); ctx.moveTo(12,-14); ctx.lineTo(12,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawDiode(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-14,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14,-14); ctx.lineTo(-14,14); ctx.lineTo(14,0); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,-14); ctx.lineTo(14,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawLED(ctx) {
  drawDiode(ctx);
  // arrows for light
  ctx.strokeStyle = A;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(2,-18); ctx.lineTo(14,-30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,-30); ctx.lineTo(10,-26); ctx.moveTo(14,-30); ctx.lineTo(10,-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,-22); ctx.lineTo(20,-34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,-34); ctx.lineTo(16,-30); ctx.moveTo(20,-34); ctx.lineTo(16,-26); ctx.stroke();
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = W;
}

function drawZener(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-14,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14,-14); ctx.lineTo(-14,14); ctx.lineTo(14,0); ctx.closePath(); ctx.stroke();
  // Zener bar with bends
  ctx.beginPath(); ctx.moveTo(14,-14); ctx.lineTo(14,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,-14); ctx.lineTo(20,-20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,14); ctx.lineTo(8,20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawNPN(ctx) {
  ctx.strokeStyle = W;
  // Base
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-8,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8,-22); ctx.lineTo(-8,22); ctx.stroke();
  // Collector
  ctx.beginPath(); ctx.moveTo(-8,-12); ctx.lineTo(12,-22); ctx.lineTo(12,-30); ctx.stroke();
  // Emitter with arrow
  ctx.beginPath(); ctx.moveTo(-8,12); ctx.lineTo(12,22); ctx.lineTo(12,30); ctx.stroke();
  // Arrow out (NPN)
  ctx.beginPath(); ctx.moveTo(2,18); ctx.lineTo(12,22); ctx.lineTo(8,14); ctx.closePath();
  ctx.fillStyle=W; ctx.fill(); ctx.stroke();
  // Labels
  ctx.fillStyle='#64748b'; ctx.font='9px IBM Plex Mono,monospace';
  ctx.fillText('C',-2,-28); ctx.fillText('E',-2,34); ctx.fillText('B',-26,12);
}

function drawPNP(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-8,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8,-22); ctx.lineTo(-8,22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8,-12); ctx.lineTo(12,-22); ctx.lineTo(12,-30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8,12); ctx.lineTo(12,22); ctx.lineTo(12,30); ctx.stroke();
  // Arrow in (PNP) — at collector end
  ctx.beginPath(); ctx.moveTo(-2,-18); ctx.lineTo(-8,-12); ctx.lineTo(0,-10); ctx.closePath();
  ctx.fillStyle=W; ctx.fill(); ctx.stroke();
  ctx.fillStyle='#64748b'; ctx.font='9px IBM Plex Mono,monospace';
  ctx.fillText('C',-2,-28); ctx.fillText('E',-2,34); ctx.fillText('B',-26,12);
}

function drawNFET(ctx) {
  ctx.strokeStyle = W;
  // Gate
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-16,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16,-20); ctx.lineTo(-16,20); ctx.stroke();
  // Channel (dashed line)
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(-10,-20); ctx.lineTo(-10,20); ctx.stroke();
  ctx.setLineDash([]);
  // Drain and Source
  ctx.beginPath(); ctx.moveTo(-10,-14); ctx.lineTo(8,-14); ctx.lineTo(8,-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10,14); ctx.lineTo(8,14); ctx.lineTo(8,28); ctx.stroke();
  // Arrow into channel (N-type)
  ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-4); ctx.lineTo(6,0); ctx.lineTo(2,4); ctx.closePath();
  ctx.fillStyle=W; ctx.fill(); ctx.stroke();
  ctx.fillStyle='#64748b'; ctx.font='9px IBM Plex Mono,monospace';
  ctx.fillText('D',10,-24); ctx.fillText('S',10,26); ctx.fillText('G',-28,12);
}

function drawBattery(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-10,0); ctx.stroke();
  // 3 cells
  for(let i=0;i<3;i++){
    const x=-10+i*12;
    ctx.lineWidth=i%2===0?3:1;
    ctx.beginPath(); ctx.moveTo(x,-14+i%2*6); ctx.lineTo(x,14-i%2*6); ctx.stroke();
  }
  ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(26,0); ctx.lineTo(28,0); ctx.stroke();
  // + / - labels
  ctx.fillStyle=A; ctx.font='bold 11px IBM Plex Mono,monospace';
  ctx.fillText('+',18,-16);
  ctx.fillStyle='#64748b';
  ctx.fillText('\u2212',-26,-16);
}

function drawACSource(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-20,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(28,0); ctx.stroke();
  // sine symbol
  ctx.beginPath();
  ctx.moveTo(-12,0);
  for(let t=0;t<=Math.PI*2;t+=0.1){ctx.lineTo(-12+t*(24/(Math.PI*2)),Math.sin(t)*8);}
  ctx.stroke();
}

function drawDCSource(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-20,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(28,0); ctx.stroke();
  ctx.strokeStyle=A;
  ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(-8,8); ctx.stroke(); // long +
  ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(-5,0); ctx.stroke();
  ctx.strokeStyle='#64748b';
  ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(11,0); ctx.stroke(); // short -
}

function drawGround(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(0,-28); ctx.lineTo(0,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20,0); ctx.lineTo(20,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12,8); ctx.lineTo(12,8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5,16); ctx.lineTo(5,16); ctx.stroke();
}

function drawAntenna(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(0,28); ctx.lineTo(0,-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(-24,-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(24,-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16,-20); ctx.lineTo(-8,-28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16,-20); ctx.lineTo(8,-28); ctx.stroke();
}

function drawSpeaker(ctx) {
  ctx.strokeStyle = W;
  // voice coil / input leads
  ctx.beginPath(); ctx.moveTo(-28,-10); ctx.lineTo(-14,-10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,10); ctx.lineTo(-14,10); ctx.stroke();
  // box
  ctx.strokeRect(-14,-10,10,20);
  // cone
  ctx.beginPath(); ctx.moveTo(-4,-10); ctx.lineTo(20,-24); ctx.lineTo(20,24); ctx.lineTo(-4,10); ctx.closePath(); ctx.stroke();
}

function drawMic(ctx) {
  ctx.strokeStyle = W;
  // Capsule circle — raised (centre y=-14)
  ctx.beginPath(); ctx.arc(0,-14,12,0,Math.PI*2); ctx.stroke();
  // Body side lines (from capsule centre level down to stand collar)
  ctx.beginPath(); ctx.moveTo(-12,-14); ctx.lineTo(-12,4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,-14); ctx.lineTo(12,4); ctx.stroke();
  // Bottom of body — arc curving DOWNWARD from (12,4) through (0,16) to (-12,4)
  ctx.beginPath(); ctx.arc(0,4,12,0,Math.PI); ctx.stroke();
  // Vertical stand post
  ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(0,26); ctx.stroke();
  // Base
  ctx.beginPath(); ctx.moveTo(-10,26); ctx.lineTo(10,26); ctx.stroke();
}

function drawMeter(ctx, letter) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-20,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(28,0); ctx.stroke();
  ctx.fillStyle = C;
  ctx.font = 'bold 14px IBM Plex Mono,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, 0, 1);
}

function drawLamp(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-18,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(28,0); ctx.stroke();
  // X inside
  ctx.beginPath(); ctx.moveTo(-11,-11); ctx.lineTo(11,11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,-11); ctx.lineTo(-11,11); ctx.stroke();
}

function drawSPST(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-12,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-12,0,3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(12,0,3,0,Math.PI*2); ctx.stroke();
  // open switch lever
  ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(10,-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(28,0); ctx.stroke();
}

function drawSPDT(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.moveTo(-28,0); ctx.lineTo(-12,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-12,0,3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(14,-14,3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(14,14,3,0,Math.PI*2); ctx.stroke();
  // lever to upper contact
  ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(12,-14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,-14); ctx.lineTo(28,-14); ctx.stroke();
  ctx.strokeStyle='#334155';
  ctx.beginPath(); ctx.moveTo(14,14); ctx.lineTo(28,14); ctx.stroke();
}

function drawRelay(ctx) {
  ctx.strokeStyle = W;
  // Coil box
  ctx.strokeRect(-28,-22,30,18);
  // Coil symbol inside
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-22+i*8+4,-13,4,Math.PI,0);ctx.stroke();}
  // Coil leads
  ctx.beginPath(); ctx.moveTo(-28,-13); ctx.lineTo(-34,-13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-13); ctx.lineTo(8,-13); ctx.stroke();
  // Switch contacts
  ctx.beginPath(); ctx.moveTo(-14,4); ctx.lineTo(-14,28); ctx.stroke();
  ctx.beginPath(); ctx.arc(-14,28,3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(14,20,3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-14,28); ctx.lineTo(12,20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,20); ctx.lineTo(28,20); ctx.stroke();
}

function drawAmplifier(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath();
  ctx.moveTo(-24,-22); ctx.lineTo(-24,22); ctx.lineTo(24,0); ctx.closePath();
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-34,0); ctx.lineTo(-24,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(34,0); ctx.stroke();
  ctx.fillStyle=P; ctx.font='bold 12px IBM Plex Mono,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('A',-6,0);
}

function drawMixer(ctx) {
  ctx.strokeStyle = W;
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.stroke();
  // X symbol
  ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(-11,-11); ctx.lineTo(11,11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,-11); ctx.lineTo(-11,11); ctx.stroke();
  ctx.lineWidth=1.8;
  // ports
  ctx.beginPath(); ctx.moveTo(-28,-14); ctx.lineTo(-18,-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-28,14); ctx.lineTo(-18,8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(30,0); ctx.stroke();
}

function drawFilter(ctx) {
  ctx.strokeStyle = W;
  ctx.strokeRect(-22,-16,44,32);
  ctx.beginPath(); ctx.moveTo(-34,0); ctx.lineTo(-22,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(34,0); ctx.stroke();
  ctx.fillStyle=C; ctx.font='bold 11px IBM Plex Mono,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('BPF',0,0);
}

function drawOscillator(ctx) {
  ctx.strokeStyle = W;
  ctx.strokeRect(-22,-20,44,40);
  ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(34,0); ctx.stroke();
  // sine output symbol
  ctx.strokeStyle=G;
  ctx.beginPath();
  for(let i=0;i<=30;i++){
    const t=i/30*Math.PI*2-Math.PI;
    const x=-14+i;
    const y=Math.sin(t)*8;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle=W;
  ctx.fillStyle=P; ctx.font='bold 9px IBM Plex Mono,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('OSC',0,14);
}

// ── State ───────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeId     = null;
let quizMode     = false;
let quizQ        = null;   // current question component
let quizScore    = {correct:0, total:0};

// ── Render grid ─────────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  COMPONENTS.forEach(comp => {
    const show = activeFilter === 'all' || comp.cat === activeFilter;
    const card = document.createElement('div');
    card.className = 'sym-card' + (comp.id === activeId ? ' active' : '') + (!show ? ' dim' : '');
    card.dataset.id = comp.id;
    card.onclick = () => onCardClick(comp.id);

    const cv = document.createElement('canvas');
    cv.className = 'sym-canvas';
    cv.width = 100; cv.height = 100;
    const ctx = cv.getContext('2d');
    drawOn(ctx, comp.draw, 100);

    const nm = document.createElement('div');
    nm.className = 'sym-name';
    nm.textContent = comp.name;

    const ct = document.createElement('div');
    ct.className = 'cat-tag';
    ct.textContent = comp.cat === 'passive' ? 'Passive'
                   : comp.cat === 'semi'    ? 'Semiconductor'
                   : comp.cat === 'source'  ? 'Source/Output'
                   : comp.cat === 'switch'  ? 'Switch'
                   : 'RF/Signal';

    card.appendChild(cv); card.appendChild(nm); card.appendChild(ct);
    grid.appendChild(card);
  });
}

// ── Detail panel ─────────────────────────────────────────────────────────────────
function showDetail(comp) {
  const panel = document.getElementById('detail');
  const dcv   = document.getElementById('detail-canvas');
  document.getElementById('d-name').textContent  = comp.name;
  document.getElementById('d-cat').textContent   =
    comp.cat === 'passive' ? 'Passive Component'
    : comp.cat === 'semi'  ? 'Semiconductor'
    : comp.cat === 'source'? 'Source / Output'
    : comp.cat === 'switch'? 'Switch'
    : 'RF / Signal';
  document.getElementById('d-desc').textContent  = comp.desc;
  document.getElementById('d-exam').textContent  = comp.exam;
  drawOn(dcv.getContext('2d'), comp.draw, 180);
  panel.classList.add('show');
}

function hideDetail() {
  document.getElementById('detail').classList.remove('show');
  activeId = null;
  buildGrid();
}

function onCardClick(id) {
  if (quizMode) return;
  if (activeId === id) { hideDetail(); return; }
  activeId = id;
  const comp = COMPONENTS.find(c => c.id === id);
  showDetail(comp);
  buildGrid();
  document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ── Category filter ──────────────────────────────────────────────────────────────
function setFilter(cat) {
  activeFilter = cat;
  ['all','passive','semi','source','switch','rf'].forEach(f => {
    document.getElementById('f-'+f).classList.toggle('on', f === cat);
  });
  buildGrid();
}

// ── Quiz mode ────────────────────────────────────────────────────────────────────
function toggleQuiz() {
  quizMode = !quizMode;
  document.getElementById('btn-quiz').classList.toggle('quiz-on', quizMode);
  document.getElementById('quiz-panel').classList.toggle('show', quizMode);
  document.getElementById('detail').classList.remove('show');
  activeId = null;
  buildGrid();
  if (quizMode) nextQuestion();
}

function nextQuestion() {
  // Pick random component (filtered if active filter set)
  const pool = activeFilter === 'all'
    ? COMPONENTS
    : COMPONENTS.filter(c => c.cat === activeFilter);
  if (pool.length < 4) return;

  quizQ = pool[Math.floor(Math.random() * pool.length)];

  // Draw on quiz canvas
  const qcv = document.getElementById('quiz-canvas');
  drawOn(qcv.getContext('2d'), quizQ.draw, 200);

  // Build 4 options (correct + 3 random wrong)
  const others = pool.filter(c => c.id !== quizQ.id);
  const wrong = [];
  while (wrong.length < 3) {
    const pick = others[Math.floor(Math.random() * others.length)];
    if (!wrong.includes(pick)) wrong.push(pick);
  }
  const opts = [quizQ, ...wrong].sort(() => Math.random() - 0.5);

  const container = document.getElementById('quiz-opts');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qbtn';
    btn.textContent = opt.name;
    btn.onclick = () => answerQuiz(opt.id, btn, container);
    container.appendChild(btn);
  });

  document.getElementById('quiz-result').textContent = '';
  updateScore();
}

function answerQuiz(id, btn, container) {
  // Disable all buttons
  container.querySelectorAll('.qbtn').forEach(b => { b.onclick = null; });
  quizScore.total++;
  if (id === quizQ.id) {
    btn.classList.add('correct');
    document.getElementById('quiz-result').textContent = '✓ Correct!';
    document.getElementById('quiz-result').style.color = '#22c55e';
    quizScore.correct++;
  } else {
    btn.classList.add('wrong');
    // Highlight correct answer
    container.querySelectorAll('.qbtn').forEach(b => {
      if (b.textContent === quizQ.name) b.classList.add('correct');
    });
    document.getElementById('quiz-result').textContent = '✗ ' + quizQ.name;
    document.getElementById('quiz-result').style.color = '#ef4444';
  }
  updateScore();
  setTimeout(nextQuestion, 1600);
}

function updateScore() {
  const el = document.getElementById('quiz-score');
  if (quizScore.total === 0) { el.textContent = ''; return; }
  const pct = Math.round(quizScore.correct / quizScore.total * 100);
  el.textContent = `Score: ${quizScore.correct} / ${quizScore.total} (${pct}%)`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildGrid();
</script>
