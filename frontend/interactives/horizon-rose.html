  [358.0,10.473,0.2,209.8],
  [358.5,10.473,0.2,209.8],
  [359.0,10.473,0.2,209.8],
  [359.5,10.473,0.2,209.8]
];
CONFIG.horizon_data = DATA;

// ================================================================
// CANVAS SETUP
// ================================================================
const canvas = document.getElementById('rose');
const ctx    = canvas.getContext('2d');
const W = 800, H = 800;
canvas.width  = W;
canvas.height = H;
const CX = W / 2, CY = H / 2, PLOT_R = 295;

// ================================================================
// HELPERS
// ================================================================
function azToRad(az) {
  // Compass azimuth (0=N, CW) → canvas angle (0=E, CW)
  return (az - 90) * Math.PI / 180;
}

function elevToR(el) {
  return (el / CONFIG.max_scale) * PLOT_R;
}

function elevColor(el) {
  let r, g, b;
  if (el <= 6) {
    const t = el / 6;
    r = Math.round(34  + t * (245 - 34));
    g = Math.round(197 + t * (158 - 197));
    b = Math.round(94  + t * (11  - 94));
  } else {
    const t = Math.min(1, (el - 6) / 9);
    r = Math.round(245 + t * (239 - 245));
    g = Math.round(158 + t * (68  - 158));
    b = Math.round(11  + t * (68  - 11));
  }
  return `rgb(${r},${g},${b})`;
}

// ================================================================
// DRAW
// ================================================================
let activeIdx = -1;

function draw() {
  ctx.clearRect(0, 0, W, H);

  // -- Background
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);

  // -- Elevation rings
  for (let deg = CONFIG.ring_step; deg <= CONFIG.max_scale; deg += CONFIG.ring_step) {
    const r = elevToR(deg);
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // -- Spoke lines (every 30°)
  for (let az = 0; az < 360; az += 30) {
    const a = azToRad(az);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + PLOT_R * Math.cos(a), CY + PLOT_R * Math.sin(a));
    ctx.strokeStyle = '#1a2234';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // -- Filled sectors
  const halfStep = 0.25 * Math.PI / 180;
  DATA.forEach(function(d, i) {
    const az  = d[0], el = d[1];
    const r   = elevToR(el);
    const mid = azToRad(az);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, r, mid - halfStep, mid + halfStep, false);
    ctx.closePath();
    if (i === activeIdx) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
    } else {
      ctx.fillStyle = elevColor(el);
    }
    ctx.fill();
  });

  // -- Median ring
  const medR = elevToR(CONFIG.median_skyline);
  ctx.beginPath();
  ctx.arc(CX, CY, medR, 0, Math.PI * 2);
  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.shadowColor = '#a78bfa';
  ctx.shadowBlur  = 5;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur  = 0;

  // -- Wire bearing line
  const wa1 = azToRad(CONFIG.wire_bearing);
  const wa2 = azToRad(CONFIG.wire_bearing + 180);
  const x1 = CX + PLOT_R * Math.cos(wa1), y1 = CY + PLOT_R * Math.sin(wa1);
  const x2 = CX + PLOT_R * Math.cos(wa2), y2 = CY + PLOT_R * Math.sin(wa2);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([8, 4]);
  ctx.shadowColor = '#f59e0b';
  ctx.shadowBlur  = 6;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur  = 0;

  // Wire bearing end-labels
  const LR = PLOT_R + 22;
  ctx.font = '11px "IBM Plex Mono", monospace';
  ctx.fillStyle = '#f59e0b';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Nudge labels so they don't overlap the ring edge
  function labelOffset(angle) {
    return { dx: Math.cos(angle) * LR, dy: Math.sin(angle) * LR };
  }
  const o1 = labelOffset(wa1);
  const o2 = labelOffset(wa2);
  ctx.fillText('027.8\u00b0', CX + o1.dx, CY + o1.dy);
  ctx.fillText('207.8\u00b0', CX + o2.dx, CY + o2.dy);

  // -- Cardinal labels
  const cardinals = [
    {az:0,l:'N'},{az:45,l:'NE'},{az:90,l:'E'},{az:135,l:'SE'},
    {az:180,l:'S'},{az:225,l:'SW'},{az:270,l:'W'},{az:315,l:'NW'}
  ];
  const CL = PLOT_R + 18;
  ctx.font = 'bold 13px "IBM Plex Sans", sans-serif';
  ctx.textBaseline = 'middle';
  cardinals.forEach(function(c) {
    const a = azToRad(c.az);
    ctx.fillStyle = c.l === 'N' ? '#e2e8f0' : '#94a3b8';
    ctx.textAlign = 'center';
    ctx.fillText(c.l, CX + CL * Math.cos(a), CY + CL * Math.sin(a));
  });

  // -- Elevation ring labels (at E+5° to avoid spoke overlap)
  ctx.font = '10px "IBM Plex Mono", monospace';
  ctx.fillStyle = '#475569';
  ctx.textAlign  = 'left';
  ctx.textBaseline = 'bottom';
  const labelAng = azToRad(95);
  for (let deg = CONFIG.ring_step; deg <= CONFIG.max_scale; deg += CONFIG.ring_step) {
    const r = elevToR(deg);
    ctx.fillText(deg + '\u00b0', CX + r * Math.cos(labelAng) + 2, CY + r * Math.sin(labelAng) - 2);
  }

  // -- Centre dot
  ctx.beginPath();
  ctx.arc(CX, CY, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#e2e8f0';
  ctx.fill();
}

// ================================================================
// HOVER
// ================================================================
const tooltip = document.getElementById('tooltip');
const wrap    = document.getElementById('wrap');

canvas.addEventListener('mousemove', function(e) {
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (W / rect.width);
  const py = (e.clientY - rect.top)  * (H / rect.height);
  const dx = px - CX, dy = py - CY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < 8 || dist > PLOT_R + 5) {
    tooltip.style.display = 'none';
    if (activeIdx !== -1) { activeIdx = -1; draw(); }
    return;
  }

  // Azimuth from atan2 (N=up, CW)
  let az = Math.atan2(dx, -dy) * 180 / Math.PI;
  if (az < 0) az += 360;

  // Find nearest data point
  let best = 0, bestD = 999;
  DATA.forEach(function(d, i) {
    let diff = Math.abs(d[0] - az);
    if (diff > 180) diff = 360 - diff;
    if (diff < bestD) { bestD = diff; best = i; }
  });

  if (best !== activeIdx) { activeIdx = best; draw(); }

  const d = DATA[best];
  tooltip.innerHTML =
    '<b>' + d[0].toFixed(1) + '\u00b0</b><br>' +
    'Elevation: ' + d[1].toFixed(2) + '\u00b0<br>' +
    'Range: ' + d[2] + '\u2009km<br>' +
    'Peak: ' + d[3] + '\u2009m\u00a0AMSL';

  const wrapRect = wrap.getBoundingClientRect();
  let tx = e.clientX - wrapRect.left + 14;
  let ty = e.clientY - wrapRect.top  - 12;
  if (tx + 160 > wrap.offsetWidth) tx -= 170;
  tooltip.style.left    = tx + 'px';
  tooltip.style.top     = ty + 'px';
  tooltip.style.display = 'block';
});

canvas.addEventListener('mouseleave', function() {
  tooltip.style.display = 'none';
  activeIdx = -1;
  draw();
});

// ================================================================
// STATS
// ================================================================
(function initStats() {
  const elevs = DATA.map(function(d) { return d[1]; });
  const minEl = Math.min.apply(null, elevs);
  const maxEl = Math.max.apply(null, elevs);
  const sorted = elevs.slice().sort(function(a,b){return a-b;});
  const medEl  = sorted[Math.floor(sorted.length / 2)];

  const minIdx = elevs.indexOf(minEl);
  const maxIdx = elevs.indexOf(maxEl);

  document.getElementById('s-min').textContent = minEl.toFixed(2) + '\u00b0';
  document.getElementById('s-min-sub').textContent = DATA[minIdx][0].toFixed(1) + '\u00b0 bearing';
  document.getElementById('s-max').textContent = maxEl.toFixed(2) + '\u00b0';
  document.getElementById('s-max-sub').textContent = DATA[maxIdx][0].toFixed(1) + '\u00b0 bearing';
  document.getElementById('s-med').textContent = CONFIG.median_skyline.toFixed(1) + '\u00b0';
  document.getElementById('s-wire').textContent =
    CONFIG.wire_bearing.toFixed(1) + '\u00b0 / ' + (CONFIG.wire_bearing + 180).toFixed(1) + '\u00b0';
})();

// ================================================================
// INIT
// ================================================================
draw();
</script>
</body>
</html>
