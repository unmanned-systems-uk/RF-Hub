<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-Parameter Signal Flow</title>
  <!-- Favicons — SPOT (see /favicon.ico, /apple-touch-icon.png, /site.webmanifest) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#06b6d4">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e2e8f0;font-family:'IBM Plex Sans',sans-serif;font-weight:300;min-height:100vh;padding:16px}
h1{font-family:'DM Serif Display',serif;font-size:1.35rem;color:#e2e8f0;margin-bottom:3px}
.sub{color:#94a3b8;font-size:0.78rem;margin-bottom:14px}
.card{background:#111827;border:1px solid #1e293b;border-radius:8px;padding:14px;margin-bottom:10px}
canvas{display:block;width:100%;border-radius:4px;background:#0a0e1a}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:10px}
.tog{background:#1a2234;border:1px solid #1e293b;color:#94a3b8;font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:6px 14px;border-radius:4px;cursor:pointer;transition:.15s all}
.tog.on{background:#a78bfa18;border-color:#a78bfa;color:#a78bfa}
.sl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.sl-lbl{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;color:#94a3b8;white-space:nowrap}
input[type=range]{-webkit-appearance:none;width:170px;height:4px;background:#1e293b;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:#a78bfa;border-radius:50%;cursor:pointer}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.pb{background:#1a2234;border:1px solid #1e293b;color:#64748b;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;padding:4px 10px;border-radius:4px;cursor:pointer;transition:.15s}
.pb:hover{border-color:#94a3b8;color:#94a3b8}
.readouts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.ro{background:#0a0e1a;border:1px solid #1e293b;border-radius:6px;padding:7px 14px;text-align:center;min-width:90px}
.ro-lbl{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:#64748b;margin-bottom:2px}
.ro-val{font-family:'IBM Plex Mono',monospace;font-size:0.9rem;font-weight:bold}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.li{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:#94a3b8}
.ld{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<main>
<h1>S-Parameter Signal Flow</h1>
<p class="sub">Animated wave variables — two-port network</p>

<div class="card">
  <canvas id="cv" width="640" height="260"></canvas>

  <div class="row">
    <button class="tog on" id="bFwd" onclick="setMode('fwd')">▶ Forward &nbsp;S11 / S21</button>
    <button class="tog"    id="bRev" onclick="setMode('rev')">◀ Reverse &nbsp;S22 / S12</button>
  </div>

  <div class="row" style="margin-top:8px">
    <div class="sl-row">
      <span class="sl-lbl">Reflection</span>
      <input type="range" id="rsl" min="0" max="100" value="5" oninput="setRefl(+this.value)">
      <span class="sl-lbl" id="rPct">5%</span>
    </div>
  </div>

  <div class="presets">
    <button class="pb" onclick="preset(0)">Perfect through (0%)</button>
    <button class="pb" onclick="preset(5)">Good match (5%)</button>
    <button class="pb" onclick="preset(50)">Poor match (50%)</button>
    <button class="pb" onclick="preset(100)">Open / Short (100%)</button>
  </div>
</div>

<div class="card">
  <div class="readouts">
    <div class="ro"><div class="ro-lbl" id="lS11">S11</div><div class="ro-val" id="vS11" style="color:#ef4444">—</div></div>
    <div class="ro"><div class="ro-lbl" id="lS21">S21</div><div class="ro-val" id="vS21" style="color:#22c55e">—</div></div>
    <div class="ro"><div class="ro-lbl">|Γ|</div><div class="ro-val" id="vGam" style="color:#94a3b8">—</div></div>
    <div class="ro"><div class="ro-lbl">VSWR</div><div class="ro-val" id="vVSWR" style="color:#94a3b8">—</div></div>
  </div>
  <div class="legend">
    <div class="li"><div class="ld" style="background:#f59e0b"></div>Incident (a)</div>
    <div class="li"><div class="ld" style="background:#ef4444"></div>Reflected (b — same port)</div>
    <div class="li"><div class="ld" style="background:#22c55e"></div>Transmitted (b — far port)</div>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 640, H = 260;

// Geometry
const CX = W/2, CY = H/2;
const DW = 130, DH = 80;
const DL = CX - DW/2, DR = CX + DW/2, DT = CY - DH/2, DB = CY + DH/2;
const P1X = 36, P2X = W - 36;
const TRACK_INC = CY - 10;  // incident track y
const TRACK_REF = CY + 10;  // reflected track y

let mode = 'fwd';
let refl = 5;   // percent
let dots = [];
let frame = 0;
let spawnAcc = {a1:0, b1:0, a2:0, b2:0};

const INTERVAL = 32;  // base spawn interval frames

function gamma() { return refl / 100; }
function trans() { const g = gamma(); return Math.sqrt(Math.max(0, 1 - g*g)); }

// --- Dot ---
class Dot {
  constructor(sx, ex, y, col) {
    this.x = sx; this.sx = sx; this.ex = ex;
    this.y = y; this.col = col;
    this.dir = ex > sx ? 1 : -1;
    this.dead = false;
  }
  step() {
    this.x += 2.2 * this.dir;
    if (this.dir > 0 && this.x >= this.ex) this.dead = true;
    if (this.dir < 0 && this.x <= this.ex) this.dead = true;
  }
  draw() {
    ctx.save();
    ctx.shadowColor = this.col; ctx.shadowBlur = 9;
    ctx.beginPath(); ctx.arc(this.x, this.y, 4.5, 0, 6.283);
    ctx.fillStyle = this.col; ctx.fill();
    ctx.restore();
  }
}

function spawnFwd() {
  // a1: P1 → DL on incident track
  dots.push(new Dot(P1X, DL, TRACK_INC, '#f59e0b'));

  const G = gamma(), T = trans();
  // b1: DL → P1 on reflected track (proportional to G)
  spawnAcc.b1 += G;
  if (spawnAcc.b1 >= 1) { spawnAcc.b1 -= 1; dots.push(new Dot(DL, P1X, TRACK_REF, '#ef4444')); }

  // b2: DR → P2 on incident track (transmitted)
  spawnAcc.b2 += T;
  if (spawnAcc.b2 >= 1) { spawnAcc.b2 -= 1; dots.push(new Dot(DR, P2X, TRACK_INC, '#22c55e')); }
}

function spawnRev() {
  // a2: P2 → DR on incident track
  dots.push(new Dot(P2X, DR, TRACK_INC, '#f59e0b'));

  const G = gamma(), T = trans();
  // b2 reflected: DR → P2 reflected track
  spawnAcc.b2 += G;
  if (spawnAcc.b2 >= 1) { spawnAcc.b2 -= 1; dots.push(new Dot(DR, P2X, TRACK_REF, '#ef4444')); }

  // b1 transmitted: DL → P1
  spawnAcc.b1 += T;
  if (spawnAcc.b1 >= 1) { spawnAcc.b1 -= 1; dots.push(new Dot(DL, P1X, TRACK_INC, '#22c55e')); }
}

// --- Draw helpers ---
function drawBg() {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);
}

function drawTrack(x1, x2, y, col) {
  ctx.save();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = col + '33';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
  ctx.restore();
}

function arrow(x, y, right, col) {
  const d = right ? 1 : -1;
  ctx.save();
  ctx.fillStyle = col + '66';
  ctx.beginPath();
  ctx.moveTo(x, y - 4);
  ctx.lineTo(x + d*8, y);
  ctx.lineTo(x, y + 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawDevice() {
  // Fill
  ctx.fillStyle = '#0d1525';
  ctx.fillRect(DL, DT, DW, DH);
  // Border glow
  ctx.save();
  ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 8;
  ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1.5;
  ctx.strokeRect(DL, DT, DW, DH);
  ctx.restore();
  // Label
  ctx.textAlign = 'center';
  ctx.fillStyle = '#a78bfa';
  ctx.font = "bold 12px 'IBM Plex Mono',monospace";
  ctx.fillText('DUT', CX, CY - 5);
  ctx.fillStyle = '#64748b';
  ctx.font = "9px 'IBM Plex Mono',monospace";
  ctx.fillText('2-Port Network', CX, CY + 10);
}

function drawPortBox(x, label, active) {
  const bw = 38, bh = 26;
  const bx = x - bw/2, by = CY - bh/2;
  ctx.save();
  if (active) {
    ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 8;
    ctx.strokeStyle = '#f59e0b';
  } else {
    ctx.strokeStyle = '#334155';
  }
  ctx.lineWidth = 1;
  ctx.fillStyle = active ? '#1a1200' : '#0f172a';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeRect(bx, by, bw, bh);
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillStyle = active ? '#f59e0b' : '#64748b';
  ctx.font = "bold 9px 'IBM Plex Mono',monospace";
  ctx.fillText(label, x, CY - 5);
  if (active) {
    ctx.fillStyle = '#f59e0b88';
    ctx.font = "8px 'IBM Plex Mono',monospace";
    ctx.fillText('SRC', x, CY + 7);
  }
}

function waveLabel(x, y, text, col) {
  ctx.save();
  ctx.font = "italic bold 11px 'IBM Plex Mono',monospace";
  ctx.fillStyle = col;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawLabels() {
  const G = gamma(), T = trans();
  const showRef = G > 0.01, showTrans = T > 0.01;

  if (mode === 'fwd') {
    // a1 label — midpoint of P1→DL on upper track
    const mid1 = (P1X + DL) / 2;
    waveLabel(mid1, TRACK_INC - 14, 'a\u2081', '#f59e0b');
    arrow(mid1, TRACK_INC - 2, true, '#f59e0b');

    // b1 label — same segment, lower track
    if (showRef) {
      waveLabel(mid1, TRACK_REF + 18, 'b\u2081', '#ef4444');
      arrow(mid1, TRACK_REF + 2, false, '#ef4444');
    }

    // b2 label — midpoint of DR→P2
    if (showTrans) {
      const mid2 = (DR + P2X) / 2;
      waveLabel(mid2, TRACK_INC - 14, 'b\u2082', '#22c55e');
      arrow(mid2, TRACK_INC - 2, true, '#22c55e');
    }
  } else {
    // a2 label
    const mid2 = (DR + P2X) / 2;
    waveLabel(mid2, TRACK_INC - 14, 'a\u2082', '#f59e0b');
    arrow(mid2, TRACK_INC - 2, false, '#f59e0b');

    // b2 reflected
    if (showRef) {
      waveLabel(mid2, TRACK_REF + 18, 'b\u2082', '#ef4444');
      arrow(mid2, TRACK_REF + 2, true, '#ef4444');
    }

    // b1 transmitted
    if (showTrans) {
      const mid1 = (P1X + DL) / 2;
      waveLabel(mid1, TRACK_INC - 14, 'b\u2081', '#22c55e');
      arrow(mid1, TRACK_INC - 2, false, '#22c55e');
    }
  }

  // Port headers
  ctx.textAlign = 'center';
  ctx.font = "10px 'IBM Plex Mono',monospace";
  ctx.fillStyle = '#334155';
  ctx.fillText('Port 1', P1X + (DL - P1X)/2, 18);
  ctx.fillText('Port 2', DR + (P2X - DR)/2, 18);
}

function updateReadouts() {
  const G = gamma(), T = trans();
  const s11 = G < 0.001 ? '−∞' : (20*Math.log10(G)).toFixed(1)+' dB';
  const s21 = T < 0.001 ? '−∞' : (20*Math.log10(T)).toFixed(1)+' dB';
  const vswr = G >= 0.999 ? '∞' : ((1+G)/(1-G)).toFixed(2)+':1';

  if (mode === 'fwd') {
    document.getElementById('lS11').textContent = 'S11';
    document.getElementById('lS21').textContent = 'S21';
    document.getElementById('vS11').textContent = s11;
    document.getElementById('vS21').textContent = s21;
  } else {
    document.getElementById('lS11').textContent = 'S22';
    document.getElementById('lS21').textContent = 'S12';
    document.getElementById('vS11').textContent = s11;
    document.getElementById('vS21').textContent = s21;
  }
  document.getElementById('vGam').textContent = G.toFixed(3);
  document.getElementById('vVSWR').textContent = vswr;
}

function tick() {
  frame++;

  if (frame % INTERVAL === 0) {
    if (mode === 'fwd') spawnFwd();
    else              spawnRev();
  }

  drawBg();

  // Tracks
  if (mode === 'fwd') {
    drawTrack(P1X, DL, TRACK_INC, '#f59e0b');
    drawTrack(P1X, DL, TRACK_REF, '#ef4444');
    drawTrack(DR, P2X, TRACK_INC, '#22c55e');
  } else {
    drawTrack(DR, P2X, TRACK_INC, '#f59e0b');
    drawTrack(DR, P2X, TRACK_REF, '#ef4444');
    drawTrack(P1X, DL, TRACK_INC, '#22c55e');
  }

  drawDevice();

  if (mode === 'fwd') {
    drawPortBox(P1X, 'PORT 1', true);
    drawPortBox(P2X, 'PORT 2', false);
  } else {
    drawPortBox(P1X, 'PORT 1', false);
    drawPortBox(P2X, 'PORT 2', true);
  }

  drawLabels();

  // Dots
  for (let i = dots.length - 1; i >= 0; i--) {
    dots[i].step();
    dots[i].draw();
    if (dots[i].dead) dots.splice(i, 1);
  }
  if (dots.length > 80) dots.splice(0, dots.length - 80);

  updateReadouts();
  requestAnimationFrame(tick);
}

function setMode(m) {
  mode = m;
  dots = [];
  spawnAcc = {a1:0, b1:0, a2:0, b2:0};
  frame = 0;
  document.getElementById('bFwd').classList.toggle('on', m === 'fwd');
  document.getElementById('bRev').classList.toggle('on', m === 'rev');
}

function setRefl(v) {
  refl = v;
  document.getElementById('rPct').textContent = v + '%';
  dots = []; spawnAcc = {a1:0, b1:0, a2:0, b2:0};
}

function preset(v) {
  refl = v;
  document.getElementById('rsl').value = v;
  document.getElementById('rPct').textContent = v + '%';
  dots = []; spawnAcc = {a1:0, b1:0, a2:0, b2:0};
}

tick();

// ── Auto-height for iframe embedding — reports document height to parent ──
// Same pattern as filter-signal.html: fires on load and on any layout
// change (e.g. the preset/legend rows wrapping onto more lines at narrow
// embed widths) via ResizeObserver, so the embedding page can size the
// iframe to fit exactly instead of guessing a fixed height.
(function () {
  if (window.parent === window) return; // not embedded, nothing to report
  let lastH = 0;
  function reportHeight() {
    const h = document.documentElement.scrollHeight;
    if (h === lastH) return;
    lastH = h;
    window.parent.postMessage({ type: 'rfhub:iframe-height', height: h }, window.location.origin);
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver(reportHeight).observe(document.body);
  } else {
    window.addEventListener('resize', reportHeight);
  }
  window.addEventListener('load', reportHeight);
  requestAnimationFrame(reportHeight);
})();
</script>
</main>
</body>
</html>
