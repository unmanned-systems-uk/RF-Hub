<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Log Magnitude traces showing four antenna scenarios">
  <defs>
    <style>text { font-family: 'IBM Plex Mono', 'Courier New', monospace; }</style>
    <clipPath id="plot1-clip">
      <rect x="79" y="49" width="683" height="282"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="430" fill="#111827"/>

  <!-- Plot area -->
  <rect x="79" y="49" width="683" height="282" fill="#0a0e1a"/>

  <!-- Horizontal grid lines: 0, -5, -10, -15, -20, -25, -30 dB -->
  <!-- y(dB) = 49 + |dB| * 9.4   (scale: 282px / 30dB = 9.4 px/dB) -->
  <!-- 0dB=49, -5=96, -10=143, -15=190, -20=237, -25=284, -30=331 -->
  <line x1="79" y1="49"  x2="762" y2="49"  stroke="#1e293b" stroke-width="1"/>
  <line x1="79" y1="96"  x2="762" y2="96"  stroke="#1e293b" stroke-width="1"/>
  <line x1="79" y1="143" x2="762" y2="143" stroke="#1e293b" stroke-width="1"/>
  <line x1="79" y1="190" x2="762" y2="190" stroke="#1e293b" stroke-width="1"/>
  <line x1="79" y1="237" x2="762" y2="237" stroke="#1e293b" stroke-width="1"/>
  <line x1="79" y1="284" x2="762" y2="284" stroke="#1e293b" stroke-width="1"/>
  <line x1="79" y1="331" x2="762" y2="331" stroke="#1e293b" stroke-width="1"/>

  <!-- -10 dB threshold highlight -->
  <line x1="79" y1="143" x2="762" y2="143" stroke="#22c55e" stroke-width="1" stroke-dasharray="6,4" opacity="0.35" clip-path="url(#plot1-clip)"/>

  <!-- Axis border -->
  <rect x="79" y="49" width="683" height="282" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Y axis labels -->
  <text x="72" y="53"  text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="72" y="100" text-anchor="end" font-size="11" fill="#64748b">−5</text>
  <text x="72" y="147" text-anchor="end" font-size="11" fill="#64748b">−10</text>
  <text x="72" y="194" text-anchor="end" font-size="11" fill="#64748b">−15</text>
  <text x="72" y="241" text-anchor="end" font-size="11" fill="#64748b">−20</text>
  <text x="72" y="288" text-anchor="end" font-size="11" fill="#64748b">−25</text>
  <text x="72" y="335" text-anchor="end" font-size="11" fill="#64748b">−30</text>

  <!-- Y axis title -->
  <text transform="translate(18,190) rotate(-90)" text-anchor="middle" font-size="12" fill="#94a3b8">Return Loss (dB)</text>

  <!-- X axis label -->
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#94a3b8">Frequency →</text>

  <!-- −10 dB label on right -->
  <text x="765" y="147" font-size="10" fill="#22c55e" opacity="0.55">−10 dB</text>

  <!-- TRACE 1: Open circuit — flat near 0 dB (red) -->
  <path d="M 79,52 L 762,52"
        stroke="#ef4444" stroke-width="2.5" fill="none"
        clip-path="url(#plot1-clip)"/>

  <!-- TRACE 2: Poorly matched broadband — flat at ≈−6 dB (amber) -->
  <path d="M 79,105 L 762,105"
        stroke="#f59e0b" stroke-width="2.5" fill="none"
        clip-path="url(#plot1-clip)"/>

  <!-- TRACE 3: Well-matched wideband — broad dip to ≈−18 dB (green) -->
  <!-- Starts at ≈−5 dB (y=96), dips to −18 dB (y=218) around centre, returns -->
  <path d="M 79,96 C 200,96 230,218 420,218 C 610,218 640,96 762,96"
        stroke="#22c55e" stroke-width="2.5" fill="none"
        clip-path="url(#plot1-clip)"/>

  <!-- TRACE 4: Narrowband resonant — sharp dip to ≈−22 dB (cyan) -->
  <!-- Flat at −5 dB (y=96), sharp dip at centre to −22 dB (y=255), returns to flat -->
  <path d="M 79,96 L 365,96 C 390,96 400,255 420,255 C 440,255 450,96 475,96 L 762,96"
        stroke="#06b6d4" stroke-width="2.5" fill="none"
        clip-path="url(#plot1-clip)"/>

  <!-- Legend box -->
  <rect x="79" y="372" width="683" height="52" rx="6" fill="#0a0e1a" stroke="#1e293b" stroke-width="1"/>

  <!-- Legend row 1 -->
  <line x1="96" y1="389" x2="126" y2="389" stroke="#ef4444" stroke-width="2.5"/>
  <text x="134" y="393" font-size="11" fill="#e2e8f0">Open circuit (≈ 0 dB, all power reflected)</text>

  <line x1="96" y1="409" x2="126" y2="409" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="134" y="413" font-size="11" fill="#e2e8f0">Poorly matched broadband (flat, moderate loss)</text>

  <!-- Legend row 2 -->
  <line x1="420" y1="389" x2="450" y2="389" stroke="#22c55e" stroke-width="2.5"/>
  <text x="458" y="393" font-size="11" fill="#e2e8f0">Well-matched wideband (broad dip)</text>

  <line x1="420" y1="409" x2="450" y2="409" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="458" y="413" font-size="11" fill="#e2e8f0">Narrowband resonant (sharp deep dip)</text>
</svg>
