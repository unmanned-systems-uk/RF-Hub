<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">Which circuit is a common emitter amplifier?</text>

  <!-- ═══════════ PANEL A — Common Base (top-left) ═══════════ -->
  <rect x="10" y="25" width="280" height="110" rx="4" fill="#0d1321" stroke="#94a3b8" stroke-width="1"/>
  <text x="20" y="40" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">A</text>
  <!-- Transistor circle body -->
  <circle cx="170" cy="78" r="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base lead (left) -->
  <line x1="130" y1="78" x2="152" y2="78" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base vertical bar -->
  <line x1="152" y1="65" x2="152" y2="91" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector (up) -->
  <line x1="160" y1="62" x2="160" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter (down, arrow) -->
  <line x1="160" y1="94" x2="160" y2="114" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="160,114 155,104 165,104" fill="#94a3b8"/>
  <!-- Signal in at emitter (cap) -->
  <line x1="20" y1="114" x2="105" y2="114" stroke="#94a3b8" stroke-width="2"/>
  <line x1="105" y1="107" x2="105" y2="121" stroke="#94a3b8" stroke-width="2"/>
  <line x1="112" y1="107" x2="112" y2="121" stroke="#94a3b8" stroke-width="2"/>
  <line x1="112" y1="114" x2="160" y2="114" stroke="#94a3b8" stroke-width="2"/>
  <text x="55" y="112" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">IN</text>
  <!-- Collector output (cap) -->
  <line x1="160" y1="42" x2="200" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="35" x2="200" y2="49" stroke="#94a3b8" stroke-width="2"/>
  <line x1="207" y1="35" x2="207" y2="49" stroke="#94a3b8" stroke-width="2"/>
  <line x1="207" y1="42" x2="260" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="40" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">OUT</text>
  <!-- Base bypass cap to GND -->
  <line x1="130" y1="78" x2="90" y2="78" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="71" x2="90" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="83" y1="71" x2="83" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="83" y1="78" x2="50" y2="78" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="78" x2="50" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="42" y1="100" x2="58" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="45" y1="104" x2="55" y2="104" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="48" y1="108" x2="52" y2="108" stroke="#94a3b8" stroke-width="1"/>
  <!-- Vcc rail -->
  <line x1="160" y1="42" x2="160" y2="30" stroke="#94a3b8" stroke-width="2"/>
  <text x="164" y="30" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">V+</text>
  <!-- Label -->
  <text x="150" y="128" font-family="IBM Plex Mono" font-size="9" fill="#64748b">Common Base</text>

  <!-- ═══════════ PANEL B — Emitter Follower (top-right) ═══════════ -->
  <rect x="310" y="25" width="280" height="110" rx="4" fill="#0d1321" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="40" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">B</text>
  <!-- Transistor circle -->
  <circle cx="450" cy="78" r="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base lead -->
  <line x1="380" y1="78" x2="432" y2="78" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base bar -->
  <line x1="432" y1="65" x2="432" y2="91" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector straight to Vcc -->
  <line x1="440" y1="62" x2="440" y2="32" stroke="#94a3b8" stroke-width="2"/>
  <text x="444" y="32" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">V+</text>
  <!-- Emitter down (output) -->
  <line x1="440" y1="94" x2="440" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="440,120 435,110 445,110" fill="#94a3b8"/>
  <line x1="440" y1="120" x2="570" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <text x="548" y="118" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">OUT</text>
  <!-- Input cap at base -->
  <line x1="320" y1="78" x2="348" y2="78" stroke="#94a3b8" stroke-width="2"/>
  <line x1="348" y1="71" x2="348" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="355" y1="71" x2="355" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="355" y1="78" x2="432" y2="78" stroke="#94a3b8" stroke-width="2"/>
  <text x="316" y="76" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">IN</text>
  <!-- Label -->
  <text x="416" y="128" font-family="IBM Plex Mono" font-size="9" fill="#64748b">Emitter Follower</text>

  <!-- ═══════════ PANEL C — Common Emitter CORRECT (bottom-left) ═══════════ -->
  <rect x="10" y="145" width="280" height="110" rx="4" fill="#0d1321" stroke="#06b6d4" stroke-width="2"/>
  <text x="20" y="160" font-family="IBM Plex Mono" font-size="10" fill="#06b6d4">C ✓</text>
  <!-- Transistor circle -->
  <circle cx="170" cy="195" r="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base lead -->
  <line x1="100" y1="195" x2="152" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base bar -->
  <line x1="152" y1="182" x2="152" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector up to Vcc via output cap -->
  <line x1="160" y1="179" x2="160" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <text x="164" y="158" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">V+</text>
  <!-- Output cap on collector line -->
  <line x1="185" y1="179" x2="185" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="178" y1="165" x2="192" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="178" y1="158" x2="192" y2="158" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="158" x2="185" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="179" x2="185" y2="179" stroke="#94a3b8" stroke-width="2"/>
  <line x1="185" y1="150" x2="270" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="148" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">OUT</text>
  <!-- Emitter to GND via bypass cap -->
  <line x1="160" y1="211" x2="160" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="160,211 155,221 165,221" fill="#94a3b8"/>
  <line x1="160" y1="230" x2="160" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="152" y1="245" x2="168" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="155" y1="249" x2="165" y2="249" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="158" y1="253" x2="162" y2="253" stroke="#94a3b8" stroke-width="1"/>
  <!-- Emitter bypass cap -->
  <line x1="200" y1="220" x2="200" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="193" y1="228" x2="207" y2="228" stroke="#94a3b8" stroke-width="2"/>
  <line x1="193" y1="235" x2="207" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="220" x2="160" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Input cap at base -->
  <line x1="25" y1="195" x2="60" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60" y1="188" x2="60" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="67" y1="188" x2="67" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="67" y1="195" x2="100" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <text x="18" y="193" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">IN</text>
  <!-- Label -->
  <text x="130" y="248" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">Common Emitter ✓</text>

  <!-- ═══════════ PANEL D — Common Collector (bottom-right) ═══════════ -->
  <rect x="310" y="145" width="280" height="110" rx="4" fill="#0d1321" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="160" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">D</text>
  <!-- Transistor circle -->
  <circle cx="450" cy="195" r="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base lead with cap -->
  <line x1="330" y1="195" x2="360" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="188" x2="360" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="367" y1="188" x2="367" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="367" y1="195" x2="432" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base bar -->
  <line x1="432" y1="182" x2="432" y2="208" stroke="#94a3b8" stroke-width="2"/>
  <text x="322" y="193" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">IN</text>
  <!-- Collector to Vcc (bypassed via cap to GND) -->
  <line x1="440" y1="179" x2="440" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <text x="444" y="162" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">V+</text>
  <!-- Bypass cap from collector to GND -->
  <line x1="490" y1="155" x2="490" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="483" y1="175" x2="497" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="483" y1="182" x2="497" y2="182" stroke="#94a3b8" stroke-width="2"/>
  <line x1="490" y1="182" x2="490" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="483" y1="200" x2="497" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="486" y1="204" x2="494" y2="204" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="489" y1="208" x2="491" y2="208" stroke="#94a3b8" stroke-width="1"/>
  <line x1="440" y1="155" x2="490" y2="155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Emitter down (output) -->
  <line x1="440" y1="211" x2="440" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="440,211 435,221 445,221" fill="#94a3b8"/>
  <line x1="440" y1="245" x2="570" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <text x="548" y="243" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">OUT</text>
  <!-- Label -->
  <text x="405" y="260" font-family="IBM Plex Mono" font-size="9" fill="#64748b">Common Collector</text>

  <!-- Caption -->
  <text x="300" y="290" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Int 2I4 — Amplifier identification: which circuit is a common emitter configuration?</text>
</svg>
