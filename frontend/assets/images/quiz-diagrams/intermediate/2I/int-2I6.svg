<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Panel A: top-left — Fixed Resistor -->
  <rect x="10" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="30" y="32" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">A</text>
  <!-- IEC rectangle symbol: centred at 137,75 -->
  <!-- Lead in -->
  <line x1="60" y1="75" x2="107" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rectangle body 60×20 -->
  <rect x="107" y="65" width="60" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Lead out -->
  <line x1="167" y1="75" x2="215" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <text x="137" y="108" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Fixed Resistor</text>

  <!-- Panel B: top-right — Thermistor (CORRECT) -->
  <rect x="315" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="335" y="32" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">B</text>
  <!-- Lead in -->
  <line x1="365" y1="75" x2="412" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rectangle body -->
  <rect x="412" y="65" width="60" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Lead out -->
  <line x1="472" y1="75" x2="520" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- IEC thermistor: diagonal line through body bottom-left to top-right -->
  <line x1="415" y1="82" x2="469" y2="62" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Small +t° annotation above top-right of diagonal -->
  <text x="470" y="60" font-family="IBM Plex Mono,monospace" font-size="10" fill="#94a3b8">+t°</text>
  <text x="442" y="108" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Thermistor</text>
  <!-- Correct indicator -->
  <text x="560" y="32" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">✓</text>

  <!-- Panel C: bottom-left — Varistor -->
  <rect x="10" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="30" y="180" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">C</text>
  <!-- Lead in -->
  <line x1="60" y1="223" x2="107" y2="223" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rectangle body -->
  <rect x="107" y="213" width="60" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Lead out -->
  <line x1="167" y1="223" x2="215" y2="223" stroke="#94a3b8" stroke-width="2"/>
  <!-- V annotation for varistor -->
  <text x="128" y="210" font-family="IBM Plex Mono,monospace" font-size="11" fill="#94a3b8">V</text>
  <text x="137" y="256" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Varistor</text>

  <!-- Panel D: bottom-right — LDR -->
  <rect x="315" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="335" y="180" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">D</text>
  <!-- Lead in -->
  <line x1="365" y1="223" x2="412" y2="223" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rectangle body -->
  <rect x="412" y="213" width="60" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Lead out -->
  <line x1="472" y1="223" x2="520" y2="223" stroke="#94a3b8" stroke-width="2"/>
  <!-- Two inward arrows representing light (from top-right pointing toward component) -->
  <line x1="478" y1="200" x2="462" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="200" x2="474" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto">
      <polygon points="0,0 5,2.5 0,5" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="442" y="256" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">LDR</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Int 2I6 — Component identification: which symbol represents the described component?</text>
</svg>
