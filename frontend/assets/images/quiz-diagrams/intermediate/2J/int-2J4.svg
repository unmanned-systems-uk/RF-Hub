<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">Power supply circuit — what does this supply provide?</text>

  <!-- ═══ TRANSFORMER ═══ -->
  <!-- Primary coil -->
  <text x="28" y="105" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">AC</text>
  <text x="22" y="115" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">MAINS</text>
  <line x1="50" y1="100" x2="60" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="130" x2="60" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Transformer box -->
  <rect x="60" y="88" width="50" height="54" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="109" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">T1</text>
  <text x="85" y="121" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8" text-anchor="middle">XFMR</text>
  <!-- Secondary leads -->
  <line x1="110" y1="100" x2="130" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="130" x2="130" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- ═══ BRIDGE RECTIFIER (diamond) ═══ -->
  <!-- Top rail -->
  <line x1="130" y1="100" x2="155" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom rail -->
  <line x1="130" y1="130" x2="155" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bridge diamond: centre point (175,115) -->
  <!-- Top diode (left-top to top) -->
  <polygon points="155,100 165,107 155,115" fill="#94a3b8"/>
  <line x1="155" y1="100" x2="155" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="155" y1="115" x2="175" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <!-- Top-right diode -->
  <polygon points="175,108 185,115 175,115" fill="#94a3b8"/>
  <line x1="175" y1="108" x2="175" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="108" x2="195" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <line x1="195" y1="100" x2="195" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom-left diode -->
  <line x1="155" y1="115" x2="155" y2="122" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="155,130 165,122 155,122" fill="#94a3b8"/>
  <line x1="155" y1="130" x2="175" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom-right diode -->
  <line x1="175" y1="122" x2="195" y2="122" stroke="#94a3b8" stroke-width="2"/>
  <line x1="195" y1="122" x2="195" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="175,130 185,122 175,122" fill="#94a3b8"/>
  <!-- Bridge output rails -->
  <line x1="195" y1="100" x2="215" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="195" y1="130" x2="215" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Label -->
  <text x="165" y="150" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Bridge</text>
  <text x="165" y="159" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Rectifier</text>

  <!-- ═══ SMOOTHING CAPACITOR ═══ -->
  <line x1="215" y1="100" x2="240" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="215" y1="130" x2="240" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Cap symbol vertical between rails -->
  <line x1="230" y1="100" x2="230" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="222" y1="111" x2="238" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="222" y1="117" x2="238" y2="117" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="117" x2="230" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="242" y="118" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">C1</text>
  <line x1="240" y1="100" x2="265" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="130" x2="265" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="226" y="150" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Smooth</text>

  <!-- ═══ REGULATOR IC (78xx) ═══ -->
  <line x1="265" y1="100" x2="310" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="265" y1="130" x2="310" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <rect x="310" y="88" width="70" height="44" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="345" y="109" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">78xx</text>
  <text x="345" y="123" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8" text-anchor="middle">REGULATOR</text>
  <line x1="380" y1="100" x2="420" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="130" x2="420" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="345" y="150" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Regulator</text>

  <!-- Output cap -->
  <line x1="420" y1="100" x2="420" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="412" y1="111" x2="428" y2="111" stroke="#94a3b8" stroke-width="2"/>
  <line x1="412" y1="117" x2="428" y2="117" stroke="#94a3b8" stroke-width="2"/>
  <line x1="420" y1="117" x2="420" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="432" y="118" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">C2</text>
  <line x1="428" y1="100" x2="475" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="428" y1="130" x2="475" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- Output terminals -->
  <line x1="475" y1="100" x2="510" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="475" y1="130" x2="510" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="510" cy="100" r="4" fill="#94a3b8"/>
  <circle cx="510" cy="130" r="4" fill="#94a3b8"/>
  <text x="518" y="104" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">+Vout</text>
  <text x="518" y="134" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">GND</text>
  <text x="455" y="150" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Output</text>

  <!-- ═══ ANSWER OPTIONS ═══ -->
  <rect x="10" y="170" width="580" height="70" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <text x="300" y="185" font-family="IBM Plex Mono" font-size="9" fill="#64748b" text-anchor="middle">Answer Options</text>

  <rect x="20" y="190" width="125" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="83" y="205" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">A: Unregulated DC</text>

  <rect x="155" y="190" width="125" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="218" y="205" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">B: Half-wave rectifier</text>

  <rect x="290" y="190" width="125" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="353" y="205" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">C: AC output</text>

  <!-- D correct — highlighted -->
  <rect x="425" y="190" width="155" height="22" rx="3" fill="#0a0e1a" stroke="#06b6d4" stroke-width="2"/>
  <text x="503" y="205" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4" text-anchor="middle">D: Regulated DC ✓</text>

  <text x="300" y="230" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Correct answer: D</text>

  <!-- Caption -->
  <text x="300" y="290" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Int 2J4 — Power supply circuit: what does this supply provide?</text>
</svg>
