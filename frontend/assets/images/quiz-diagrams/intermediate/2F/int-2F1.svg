<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- LEFT PANEL: High sampling rate -->
  <g id="left-panel">
    <!-- Panel background -->
    <rect x="20" y="30" width="255" height="185" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <!-- Label -->
    <text x="147" y="22" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0">Left wave</text>
    <!-- X axis -->
    <line x1="35" y1="152" x2="265" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Y axis -->
    <line x1="35" y1="45" x2="35" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Axis arrows -->
    <polyline points="263,148 265,152 263,156" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <polyline points="31,47 35,45 39,47" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Axis labels -->
    <text x="270" y="156" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">t</text>
    <text x="28" y="43" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">V</text>

    <!-- Sine wave: 2 full cycles across ~220px. Amplitude 55px. cx_start=45, period=110 -->
    <!-- Points every 5px for smooth curve -->
    <polyline fill="none" stroke="#06b6d4" stroke-width="2"
      points="
        45,152
        50,121 55,94 60,77 65,74 70,83 75,102 80,126 85,152
        90,178 95,202 100,219 105,222 110,213 115,194 120,170 125,152
        130,134 135,107 140,81 145,64 150,61 155,70 160,89 165,113 170,139 175,152
        180,166 185,190 190,213 195,227 200,230 205,221 210,202 215,178 220,155 225,152
        230,149 235,134 240,115 245,99 250,89 255,83 260,85
      "/>

    <!-- Vertical dashed sample lines at ~20px intervals (high rate ~12 per cycle) -->
    <!-- cycle 1: x=45 to 155 (period=110), samples every ~9px → use ~20px for visual clarity ~6/cycle -->
    <!-- Actually use ~18px spacing across 220px range: x = 45,63,81,99,117,135,153,171,189,207,225,243,261 -->
    <line x1="45" y1="50" x2="45" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="63" y1="50" x2="63" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="81" y1="50" x2="81" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="99" y1="50" x2="99" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="117" y1="50" x2="117" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="135" y1="50" x2="135" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="153" y1="50" x2="153" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="171" y1="50" x2="171" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="189" y1="50" x2="189" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="207" y1="50" x2="207" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="225" y1="50" x2="225" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="243" y1="50" x2="243" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="261" y1="50" x2="261" y2="200" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>

    <!-- Sample dots -->
    <circle cx="45" cy="152" r="2.5" fill="#06b6d4"/>
    <circle cx="63" cy="106" r="2.5" fill="#06b6d4"/>
    <circle cx="81" cy="74" r="2.5" fill="#06b6d4"/>
    <circle cx="99" cy="126" r="2.5" fill="#06b6d4"/>
    <circle cx="117" cy="178" r="2.5" fill="#06b6d4"/>
    <circle cx="135" cy="216" r="2.5" fill="#06b6d4"/>
    <circle cx="153" cy="202" r="2.5" fill="#06b6d4"/>
    <circle cx="171" cy="152" r="2.5" fill="#06b6d4"/>
    <circle cx="189" cy="102" r="2.5" fill="#06b6d4"/>
    <circle cx="207" cy="70" r="2.5" fill="#06b6d4"/>
    <circle cx="225" cy="113" r="2.5" fill="#06b6d4"/>
    <circle cx="243" cy="170" r="2.5" fill="#06b6d4"/>
    <circle cx="261" cy="210" r="2.5" fill="#06b6d4"/>

    <!-- High sample rate label -->
    <text x="147" y="215" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">high sample rate</text>
  </g>

  <!-- RIGHT PANEL: Low sampling rate -->
  <g id="right-panel">
    <!-- Panel background -->
    <rect x="325" y="30" width="255" height="185" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <!-- Label -->
    <text x="452" y="22" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0">Right wave</text>
    <!-- X axis -->
    <line x1="340" y1="152" x2="570" y2="152" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Y axis -->
    <line x1="340" y1="45" x2="340" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Axis arrows -->
    <polyline points="568,148 570,152 568,156" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <polyline points="336,47 340,45 344,47" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Axis labels -->
    <text x="575" y="156" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">t</text>
    <text x="333" y="43" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">V</text>

    <!-- Same sine wave in amber -->
    <polyline fill="none" stroke="#f59e0b" stroke-width="2"
      points="
        350,152
        355,121 360,94 365,77 370,74 375,83 380,102 385,126 390,152
        395,178 400,202 405,219 410,222 415,213 420,194 425,170 430,152
        435,134 440,107 445,81 450,64 455,61 460,70 465,89 470,113 475,139 480,152
        485,166 490,190 495,213 500,227 505,230 510,221 515,202 520,178 525,155 530,152
        535,149 540,134 545,115 550,99 555,89 560,83 565,85
      "/>

    <!-- Only ~4 sample lines per cycle → spacing ~27px across 220px = ~8 total -->
    <!-- x = 350, 377, 404, 431, 458, 485, 512, 539, 566 -->
    <line x1="350" y1="50" x2="350" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="377" y1="50" x2="377" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="404" y1="50" x2="404" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="431" y1="50" x2="431" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="458" y1="50" x2="458" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="485" y1="50" x2="485" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="512" y1="50" x2="512" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <line x1="539" y1="50" x2="539" y2="200" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>

    <!-- Sample dots (fewer) -->
    <circle cx="350" cy="152" r="3" fill="#f59e0b"/>
    <circle cx="377" cy="88" r="3" fill="#f59e0b"/>
    <circle cx="404" cy="219" r="3" fill="#f59e0b"/>
    <circle cx="431" cy="152" r="3" fill="#f59e0b"/>
    <circle cx="458" cy="64" r="3" fill="#f59e0b"/>
    <circle cx="485" cy="193" r="3" fill="#f59e0b"/>
    <circle cx="512" cy="212" r="3" fill="#f59e0b"/>
    <circle cx="539" cy="107" r="3" fill="#f59e0b"/>

    <!-- Low sample rate label -->
    <text x="452" y="215" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#f59e0b">low sample rate</text>
  </g>

  <!-- Answer options row -->
  <rect x="20" y="228" width="560" height="28" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="246" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#06b6d4" font-weight="bold">A</text>
  <text x="62" y="246" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">lower sampling rate</text>
  <text x="195" y="246" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" font-weight="bold">B</text>
  <text x="207" y="246" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8">higher frequency</text>
  <text x="330" y="246" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" font-weight="bold">C</text>
  <text x="342" y="246" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8">lower amplitude</text>
  <text x="470" y="246" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" font-weight="bold">D</text>
  <text x="482" y="246" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8">different phase</text>

  <!-- Caption -->
  <text x="300" y="285" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="#64748b">Int 2F1 — Digitised sine waves: identify the characteristic of the right waveform</text>
</svg>
