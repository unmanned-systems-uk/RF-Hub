<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      text { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .caption { font-family: 'IBM Plex Sans', 'Arial', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- ===== CIRCUIT ===== -->
  <!-- Layout: vertical series loop, left side of diagram -->
  <!-- Top rail: y=40, Bottom rail: y=260, Left wire x=120, Right wire x=240 -->

  <!-- Battery V_s: top-left, drawn as long-short lines (horizontal pair, vertical in the loop) -->
  <!-- Battery at top of left branch: centre x=120, between y=40 and y=90 -->
  <!-- Long line (positive) at y=55 -->
  <line x1="108" y1="55" x2="132" y2="55" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Short line (negative) at y=68 -->
  <line x1="113" y1="68" x2="127" y2="68" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Wire above battery to top rail -->
  <line x1="120" y1="40" x2="120" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <!-- Wire below battery down to R1 -->
  <line x1="120" y1="68" x2="120" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- Battery label -->
  <text x="90" y="63" fill="#e2e8f0" font-size="11" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">s</tspan></text>
  <!-- + / - indicators -->
  <text x="136" y="58" fill="#e2e8f0" font-size="10">+</text>
  <text x="136" y="73" fill="#e2e8f0" font-size="10">−</text>

  <!-- Top wire connecting battery top to right rail top -->
  <line x1="120" y1="40" x2="240" y2="40" stroke="#94a3b8" stroke-width="2"/>

  <!-- R1: IEC rectangle 60×20, centred at x=120, y=120 -->
  <rect x="90" y="110" width="60" height="20" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="123" fill="#e2e8f0" font-size="10" text-anchor="middle">R1</text>
  <!-- Wire from R1 bottom to R2 top -->
  <line x1="120" y1="130" x2="120" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <!-- R1 label outside -->
  <text x="65" y="123" fill="#94a3b8" font-size="11" text-anchor="middle">200Ω</text>

  <!-- R2: IEC rectangle 60×20, centred at x=120, y=180 -->
  <rect x="90" y="170" width="60" height="20" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="183" fill="#e2e8f0" font-size="10" text-anchor="middle">R2</text>
  <!-- R2 label outside -->
  <text x="65" y="183" fill="#94a3b8" font-size="11" text-anchor="middle">600Ω</text>

  <!-- Wire from R2 bottom to bottom rail -->
  <line x1="120" y1="190" x2="120" y2="260" stroke="#94a3b8" stroke-width="2"/>

  <!-- Bottom wire GND -->
  <line x1="120" y1="260" x2="240" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol at x=120, y=260 -->
  <line x1="110" y1="262" x2="130" y2="262" stroke="#94a3b8" stroke-width="2"/>
  <line x1="113" y1="266" x2="127" y2="266" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="116" y1="270" x2="124" y2="270" stroke="#94a3b8" stroke-width="1"/>

  <!-- Right rail: wire from top-right (240,40) to bottom-right (240,260) -->
  <line x1="240" y1="40" x2="240" y2="260" stroke="#94a3b8" stroke-width="2"/>

  <!-- Voltmeter across R1: from (240,110) to (240,130) with circle V symbol -->
  <!-- Tap wire left from right rail at y=110 to voltmeter -->
  <line x1="175" y1="115" x2="210" y2="115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Tap wire left from right rail at y=130 to voltmeter -->
  <line x1="175" y1="135" x2="210" y2="135" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Connect taps from R1 top/bottom node on left rail -->
  <line x1="120" y1="110" x2="175" y2="115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="120" y1="130" x2="175" y2="135" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Voltmeter circle -->
  <circle cx="228" cy="125" r="16" fill="#0d1321" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="228" y="129" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="bold">V</text>
  <!-- Reading label -->
  <text x="252" y="122" fill="#38bdf8" font-size="10">= 4V</text>

  <!-- ===== QUESTION TEXT ===== -->
  <text x="310" y="30" fill="#e2e8f0" font-size="11" text-anchor="start">R1 = 200Ω, R2 = 600Ω</text>
  <text x="310" y="48" fill="#e2e8f0" font-size="11" text-anchor="start">V across R1 = 4V</text>
  <text x="310" y="66" fill="#94a3b8" font-size="10" text-anchor="start">What is the voltage across R2?</text>

  <!-- ===== ANSWER OPTIONS PANEL ===== -->
  <rect x="295" y="85" width="280" height="150" rx="6" fill="#0d1321" stroke="#1e293b" stroke-width="1.5"/>
  <text x="435" y="105" fill="#64748b" font-size="10" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif">SELECT ANSWER</text>

  <!-- A -->
  <rect x="310" y="113" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="322" y="134" fill="#94a3b8" font-size="13" font-weight="bold">A</text>
  <text x="340" y="134" fill="#e2e8f0" font-size="13">1.3 V</text>

  <!-- B -->
  <rect x="450" y="113" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="462" y="134" fill="#94a3b8" font-size="13" font-weight="bold">B</text>
  <text x="480" y="134" fill="#e2e8f0" font-size="13">4 V</text>

  <!-- C -->
  <rect x="310" y="158" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="322" y="179" fill="#94a3b8" font-size="13" font-weight="bold">C</text>
  <text x="340" y="179" fill="#e2e8f0" font-size="13">8 V</text>

  <!-- D -->
  <rect x="450" y="158" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="462" y="179" fill="#94a3b8" font-size="13" font-weight="bold">D</text>
  <text x="480" y="179" fill="#e2e8f0" font-size="13">12 V</text>

  <!-- ===== CAPTION ===== -->
  <text x="300" y="282" fill="#64748b" font-size="10" text-anchor="middle" class="caption" font-family="'IBM Plex Sans', Arial, sans-serif">Int 2C1 — Series resistor circuit: find V<tspan baseline-shift="sub" font-size="70%">R2</tspan> given V<tspan baseline-shift="sub" font-size="70%">R1</tspan></text>
</svg>
