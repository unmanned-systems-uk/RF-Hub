<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      text { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .caption { font-family: 'IBM Plex Sans', 'Arial', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- ===== CIRCUIT: 3 equal resistors in series, vertical, top=+Vin, bottom=GND ===== -->
  <!-- Left wire x=130. Top y=30, Bottom y=270 -->
  <!-- +Vin label at top -->
  <text x="130" y="24" fill="#e2e8f0" font-size="11" text-anchor="middle">+V_in</text>
  <!-- Wire from +Vin to R1 top -->
  <line x1="130" y1="28" x2="130" y2="50" stroke="#94a3b8" stroke-width="2"/>

  <!-- R1: IEC rect, centred x=130, y=60 (spans 50–70) -->
  <rect x="100" y="50" width="60" height="20" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="63" fill="#e2e8f0" font-size="10" text-anchor="middle">R</text>
  <text x="75" y="63" fill="#94a3b8" font-size="10" text-anchor="end">R1</text>

  <!-- Wire R1 bottom to TAP P node at y=100 -->
  <line x1="130" y1="70" x2="130" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- TAP P node dot -->
  <circle cx="130" cy="100" r="4" fill="#38bdf8"/>
  <!-- P label and arrow -->
  <text x="145" y="104" fill="#38bdf8" font-size="12" font-weight="bold">P</text>
  <!-- Arrow pointing right from node -->
  <line x1="150" y1="100" x2="185" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Wire P node down to R2 top -->
  <line x1="130" y1="104" x2="130" y2="120" stroke="#94a3b8" stroke-width="2"/>

  <!-- R2: IEC rect, centred x=130, y=130 (spans 120–140) -->
  <rect x="100" y="120" width="60" height="20" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="133" fill="#e2e8f0" font-size="10" text-anchor="middle">R</text>
  <text x="75" y="133" fill="#94a3b8" font-size="10" text-anchor="end">R2</text>

  <!-- Wire R2 bottom to R3 top -->
  <line x1="130" y1="140" x2="130" y2="165" stroke="#94a3b8" stroke-width="2"/>

  <!-- R3: IEC rect, centred x=130, y=175 (spans 165–185) -->
  <rect x="100" y="165" width="60" height="20" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="178" fill="#e2e8f0" font-size="10" text-anchor="middle">R</text>
  <text x="75" y="178" fill="#94a3b8" font-size="10" text-anchor="end">R3</text>

  <!-- Wire R3 bottom to GND -->
  <line x1="130" y1="185" x2="130" y2="240" stroke="#94a3b8" stroke-width="2"/>

  <!-- GND symbol -->
  <line x1="118" y1="242" x2="142" y2="242" stroke="#94a3b8" stroke-width="2"/>
  <line x1="121" y1="247" x2="139" y2="247" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="124" y1="252" x2="136" y2="252" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="265" fill="#94a3b8" font-size="10" text-anchor="middle">GND</text>

  <!-- Note: each R is equal value -->
  <text x="45" y="105" fill="#64748b" font-size="9" text-anchor="middle">R1=R2=R3</text>
  <text x="45" y="117" fill="#64748b" font-size="9" text-anchor="middle">(equal)</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- ===== QUESTION TEXT ===== -->
  <text x="310" y="30" fill="#e2e8f0" font-size="11" text-anchor="start">3 equal resistors in series</text>
  <text x="310" y="48" fill="#e2e8f0" font-size="11" text-anchor="start">No current drawn from P</text>
  <text x="310" y="66" fill="#e2e8f0" font-size="11" text-anchor="start">P is after 1st resistor from top</text>
  <text x="310" y="84" fill="#94a3b8" font-size="10" text-anchor="start">What is the potential at P?</text>

  <!-- ===== ANSWER OPTIONS PANEL ===== -->
  <rect x="295" y="100" width="280" height="160" rx="6" fill="#0d1321" stroke="#1e293b" stroke-width="1.5"/>
  <text x="435" y="120" fill="#64748b" font-size="10" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif">SELECT ANSWER</text>

  <!-- A -->
  <rect x="310" y="128" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="322" y="149" fill="#94a3b8" font-size="13" font-weight="bold">A</text>
  <text x="340" y="149" fill="#e2e8f0" font-size="12">V_in</text>

  <!-- B -->
  <rect x="450" y="128" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="462" y="149" fill="#94a3b8" font-size="13" font-weight="bold">B</text>
  <text x="480" y="149" fill="#e2e8f0" font-size="12">V_in / 3</text>

  <!-- C -->
  <rect x="310" y="173" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="322" y="194" fill="#94a3b8" font-size="13" font-weight="bold">C</text>
  <text x="340" y="194" fill="#e2e8f0" font-size="12">V_in / 2</text>

  <!-- D -->
  <rect x="450" y="173" width="115" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="462" y="194" fill="#94a3b8" font-size="13" font-weight="bold">D</text>
  <text x="480" y="194" fill="#e2e8f0" font-size="12">2/3 V_in</text>

  <!-- ===== CAPTION ===== -->
  <text x="300" y="282" fill="#64748b" font-size="10" text-anchor="middle" class="caption" font-family="'IBM Plex Sans', Arial, sans-serif">Int 2C2 — 3-resistor potential divider: find V at tap P</text>
</svg>
