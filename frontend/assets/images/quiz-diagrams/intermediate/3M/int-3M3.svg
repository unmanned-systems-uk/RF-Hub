<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="middle">SDR receiver block diagram — what function is in the blank box?</text>

  <!-- ═══ SDR BLOCK CHAIN ═══ -->

  <!-- Antenna -->
  <line x1="24" y1="110" x2="24" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <line x1="24" y1="90" x2="13" y2="77" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="90" x2="35" y2="77" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="90" x2="24" y2="73" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="110" x2="40" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="40,106 40,114 48,110" fill="#94a3b8"/>

  <!-- RF Amp -->
  <rect x="48" y="95" width="60" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="78" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">RF Amp</text>

  <!-- Arrow RF Amp → Mixer -->
  <line x1="108" y1="110" x2="128" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="128,106 128,114 136,110" fill="#94a3b8"/>

  <!-- Mixer -->
  <rect x="136" y="95" width="54" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="163" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">Mixer</text>

  <!-- LO → Mixer -->
  <rect x="136" y="162" width="54" height="28" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="163" y="174" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Local</text>
  <text x="163" y="185" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Oscillator</text>
  <line x1="163" y1="162" x2="163" y2="129" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="159,129 167,129 163,125" fill="#94a3b8"/>

  <!-- Arrow Mixer → LPF -->
  <line x1="190" y1="110" x2="210" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="210,106 210,114 218,110" fill="#94a3b8"/>

  <!-- LPF -->
  <rect x="218" y="95" width="64" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="108" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Low Pass</text>
  <text x="250" y="120" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Filter</text>

  <!-- Analogue label -->
  <text x="250" y="142" font-family="IBM Plex Mono" font-size="7" fill="#64748b" text-anchor="middle">(analogue)</text>

  <!-- Arrow LPF → Blank box -->
  <line x1="282" y1="110" x2="308" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="308,106 308,114 316,110" fill="#94a3b8"/>

  <!-- Analogue→Digital boundary marker -->
  <line x1="308" y1="82" x2="388" y2="82" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="348" y="78" font-family="IBM Plex Mono" font-size="7" fill="#64748b" text-anchor="middle">analogue → digital</text>

  <!-- BLANK BOX (dashed cyan — the unknown ADC) -->
  <rect x="316" y="88" width="72" height="44" rx="3" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="352" y="108" font-family="IBM Plex Mono" font-size="22" fill="#06b6d4" text-anchor="middle" font-weight="bold">?</text>
  <text x="352" y="126" font-family="IBM Plex Mono" font-size="7" fill="#06b6d4" text-anchor="middle">[blank box]</text>

  <!-- Arrow Blank → DSP -->
  <line x1="388" y1="110" x2="412" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="412,106 412,114 420,110" fill="#94a3b8"/>

  <!-- DSP / Computer -->
  <rect x="420" y="90" width="88" height="40" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="464" y="108" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">DSP /</text>
  <text x="464" y="122" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">Computer</text>
  <text x="464" y="145" font-family="IBM Plex Mono" font-size="7" fill="#64748b" text-anchor="middle">(digital)</text>

  <!-- Arrow DSP → Output -->
  <line x1="508" y1="110" x2="535" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="535,106 535,114 543,110" fill="#94a3b8"/>
  <text x="558" y="114" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">Audio</text>
  <text x="558" y="126" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">Out</text>

  <!-- ═══ ANSWER OPTIONS ═══ -->
  <rect x="10" y="198" width="580" height="72" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>

  <text x="22" y="215" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" font-weight="bold">A</text>
  <text x="34" y="215" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">IF Amplifier</text>

  <text x="22" y="233" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" font-weight="bold">B</text>
  <text x="34" y="233" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">Demodulator</text>

  <!-- C correct -->
  <text x="22" y="251" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4" font-weight="bold">C</text>
  <text x="34" y="251" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">ADC (Analogue to Digital Converter)  ← correct</text>

  <text x="22" y="263" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" font-weight="bold">D</text>
  <text x="34" y="263" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">Mixer</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Int 3M3 — SDR receiver: identify the function of the blank block</text>
</svg>
