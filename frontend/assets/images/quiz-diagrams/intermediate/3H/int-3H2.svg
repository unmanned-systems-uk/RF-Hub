<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="middle">Insertion point for detector block: A B C or D?</text>

  <!-- ═══ SUPERHET CHAIN ═══ -->

  <!-- Antenna -->
  <line x1="22" y1="112" x2="22" y2="92" stroke="#94a3b8" stroke-width="2"/>
  <line x1="22" y1="92" x2="12" y2="79" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="22" y1="92" x2="32" y2="79" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="22" y1="92" x2="22" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="22" y1="112" x2="38" y2="112" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="38,108 38,116 46,112" fill="#94a3b8"/>

  <!-- RF Amp -->
  <rect x="46" y="97" width="64" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="78" y="116" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">RF Amp</text>

  <!-- Arrow RF Amp → A marker -->
  <line x1="110" y1="112" x2="128" y2="112" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="128,108 128,116 136,112" fill="#94a3b8"/>
  <!-- A label -->
  <text x="136" y="106" font-family="IBM Plex Mono" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">A</text>

  <!-- Arrow A → Mixer -->
  <line x1="136" y1="112" x2="150" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="150,108 150,116 158,112" fill="#94a3b8"/>

  <!-- Mixer -->
  <rect x="158" y="97" width="56" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="186" y="116" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">Mixer</text>

  <!-- LO → Mixer -->
  <rect x="158" y="162" width="56" height="28" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="186" y="174" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Local</text>
  <text x="186" y="185" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Oscillator</text>
  <line x1="186" y1="162" x2="186" y2="131" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="182,131 190,131 186,127" fill="#94a3b8"/>

  <!-- Arrow Mixer → B marker -->
  <line x1="214" y1="112" x2="232" y2="112" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="232,108 232,116 240,112" fill="#94a3b8"/>
  <!-- B label -->
  <text x="240" y="106" font-family="IBM Plex Mono" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">B</text>

  <!-- Arrow B → IF Amp -->
  <line x1="240" y1="112" x2="254" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="254,108 254,116 262,112" fill="#94a3b8"/>

  <!-- IF Amp -->
  <rect x="262" y="97" width="64" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="294" y="116" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">IF Amp</text>

  <!-- Arrow IF Amp → C marker (CORRECT gap) -->
  <line x1="326" y1="112" x2="344" y2="112" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="344,108 344,116 352,112" fill="#94a3b8"/>
  <!-- C label (correct — cyan) -->
  <text x="352" y="106" font-family="IBM Plex Mono" font-size="11" fill="#06b6d4" text-anchor="middle" font-weight="bold">C</text>
  <!-- Dashed detector box at C -->
  <rect x="350" y="97" width="62" height="30" rx="3" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="381" y="110" font-family="IBM Plex Mono" font-size="7" fill="#06b6d4" text-anchor="middle">Detector</text>
  <text x="381" y="121" font-family="IBM Plex Mono" font-size="6" fill="#06b6d4" text-anchor="middle">[insert here]</text>

  <!-- Arrow C → AF Amp -->
  <line x1="412" y1="112" x2="428" y2="112" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="428,108 428,116 436,112" fill="#94a3b8"/>

  <!-- AF Amp -->
  <rect x="436" y="97" width="58" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="465" y="116" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">AF Amp</text>

  <!-- Arrow AF Amp → D marker -->
  <line x1="494" y1="112" x2="510" y2="112" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="510,108 510,116 518,112" fill="#94a3b8"/>
  <!-- D label -->
  <text x="518" y="106" font-family="IBM Plex Mono" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">D</text>

  <!-- Arrow D → Speaker -->
  <line x1="518" y1="112" x2="530" y2="112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
  <!-- Speaker symbol (compact) -->
  <rect x="532" y="103" width="10" height="18" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="542,107 552,100 552,124 542,117" fill="#94a3b8"/>
  <path d="M 554,104 Q 560,112 554,120" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- ═══ LEGEND ═══ -->
  <rect x="10" y="210" width="580" height="60" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <text x="22" y="226" font-family="IBM Plex Mono" font-size="8" fill="#64748b">Insertion points:</text>
  <text x="115" y="226" font-family="IBM Plex Mono" font-size="9" fill="#f59e0b" font-weight="bold">A</text>
  <text x="125" y="226" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">between RF Amp and Mixer</text>
  <text x="340" y="226" font-family="IBM Plex Mono" font-size="9" fill="#f59e0b" font-weight="bold">B</text>
  <text x="350" y="226" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">between Mixer and IF Amp</text>

  <text x="22" y="244" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4" font-weight="bold">C</text>
  <text x="32" y="244" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4">between IF Amp and AF Amp  ← correct</text>
  <text x="340" y="244" font-family="IBM Plex Mono" font-size="9" fill="#f59e0b" font-weight="bold">D</text>
  <text x="350" y="244" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">between AF Amp and Speaker</text>

  <text x="22" y="262" font-family="IBM Plex Mono" font-size="7" fill="#64748b">The detector demodulates IF → audio; it must follow the IF amp and precede the AF amp.</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Int 3H2 — Superhet receiver: at which position A–D should the detector be inserted?</text>
</svg>
