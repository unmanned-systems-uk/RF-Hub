<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Panel A: top-left — High-pass filter -->
  <rect x="10" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="22" y="29" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">A</text>
  <!-- Axes -->
  <line x1="45" y1="110" x2="255" y2="110" stroke="#64748b" stroke-width="1"/>
  <line x1="45" y1="30"  x2="45"  y2="110" stroke="#64748b" stroke-width="1"/>
  <!-- High-pass: drops at low freq, flat at high — rises from lower-left to flat right -->
  <polyline points="50,108 80,106 110,100 140,80 170,45 200,38 230,36 255,35"
            fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Axis labels -->
  <text x="150" y="123" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle">Frequency →</text>
  <text x="38" y="72" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,38,72)">Amplitude</text>
  <text x="150" y="100" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">High-Pass</text>

  <!-- Panel B: top-right — Low-pass filter -->
  <rect x="315" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="327" y="29" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">B</text>
  <!-- Axes -->
  <line x1="350" y1="110" x2="560" y2="110" stroke="#64748b" stroke-width="1"/>
  <line x1="350" y1="30"  x2="350" y2="110" stroke="#64748b" stroke-width="1"/>
  <!-- Low-pass: flat at low freq, drops to right -->
  <polyline points="355,35 380,36 410,38 440,45 470,70 495,95 520,107 555,109"
            fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <text x="455" y="123" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle">Frequency →</text>
  <text x="343" y="72" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,343,72)">Amplitude</text>
  <text x="455" y="56" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Low-Pass</text>

  <!-- Panel C: bottom-left — Band-pass (CORRECT) -->
  <rect x="10" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="22" y="177" font-family="IBM Plex Mono,monospace" font-size="13" fill="#06b6d4">C</text>
  <!-- Axes -->
  <line x1="45" y1="258" x2="255" y2="258" stroke="#64748b" stroke-width="1"/>
  <line x1="45" y1="178" x2="45"  y2="258" stroke="#64748b" stroke-width="1"/>
  <!-- Band-pass: rises to peak in middle, falls at edges -->
  <polyline points="50,256 70,254 90,242 115,210 140,185 165,183 190,210 215,242 235,254 255,256"
            fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="150" y="271" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle">Frequency →</text>
  <text x="38" y="220" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,38,220)">Amplitude</text>
  <text x="150" y="248" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Band-Pass</text>
  <text x="265" y="177" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#06b6d4" text-anchor="end">✓</text>

  <!-- Panel D: bottom-right — Band-stop (notch) -->
  <rect x="315" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="327" y="177" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">D</text>
  <!-- Axes -->
  <line x1="350" y1="258" x2="560" y2="258" stroke="#64748b" stroke-width="1"/>
  <line x1="350" y1="178" x2="350" y2="258" stroke="#64748b" stroke-width="1"/>
  <!-- Band-stop: flat with dip in middle -->
  <polyline points="355,190 375,190 400,192 420,205 440,250 460,250 480,205 500,192 525,190 555,190"
            fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <text x="455" y="271" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle">Frequency →</text>
  <text x="343" y="220" font-family="IBM Plex Mono,monospace" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,343,220)">Amplitude</text>
  <text x="455" y="202" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Band-Stop</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Int 3G3 — Filter response: which diagram shows a band-pass filter characteristic?</text>
</svg>
