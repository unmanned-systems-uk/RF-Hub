<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Oscilloscope screen background -->
  <rect x="15" y="10" width="380" height="220" rx="6" fill="#071020" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Graticule: 8 columns × 6 rows, each division = 40px wide × 33px tall -->
  <!-- Grid starts at x=35, y=18 (inner area), total 320px wide × 198px tall -->
  <!-- 8 cols: x=35,75,115,155,195,235,275,315,355 -->
  <!-- 6 rows: y=18,51,84,117,150,183,216 -->

  <!-- Major grid lines (darker) -->
  <!-- Vertical major lines -->
  <line x1="35" y1="18" x2="35" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="75" y1="18" x2="75" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="115" y1="18" x2="115" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="155" y1="18" x2="155" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="195" y1="18" x2="195" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="235" y1="18" x2="235" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="275" y1="18" x2="275" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="315" y1="18" x2="315" y2="216" stroke="#1e293b" stroke-width="1"/>
  <line x1="355" y1="18" x2="355" y2="216" stroke="#1e293b" stroke-width="1"/>

  <!-- Horizontal major lines -->
  <line x1="35" y1="18" x2="355" y2="18" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="51" x2="355" y2="51" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="84" x2="355" y2="84" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="117" x2="355" y2="117" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="150" x2="355" y2="150" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="183" x2="355" y2="183" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="216" x2="355" y2="216" stroke="#1e293b" stroke-width="1"/>

  <!-- Tick marks on centre axes (minor ticks every 8px) -->
  <!-- Centre x=195 (vertical axis), centre y=117 (horizontal axis) -->
  <!-- Horizontal centre line (brighter) -->
  <line x1="35" y1="117" x2="355" y2="117" stroke="#2d3f5f" stroke-width="1.2"/>
  <!-- Vertical centre line -->
  <line x1="195" y1="18" x2="195" y2="216" stroke="#2d3f5f" stroke-width="1.2"/>

  <!-- Minor ticks on horizontal centre at every 8px -->
  <line x1="43" y1="114" x2="43" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="51" y1="114" x2="51" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="59" y1="114" x2="59" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="67" y1="114" x2="67" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="83" y1="114" x2="83" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="91" y1="114" x2="91" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="99" y1="114" x2="99" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="107" y1="114" x2="107" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="123" y1="114" x2="123" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="131" y1="114" x2="131" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="139" y1="114" x2="139" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="147" y1="114" x2="147" y2="120" stroke="#2d3f5f" stroke-width="0.8"/>

  <!-- Minor ticks on vertical centre -->
  <line x1="192" y1="26" x2="198" y2="26" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="192" y1="34" x2="198" y2="34" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="192" y1="42" x2="198" y2="42" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="192" y1="59" x2="198" y2="59" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="192" y1="67" x2="198" y2="67" stroke="#2d3f5f" stroke-width="0.8"/>
  <line x1="192" y1="75" x2="198" y2="75" stroke="#2d3f5f" stroke-width="0.8"/>

  <!-- Sine wave:
    - sensitivity 5mV/div
    - peak = 3 div above centre = 3 × 33px = 99px above y=117 → peak y=18
    - Wait: 6 div = 198px total, each div = 33px. Centre y=117.
    - Peak 3 div above = 117 - 99 = 18 ✓ (exactly the top graticule line)
    - Trough 3 div below = 117 + 99 = 216 ✓ (exactly bottom)
    - Period = 4 div = 4×40px = 160px (4ms). 2 complete cycles = 320px (x=35 to 355) ✓
  -->
  <polyline fill="none" stroke="#06b6d4" stroke-width="2.2"
    points="
      35,117
      39,101 43,80 47,60 51,40 55,24 59,18 63,18 67,22 71,33 75,50 79,71 83,93 87,117
      91,141 95,162 99,183 103,201 107,210 111,216 115,216 119,212 123,201 127,184 131,163 135,141 139,117
      143,93 147,72 151,52 155,35 159,21 163,18 167,18 171,21 175,33 179,51 183,72 187,93 191,117
      195,141 199,162 203,183 207,201 211,210 215,216 219,216 223,212 227,201 231,184 235,163 239,141 243,117
      247,93 251,72 255,52 259,35 263,21 267,18 271,18 275,21 279,33 283,51 287,72 291,93 295,117
      299,141 303,162 307,183 311,201 315,210 319,216 323,216 327,212 331,201 335,184 339,163 343,141 347,117
      351,93 355,72
    "/>

  <!-- Peak annotation: 3 div arrow -->
  <line x1="362" y1="18" x2="362" y2="117" stroke="#f59e0b" stroke-width="1"/>
  <polyline points="359,22 362,18 365,22" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <polyline points="359,113 362,117 365,113" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <text x="375" y="72" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#f59e0b">3 div</text>
  <text x="375" y="84" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#f59e0b">=15mV</text>

  <!-- Labels on screen -->
  <text x="38" y="230" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">5mV/div</text>
  <text x="130" y="230" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">1ms/div</text>

  <!-- Div labels on left axis -->
  <text x="22" y="21" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">+3</text>
  <text x="22" y="54" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">+2</text>
  <text x="22" y="87" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">+1</text>
  <text x="22" y="120" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">0</text>
  <text x="22" y="153" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">-1</text>
  <text x="22" y="186" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">-2</text>
  <text x="22" y="219" text-anchor="end" font-family="IBM Plex Mono" font-size="7" fill="#64748b">-3</text>

  <!-- RIGHT SIDE: Settings and answer options -->
  <rect x="405" y="10" width="180" height="220" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
  <text x="495" y="28" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">Oscilloscope</text>
  <line x1="410" y1="33" x2="580" y2="33" stroke="#1e293b" stroke-width="1"/>

  <!-- Settings display -->
  <text x="415" y="48" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">Sensitivity:</text>
  <text x="510" y="48" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">5 mV/div</text>
  <text x="415" y="63" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">Timebase:</text>
  <text x="510" y="63" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">1 ms/div</text>

  <line x1="410" y1="72" x2="580" y2="72" stroke="#1e293b" stroke-width="0.8"/>

  <text x="495" y="87" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">Peak amplitude?</text>
  <text x="495" y="100" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#64748b">(3 div × 5mV/div)</text>

  <line x1="410" y1="108" x2="580" y2="108" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Answer options -->
  <text x="415" y="124" font-family="IBM Plex Mono" font-size="10" fill="#06b6d4" font-weight="bold">A</text>
  <text x="430" y="124" font-family="IBM Plex Mono" font-size="10" fill="#06b6d4">= 15mV ✓</text>

  <text x="415" y="142" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" font-weight="bold">B</text>
  <text x="430" y="142" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8">= 7.5mV</text>

  <text x="415" y="160" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" font-weight="bold">C</text>
  <text x="430" y="160" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8">= 30mV</text>

  <text x="415" y="178" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" font-weight="bold">D</text>
  <text x="430" y="178" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8">= 5mV</text>

  <line x1="410" y1="187" x2="580" y2="187" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Calculation shown -->
  <text x="495" y="200" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#f59e0b">3 div × 5mV</text>
  <text x="495" y="212" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#f59e0b">= 15mV peak</text>
  <text x="495" y="224" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#64748b">(pk-pk = 30mV)</text>

  <!-- Caption -->
  <text x="300" y="260" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="#64748b">Full 9B (D2F-M1-Q73) — Oscilloscope reading: peak amplitude from graticule</text>

  <!-- Sub-caption for clarification -->
  <text x="300" y="275" text-anchor="middle" font-family="IBM Plex Sans" font-size="9" fill="#475569">Waveform peaks at 3 divisions above zero line; 3 div × 5mV/div = 15mV</text>
</svg>
