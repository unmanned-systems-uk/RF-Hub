<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title hint -->
  <text x="300" y="18" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Colpitts oscillator — identify function of coupling capacitor C</text>

  <!-- ===== VCC ===== -->
  <text x="310" y="38" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">V_CC</text>
  <line x1="230" y1="42" x2="390" y2="42" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_C from VCC to collector ===== -->
  <line x1="310" y1="42" x2="310" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="293" y="58" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="310" y="68" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_C</text>
  <line x1="310" y1="72" x2="310" y2="88" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== NPN Transistor centred (350,128) ===== -->
  <circle cx="350" cy="128" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base wire -->
  <line x1="260" y1="128" x2="322" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base junction vertical -->
  <line x1="322" y1="110" x2="322" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector -->
  <line x1="322" y1="110" x2="350" y2="93" stroke="#94a3b8" stroke-width="2"/>
  <line x1="350" y1="93" x2="350" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <!-- wire collector up to RC -->
  <line x1="310" y1="88" x2="350" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="350" y1="72" x2="350" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter with arrow -->
  <line x1="322" y1="146" x2="350" y2="163" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="345,160 354,166 348,170" fill="#94a3b8"/>
  <line x1="350" y1="163" x2="350" y2="195" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_E from emitter to GND ===== -->
  <rect x="333" y="195" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="350" y="205" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_E</text>
  <line x1="350" y1="209" x2="350" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND -->
  <line x1="338" y1="225" x2="362" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <line x1="342" y1="229" x2="358" y2="229" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="346" y1="233" x2="354" y2="233" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== Colpitts feedback tank (collector-emitter) ===== -->
  <!-- Vertical bus left side: from collector node down to emitter node -->
  <line x1="415" y1="88" x2="415" y2="163" stroke="#94a3b8" stroke-width="2"/>
  <!-- wire collector to right bus -->
  <line x1="350" y1="88" x2="415" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <!-- wire emitter to right bus -->
  <line x1="350" y1="163" x2="415" y2="163" stroke="#94a3b8" stroke-width="2"/>

  <!-- C1 capacitor (top half) — parallel plates -->
  <!-- top plate -->
  <line x1="415" y1="108" x2="445" y2="108" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- bottom plate -->
  <line x1="415" y1="114" x2="445" y2="114" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- C1 label -->
  <text x="450" y="115" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">C1</text>
  <!-- wire above C1 -->
  <line x1="415" y1="88" x2="415" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <!-- midpoint node wire between C1 and C2 -->
  <line x1="415" y1="114" x2="415" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <!-- tap to GND at midpoint -->
  <line x1="415" y1="128" x2="430" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <line x1="418" y1="125" x2="442" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <line x1="422" y1="129" x2="438" y2="129" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="426" y1="133" x2="434" y2="133" stroke="#94a3b8" stroke-width="1"/>

  <!-- C2 capacitor (bottom half) -->
  <line x1="415" y1="143" x2="445" y2="143" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="415" y1="149" x2="445" y2="149" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="450" y="150" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">C2</text>
  <!-- wire C2 to bottom bus -->
  <line x1="415" y1="149" x2="415" y2="163" stroke="#94a3b8" stroke-width="2"/>

  <!-- Inductor L in parallel with C1+C2 (right side) -->
  <!-- arc bumps style inductor, vertical orientation along right rail -->
  <!-- L parallel: connect collector rail to emitter rail via L on far right -->
  <line x1="475" y1="88" x2="475" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- 4 arc bumps -->
  <path d="M475,100 Q481,100 481,107 Q481,114 475,114" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M475,114 Q481,114 481,121 Q481,128 475,128" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M475,128 Q481,128 481,135 Q481,142 475,142" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M475,142 Q481,142 481,149 Q481,156 475,156" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="475" y1="156" x2="475" y2="163" stroke="#94a3b8" stroke-width="2"/>
  <!-- connect L to collector/emitter rails -->
  <line x1="415" y1="88" x2="475" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="415" y1="163" x2="475" y2="163" stroke="#94a3b8" stroke-width="2"/>
  <text x="482" y="132" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">L</text>

  <!-- ===== COUPLING CAPACITOR "C" (feedback: collector to base) ===== -->
  <!-- horizontal cap in feedback path from collector node (350,88) back to base (260,128) -->
  <!-- route: from (310,88) left along top to (200,88) then down to (200,128) then right to base (260,128) -->
  <line x1="310" y1="88" x2="200" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <!-- coupling cap plates horizontal -->
  <line x1="200" y1="88" x2="200" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <line x1="188" y1="105" x2="212" y2="105" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="188" y1="111" x2="212" y2="111" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="200" y1="111" x2="200" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="128" x2="260" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <!-- "C" label with highlight -->
  <text x="218" y="112" font-family="IBM Plex Mono" font-size="14" fill="#fbbf24" font-weight="bold">C</text>
  <!-- arrow pointing to C -->
  <line x1="242" y1="95" x2="218" y2="105" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="240,91 246,98 238,99" fill="#fbbf24"/>
  <text x="248" y="92" font-family="IBM Plex Mono" font-size="9" fill="#fbbf24">coupling</text>

  <!-- ===== ANSWER OPTIONS PANEL ===== -->
  <rect x="10" y="244" width="580" height="38" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <!-- A correct -->
  <rect x="18" y="250" width="130" height="26" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="83" y="267" font-family="IBM Plex Mono" font-size="9" fill="#22c55e" text-anchor="middle">A  Block DC / pass AC ✓</text>
  <!-- B -->
  <rect x="158" y="250" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="223" y="267" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">B  Store charge</text>
  <!-- C -->
  <rect x="298" y="250" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="363" y="267" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">C  Smooth supply</text>
  <!-- D -->
  <rect x="438" y="250" width="150" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="513" y="267" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">D  Set freq with C1/C2</text>

  <!-- CAPTION -->
  <text x="300" y="292" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Full 2E (D2F-M1-Q21) — Colpitts oscillator: what is the function of capacitor C?</text>
</svg>
