<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title hint -->
  <text x="300" y="18" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Hartley oscillator — identify function of coupling capacitor C</text>

  <!-- ===== VCC ===== -->
  <text x="320" y="38" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">V_CC</text>
  <line x1="200" y1="42" x2="440" y2="42" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_C from VCC to collector ===== -->
  <line x1="320" y1="42" x2="320" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="303" y="58" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="68" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_C</text>
  <line x1="320" y1="72" x2="320" y2="90" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== RB1 voltage divider bias ===== -->
  <!-- RB1 from VCC to base node -->
  <line x1="230" y1="42" x2="230" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <rect x="213" y="68" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="78" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_B1</text>
  <line x1="230" y1="82" x2="230" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- RB2 from base node to GND -->
  <line x1="230" y1="130" x2="230" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <rect x="213" y="148" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="158" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_B2</text>
  <line x1="230" y1="162" x2="230" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND at RB2 bottom -->
  <line x1="218" y1="200" x2="242" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="222" y1="204" x2="238" y2="204" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="226" y1="208" x2="234" y2="208" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== NPN Transistor centred (360,125) ===== -->
  <circle cx="360" cy="125" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base wire from bias node -->
  <line x1="230" y1="130" x2="332" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base junction vertical -->
  <line x1="332" y1="107" x2="332" y2="143" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector -->
  <line x1="332" y1="107" x2="360" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="90" x2="360" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="90" x2="360" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter with arrow -->
  <line x1="332" y1="143" x2="360" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="355,157 364,163 358,167" fill="#94a3b8"/>
  <line x1="360" y1="160" x2="360" y2="185" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_E from emitter to centre tap ===== -->
  <rect x="343" y="185" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="360" y="195" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_E</text>
  <line x1="360" y1="199" x2="360" y2="215" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== HARTLEY tapped inductor ===== -->
  <!-- vertical inductor L with centre tap, from emitter rail to GND -->
  <!-- Top section L_A (3 bumps) from emitter connection to centre tap -->
  <line x1="430" y1="90" x2="430" y2="102" stroke="#94a3b8" stroke-width="2"/>
  <!-- bumps top section -->
  <path d="M430,102 Q436,102 436,109 Q436,116 430,116" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M430,116 Q436,116 436,123 Q436,130 430,130" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M430,130 Q436,130 436,137 Q436,144 430,144" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Centre tap line horizontal to GND -->
  <line x1="430" y1="144" x2="490" y2="144" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="493" y="148" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">centre tap</text>
  <!-- GND at centre tap -->
  <line x1="430" y1="144" x2="430" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <line x1="418" y1="215" x2="442" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="422" y1="219" x2="438" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="426" y1="223" x2="434" y2="223" stroke="#94a3b8" stroke-width="1"/>
  <!-- bumps bottom section -->
  <path d="M430,152 Q436,152 436,159 Q436,166 430,166" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M430,166 Q436,166 436,173 Q436,180 430,180" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M430,180 Q436,180 436,187 Q436,194 430,194" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="194" x2="430" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <!-- L label -->
  <text x="445" y="125" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0">L</text>

  <!-- connect collector to top of L -->
  <line x1="360" y1="90" x2="430" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <!-- connect emitter/RE to bottom of L -->
  <line x1="360" y1="215" x2="430" y2="215" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== COUPLING CAPACITOR "C" from collector back to base ===== -->
  <!-- route: collector node (320,90) → up to (160,90) → down to (160,125) → right to base (230,125) -->
  <line x1="320" y1="90" x2="160" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="90" x2="160" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <!-- cap plates -->
  <line x1="148" y1="108" x2="172" y2="108" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="148" y1="114" x2="172" y2="114" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="160" y1="114" x2="160" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="130" x2="230" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- "C" label highlighted -->
  <text x="176" y="115" font-family="IBM Plex Mono" font-size="16" fill="#fbbf24" font-weight="bold">C</text>
  <!-- annotation arrow -->
  <line x1="200" y1="98" x2="182" y2="108" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="198,94 205,101 197,102" fill="#fbbf24"/>
  <text x="203" y="95" font-family="IBM Plex Mono" font-size="9" fill="#fbbf24">coupling</text>

  <!-- ===== ANSWER OPTIONS ===== -->
  <rect x="10" y="244" width="580" height="38" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <rect x="18" y="250" width="130" height="26" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="83" y="267" font-family="IBM Plex Mono" font-size="9" fill="#22c55e" text-anchor="middle">A  Block DC / pass AC ✓</text>
  <rect x="158" y="250" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="223" y="267" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">B  Resonate with L</text>
  <rect x="298" y="250" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="363" y="267" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">C  Smooth ripple</text>
  <rect x="438" y="250" width="150" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="513" y="267" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">D  Bypass AC to GND</text>

  <!-- CAPTION -->
  <text x="300" y="292" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Full 2E (D2F-M2-Q27) — Hartley oscillator: what is the function of coupling capacitor C?</text>
</svg>
