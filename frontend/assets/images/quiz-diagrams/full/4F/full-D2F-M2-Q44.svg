<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Panel A: top-left — BNC -->
  <rect x="10" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="30" y="32" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">A</text>
  <!-- BNC: smaller cylindrical body with bayonet lugs -->
  <rect x="75" y="57" width="100" height="26" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bayonet lugs top and bottom -->
  <rect x="105" y="49" width="9" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="105" y="83" width="9" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="135" y="49" width="9" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="135" y="83" width="9" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Centre pin -->
  <line x1="175" y1="70" x2="198" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <text x="137" y="108" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">BNC</text>

  <!-- Panel B: top-right — SMA -->
  <rect x="315" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="335" y="32" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">B</text>
  <!-- SMA: small hexagonal body -->
  <polygon points="432,57 452,52 472,57 472,87 452,92 432,87" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Centre pin -->
  <line x1="472" y1="72" x2="492" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <!-- Thread lines -->
  <line x1="479" y1="66" x2="479" y2="78" stroke="#94a3b8" stroke-width="1"/>
  <line x1="485" y1="66" x2="485" y2="78" stroke="#94a3b8" stroke-width="1"/>
  <text x="452" y="108" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">SMA</text>

  <!-- Panel C: bottom-left — PL259 (CORRECT) -->
  <rect x="10" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="30" y="180" font-family="IBM Plex Mono,monospace" font-size="13" fill="#06b6d4">C</text>
  <!-- PL259: large cylindrical body rect ~80×25 -->
  <rect x="55" y="200" width="155" height="30" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Knurled grip: hatch lines on left third -->
  <line x1="65" y1="201" x2="65" y2="229" stroke="#94a3b8" stroke-width="1"/>
  <line x1="72" y1="201" x2="72" y2="229" stroke="#94a3b8" stroke-width="1"/>
  <line x1="79" y1="201" x2="79" y2="229" stroke="#94a3b8" stroke-width="1"/>
  <line x1="86" y1="201" x2="86" y2="229" stroke="#94a3b8" stroke-width="1"/>
  <line x1="93" y1="201" x2="93" y2="229" stroke="#94a3b8" stroke-width="1"/>
  <!-- Threaded nose rings (right side) -->
  <line x1="173" y1="202" x2="173" y2="228" stroke="#94a3b8" stroke-width="1"/>
  <line x1="180" y1="202" x2="180" y2="228" stroke="#94a3b8" stroke-width="1"/>
  <line x1="187" y1="202" x2="187" y2="228" stroke="#94a3b8" stroke-width="1"/>
  <!-- Centre pin protruding right -->
  <line x1="210" y1="215" x2="238" y2="215" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="238" cy="215" r="3" fill="#94a3b8"/>
  <text x="137" y="256" font-family="IBM Plex Mono,monospace" font-size="12" fill="#06b6d4" text-anchor="middle">PL259</text>
  <text x="265" y="180" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#06b6d4" text-anchor="end">✓</text>

  <!-- Panel D: bottom-right — N-type -->
  <rect x="315" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="335" y="180" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">D</text>
  <!-- N-type: large circular flange -->
  <circle cx="435" cy="215" r="33" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="435" cy="215" r="18" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Dashed thread on outer ring -->
  <line x1="418" y1="183" x2="418" y2="248" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <!-- Centre pin -->
  <line x1="453" y1="215" x2="478" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="459" y1="210" x2="459" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="465" y1="210" x2="465" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <text x="435" y="268" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">N-type</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Full 4F (D2F-M2-Q44) — RF connector identification: which is a PL259 plug?</text>
</svg>
