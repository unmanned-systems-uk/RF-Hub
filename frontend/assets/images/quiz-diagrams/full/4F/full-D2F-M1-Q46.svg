<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">Antenna matching unit — identify the network topology</text>

  <!-- ═══ PI-NETWORK CIRCUIT ═══ -->
  <!-- Input terminal -->
  <circle cx="60" cy="110" r="5" fill="#94a3b8"/>
  <text x="20" y="114" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">INPUT</text>
  <!-- Top rail: input → L → output -->
  <line x1="65" y1="110" x2="165" y2="110" stroke="#94a3b8" stroke-width="2"/>

  <!-- Inductor L between C1 and C2 on top rail -->
  <!-- L coil arcs from x=165 to x=310 -->
  <path d="M 165,110 Q 178,90 191,110" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 191,110 Q 204,90 217,110" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 217,110 Q 230,90 243,110" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 243,110 Q 256,90 269,110" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="269" y1="110" x2="340" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="88" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="middle">L</text>

  <!-- GND rail (bottom) -->
  <line x1="60" y1="175" x2="540" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol centre -->
  <line x1="295" y1="175" x2="295" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="282" y1="195" x2="308" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="286" y1="200" x2="304" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="290" y1="205" x2="300" y2="205" stroke="#94a3b8" stroke-width="1"/>

  <!-- C1: left shunt cap from input node down to GND -->
  <line x1="65" y1="110" x2="65" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="52" y1="140" x2="78" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="52" y1="148" x2="78" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="148" x2="65" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <text x="82" y="148" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">C1</text>

  <!-- C2: right shunt cap from output node down to GND -->
  <line x1="340" y1="110" x2="340" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="327" y1="140" x2="353" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="327" y1="148" x2="353" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="148" x2="340" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <text x="357" y="148" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">C2</text>

  <!-- Output terminal -->
  <line x1="340" y1="110" x2="530" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="530" cy="110" r="5" fill="#94a3b8"/>
  <text x="538" y="114" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">OUTPUT</text>

  <!-- π shape annotation -->
  <text x="210" y="50" font-family="IBM Plex Mono" font-size="11" fill="#64748b" text-anchor="middle">Topology resembles the letter π</text>
  <!-- decorative π-like path hint -->
  <path d="M 140,58 L 140,68 M 140,63 L 280,63 M 280,58 L 280,68" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ ANSWER OPTIONS ═══ -->
  <rect x="10" y="215" width="580" height="55" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>

  <rect x="20" y="225" width="115" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="78" y="240" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">A: L-network</text>

  <rect x="145" y="225" width="115" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="203" y="240" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">B: T-network</text>

  <!-- C correct -->
  <rect x="270" y="225" width="115" height="22" rx="3" fill="#0a0e1a" stroke="#06b6d4" stroke-width="2"/>
  <text x="328" y="240" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4" text-anchor="middle">C: π-network ✓</text>

  <rect x="395" y="225" width="115" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="453" y="240" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">D: Balun</text>

  <text x="300" y="260" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Correct answer: C — shunt-series-shunt (C1–L–C2) = π topology</text>

  <!-- Caption -->
  <text x="300" y="290" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Full 4F (D2F-M1-Q46) — Antenna matching unit: identify the network topology</text>
</svg>
