<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Panel A: top-left — PL259 -->
  <rect x="10" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="30" y="32" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">A</text>
  <!-- PL259: large cylindrical body -->
  <rect x="65" y="55" width="145" height="35" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Knurled grip (left third hatch) -->
  <line x1="65" y1="55" x2="65" y2="90" stroke="#94a3b8" stroke-width="1"/>
  <line x1="75" y1="55" x2="75" y2="90" stroke="#94a3b8" stroke-width="1"/>
  <line x1="85" y1="55" x2="85" y2="90" stroke="#94a3b8" stroke-width="1"/>
  <line x1="95" y1="55" x2="95" y2="90" stroke="#94a3b8" stroke-width="1"/>
  <!-- Thread rings at right end -->
  <line x1="180" y1="57" x2="180" y2="88" stroke="#94a3b8" stroke-width="1"/>
  <line x1="190" y1="57" x2="190" y2="88" stroke="#94a3b8" stroke-width="1"/>
  <!-- Centre pin protruding right -->
  <line x1="210" y1="72" x2="230" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <text x="137" y="108" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">PL259</text>

  <!-- Panel B: top-right — SMA -->
  <rect x="315" y="10" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="335" y="32" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">B</text>
  <!-- SMA: small hexagonal body -->
  <polygon points="430,57 450,52 470,57 470,87 450,92 430,87" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Centre pin -->
  <line x1="470" y1="72" x2="490" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <!-- Thread lines on nose -->
  <line x1="480" y1="66" x2="480" y2="78" stroke="#94a3b8" stroke-width="1"/>
  <line x1="486" y1="66" x2="486" y2="78" stroke="#94a3b8" stroke-width="1"/>
  <text x="452" y="108" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">SMA</text>

  <!-- Panel C: bottom-left — BNC (CORRECT) -->
  <rect x="10" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="30" y="180" font-family="IBM Plex Mono,monospace" font-size="13" fill="#06b6d4">C</text>
  <!-- BNC: cylindrical body -->
  <rect x="70" y="200" width="120" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bayonet lugs: two small rectangles protruding from sides top and bottom -->
  <rect x="110" y="192" width="10" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="110" y="230" width="10" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="145" y="192" width="10" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="145" y="230" width="10" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Centre pin -->
  <line x1="190" y1="215" x2="215" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <text x="137" y="256" font-family="IBM Plex Mono,monospace" font-size="12" fill="#06b6d4" text-anchor="middle">BNC</text>
  <text x="265" y="180" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#06b6d4" text-anchor="end">✓</text>

  <!-- Panel D: bottom-right — N-type -->
  <rect x="315" y="158" width="275" height="130" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="335" y="180" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">D</text>
  <!-- N-type: large circular flange body -->
  <circle cx="430" cy="215" r="35" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="430" cy="215" r="20" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Thread lines on outer ring -->
  <line x1="415" y1="181" x2="415" y2="250" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <!-- Centre pin protruding right -->
  <line x1="450" y1="215" x2="480" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <!-- Thread rings on nose -->
  <line x1="456" y1="210" x2="456" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="462" y1="210" x2="462" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <text x="430" y="270" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">N-type</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Full 4F (D2F-M1-Q47) — RF connector identification: which is a BNC plug?</text>
</svg>
