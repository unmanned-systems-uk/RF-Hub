<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title hint -->
  <text x="300" y="18" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">LC oscillator — which components determine the output frequency?</text>

  <!-- ===== VCC ===== -->
  <text x="290" y="38" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">V_CC</text>
  <line x1="180" y1="42" x2="400" y2="42" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_C from VCC to collector ===== -->
  <line x1="290" y1="42" x2="290" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="273" y="58" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="290" y="68" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_C</text>
  <line x1="290" y1="72" x2="290" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <text x="310" y="67" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">R_C</text>

  <!-- ===== R_B bias from VCC to base ===== -->
  <line x1="210" y1="42" x2="210" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="193" y="58" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="210" y="68" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_B</text>
  <line x1="210" y1="72" x2="210" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="67" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">R_B</text>

  <!-- ===== NPN Transistor centred (330,118) ===== -->
  <circle cx="330" cy="118" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base wire -->
  <line x1="210" y1="118" x2="302" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base junction -->
  <line x1="302" y1="100" x2="302" y2="136" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector -->
  <line x1="302" y1="100" x2="330" y2="83" stroke="#94a3b8" stroke-width="2"/>
  <line x1="330" y1="83" x2="330" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <line x1="290" y1="88" x2="330" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter with NPN arrow -->
  <line x1="302" y1="136" x2="330" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="325,150 334,156 328,160" fill="#94a3b8"/>
  <line x1="330" y1="153" x2="330" y2="172" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_E from emitter to GND ===== -->
  <rect x="313" y="172" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="330" y="182" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R_E</text>
  <line x1="330" y1="186" x2="330" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <text x="348" y="182" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">R_E</text>
  <!-- GND emitter -->
  <line x1="318" y1="210" x2="342" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="322" y1="214" x2="338" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="326" y1="218" x2="334" y2="218" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== LC TANK CIRCUIT (feedback) — prominently shown ===== -->
  <!-- Tank sits between collector (290,88) and emitter side, on the right -->
  <!-- Vertical rails for tank -->
  <line x1="430" y1="88" x2="430" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- connect collector to tank top -->
  <line x1="330" y1="88" x2="430" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <!-- connect emitter/GND to tank bottom -->
  <line x1="330" y1="210" x2="430" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- Inductor L — arc bumps left branch of tank (vertical) -->
  <line x1="430" y1="88" x2="430" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <path d="M430,105 Q436,105 436,112 Q436,119 430,119" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <path d="M430,119 Q436,119 436,126 Q436,133 430,133" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <path d="M430,133 Q436,133 436,140 Q436,147 430,147" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <path d="M430,147 Q436,147 436,154 Q436,161 430,161" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="430" y1="161" x2="430" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- L label highlighted -->
  <text x="444" y="140" font-family="IBM Plex Mono" font-size="14" fill="#fbbf24" font-weight="bold">L</text>

  <!-- C1 capacitor — right branch of tank (top half) -->
  <line x1="490" y1="88" x2="490" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <line x1="478" y1="128" x2="502" y2="128" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="478" y1="134" x2="502" y2="134" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="490" y1="134" x2="490" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <!-- C1 label highlighted -->
  <text x="505" y="136" font-family="IBM Plex Mono" font-size="12" fill="#fbbf24" font-weight="bold">C1</text>

  <!-- C2 capacitor — right branch of tank (bottom half) -->
  <line x1="490" y1="163" x2="490" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="478" y1="163" x2="502" y2="163" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="478" y1="169" x2="502" y2="169" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="490" y1="169" x2="490" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- C2 label highlighted -->
  <text x="505" y="170" font-family="IBM Plex Mono" font-size="12" fill="#fbbf24" font-weight="bold">C2</text>

  <!-- connect L and C1/C2 in parallel (shared rails) -->
  <line x1="430" y1="88" x2="490" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="175" x2="490" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- midpoint C1/C2 join -->
  <line x1="490" y1="148" x2="490" y2="163" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- midpoint to GND -->
  <line x1="430" y1="175" x2="430" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- LC tank highlight box -->
  <rect x="420" y="82" width="145" height="136" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="78" font-family="IBM Plex Mono" font-size="9" fill="#fbbf24">LC tank</text>

  <!-- feedback wire from tank midpoint back to base -->
  <line x1="430" y1="148" x2="400" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="400" y1="148" x2="400" y2="118" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="400" y1="118" x2="358" y2="118" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ===== ANSWER OPTIONS ===== -->
  <rect x="10" y="232" width="580" height="38" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <rect x="18" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="83" y="255" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">A  R_B and C1</text>
  <rect x="158" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="223" y="255" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">B  R_C and R_E</text>
  <rect x="298" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="363" y="255" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" text-anchor="middle">C  Transistor type</text>
  <rect x="438" y="238" width="150" height="26" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="513" y="255" font-family="IBM Plex Mono" font-size="10" fill="#22c55e" text-anchor="middle">D  L and C ✓</text>

  <!-- CAPTION -->
  <text x="300" y="284" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Full 2G (D2F-M2-Q24) — LC oscillator: which components determine output frequency?</text>
</svg>
