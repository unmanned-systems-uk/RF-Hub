<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Main diagram: toroid with mains lead winding — centred left/centre ~x=200 -->
  <!-- Outer toroid ring -->
  <circle cx="210" cy="145" r="58" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <!-- Inner hole -->
  <circle cx="210" cy="145" r="32" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Core fill hint -->
  <circle cx="210" cy="145" r="44" fill="#1e293b" stroke="none"/>
  <circle cx="210" cy="145" r="32" fill="#0a0e1a" stroke="none"/>
  <!-- Re-draw rings on top -->
  <circle cx="210" cy="145" r="58" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="210" cy="145" r="32" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Winding turns: 7 arcs suggesting wire wrapped around toroid -->
  <!-- Each turn: a small arc/ellipse crossing over the toroid body at an angle -->
  <!-- Turn 1 — top -->
  <ellipse cx="210" cy="88"  rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(-15,210,88)"/>
  <!-- Turn 2 -->
  <ellipse cx="228" cy="93"  rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(10,228,93)"/>
  <!-- Turn 3 -->
  <ellipse cx="245" cy="108" rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(35,245,108)"/>
  <!-- Turn 4 — right -->
  <ellipse cx="252" cy="130" rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(60,252,130)"/>
  <!-- Turn 5 -->
  <ellipse cx="245" cy="155" rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(80,245,155)"/>
  <!-- Turn 6 -->
  <ellipse cx="228" cy="172" rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(100,228,172)"/>
  <!-- Turn 7 — bottom-right -->
  <ellipse cx="210" cy="178" rx="7" ry="14" fill="none" stroke="#94a3b8" stroke-width="2" transform="rotate(120,210,178)"/>

  <!-- Mains lead entering left -->
  <line x1="50" y1="140" x2="152" y2="140" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="50" y1="152" x2="152" y2="152" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Mains lead label -->
  <text x="100" y="135" font-family="IBM Plex Mono,monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">mains lead</text>
  <!-- Arrow indicating lead continues right -->
  <line x1="265" y1="140" x2="330" y2="140" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="265" y1="152" x2="330" y2="152" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="330,135 345,146 330,157" fill="#94a3b8"/>

  <!-- Toroid label -->
  <text x="210" y="240" font-family="IBM Plex Mono,monospace" font-size="11" fill="#64748b" text-anchor="middle">Common-Mode Choke</text>

  <!-- Answer options panel: right side -->
  <rect x="360" y="40" width="225" height="200" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="472" y="62" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Core material?</text>

  <!-- Option A -->
  <rect x="374" y="72" width="196" height="34" rx="4" fill="#0a0e1a" stroke="#64748b" stroke-width="1"/>
  <text x="393" y="94" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">A</text>
  <text x="420" y="94" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e2e8f0">Iron</text>

  <!-- Option B -->
  <rect x="374" y="114" width="196" height="34" rx="4" fill="#0a0e1a" stroke="#64748b" stroke-width="1"/>
  <text x="393" y="136" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">B</text>
  <text x="420" y="136" font-family="IBM Plex Mono,monospace" font-size="13" fill="#e2e8f0">Silicon Steel</text>

  <!-- Option C -->
  <rect x="374" y="156" width="196" height="34" rx="4" fill="#0a0e1a" stroke="#64748b" stroke-width="1"/>
  <text x="393" y="178" font-family="IBM Plex Mono,monospace" font-size="13" fill="#64748b">C</text>
  <text x="420" y="178" font-family="IBM Plex Mono,monospace" font-size="12" fill="#e2e8f0">Laminated Iron</text>

  <!-- Option D — CORRECT -->
  <rect x="374" y="198" width="196" height="34" rx="4" fill="#0a0e1a" stroke="#06b6d4" stroke-width="2"/>
  <text x="393" y="220" font-family="IBM Plex Mono,monospace" font-size="13" fill="#06b6d4">D</text>
  <text x="420" y="220" font-family="IBM Plex Mono,monospace" font-size="13" fill="#06b6d4">Ferrite</text>
  <text x="556" y="220" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#06b6d4" text-anchor="end">✓</text>

  <!-- Caption -->
  <text x="300" y="290" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Full 6D (D2F-M1-Q58) — Common-mode choke on mains lead: what material is the core?</text>
</svg>
