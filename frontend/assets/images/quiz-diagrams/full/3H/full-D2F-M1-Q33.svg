<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- PANEL A: top-left — sharp-edged keying (clicking) -->
  <g id="panel-a">
    <rect x="15" y="25" width="270" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="38" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">A</text>
    <!-- X axis -->
    <line x1="40" y1="105" x2="275" y2="105" stroke="#94a3b8" stroke-width="1"/>
    <!-- Y axis -->
    <line x1="40" y1="35" x2="40" y2="115" stroke="#94a3b8" stroke-width="1"/>
    <!-- Sharp-edged keyed burst: vertical walls, abrupt start/stop -->
    <!-- Silent region, then burst, then silent again -->
    <!-- Pre-burst silence at zero line -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="42,105 70,105"/>
    <!-- Abrupt vertical edge up -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="70,105 70,65"/>
    <!-- Sine burst (sharp edges) — amplitude 40px, period 22px -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="70,65 73,53 76,45 79,53 82,65 85,77 88,85 91,77 94,65 97,53 100,45 103,53 106,65 109,77 112,85 115,77 118,65 121,53 124,45 127,53 130,65 133,77 136,85 139,77 142,65 145,53 148,45 151,53 154,65 157,77 160,85 163,77 166,65 169,53 172,45 175,53 178,65 181,77 184,85 187,77 190,65"/>
    <!-- Abrupt vertical edge down -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="190,65 190,105"/>
    <!-- Post-burst silence -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="190,105 272,105"/>
    <!-- Label: sharp edges annotation -->
    <text x="157" y="120" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">abrupt keying (clicks)</text>
  </g>

  <!-- PANEL B: top-right — chirp/frequency drift -->
  <g id="panel-b">
    <rect x="315" y="25" width="270" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="325" y="38" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">B</text>
    <!-- X axis -->
    <line x1="340" y1="105" x2="575" y2="105" stroke="#94a3b8" stroke-width="1"/>
    <!-- Y axis -->
    <line x1="340" y1="35" x2="340" y2="115" stroke="#94a3b8" stroke-width="1"/>
    <!-- Chirp: sine wave with increasing period (frequency drifts down) -->
    <!-- Start tight (period ~14px) → widen to (period ~28px) -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="
        342,75
        346,59 350,49 354,59 358,75 362,91 366,101 370,91 374,75
        379,59 384,49 389,59 394,75 399,91 404,101 409,91 414,75
        420,59 426,49 432,59 438,75 444,91 450,101 456,91 462,75
        470,59 478,49 486,59 494,75 502,91 510,101 518,91 526,75
        536,59 546,49 556,59 566,75 572,85
      "/>
    <!-- Chirp annotation arrows -->
    <text x="370" y="120" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">frequency drift / chirp</text>
    <!-- Bracket showing period change -->
    <line x1="342" y1="113" x2="374" y2="113" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="358" y="122" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#64748b">T₁</text>
    <line x1="462" y1="113" x2="526" y2="113" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="494" y="122" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#64748b">T₂&gt;T₁</text>
  </g>

  <!-- PANEL C: bottom-left — smooth shaped keying (CORRECT) -->
  <g id="panel-c">
    <rect x="15" y="148" width="270" height="110" rx="4" fill="#0f1629" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="25" y="161" font-family="IBM Plex Mono" font-size="11" fill="#06b6d4" font-weight="bold">C</text>
    <!-- X axis -->
    <line x1="40" y1="228" x2="275" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <!-- Y axis -->
    <line x1="40" y1="158" x2="40" y2="238" stroke="#94a3b8" stroke-width="1"/>
    <!-- Smooth raised-cosine shaped envelope: gradual rise, sustained, gradual fall -->
    <!-- Envelope calculated: 0 → ramps up over 25px → holds → ramps down over 25px → 0 -->
    <!-- Sine: amplitude scaled by envelope -->
    <!-- Rise: x=55 to 80 (25px), amp 0→35 -->
    <!-- Sustain: x=80 to 195 (115px), amp=35 -->
    <!-- Fall: x=195 to 220 (25px), amp 35→0 -->
    <!-- Centre y=198 (228-30=198), period=22px -->
    <polyline fill="none" stroke="#06b6d4" stroke-width="2"
      points="
        42,228
        55,228
        57,226 59,222 61,218 63,216 65,215
        67,208 69,196 71,187 73,184 75,187 77,196 79,208 81,222
        83,215 85,203 87,191 89,184 91,183 93,186 95,195 97,207
        99,221 101,228 103,222 105,210 107,197 109,187 111,183 113,186 115,195 117,208
        119,221 121,228 123,222 125,210 127,197 129,187 131,183 133,186 135,195 137,207
        139,221 141,228 143,222 145,210 147,197 149,187 151,183 153,186 155,195 157,207
        159,221 161,228 163,222 165,210 167,197 169,187 171,183 173,186 175,195 177,208
        179,220 181,226 183,228
        186,226 188,223 190,220 192,218 194,217
        196,219 198,222 200,225 202,227 204,228
        206,228 272,228
      "/>
    <!-- Envelope outline (dashed) -->
    <polyline fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"
      points="55,228 58,222 63,213 70,200 80,191 90,183 100,180 110,183 120,191 130,200 140,191 150,183 160,180 170,183 180,191 190,200 197,213 202,222 205,228"/>
    <polyline fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"
      points="55,228 58,234 63,243 70,256 80,265 90,273 100,276 110,273 120,265 130,256 140,265 150,273 160,276 170,273 180,265 190,256 197,243 202,234 205,228"/>
    <!-- Label -->
    <text x="157" y="243" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4">smooth shaped keying ✓</text>
  </g>

  <!-- PANEL D: bottom-right — distorted/clipped sine -->
  <g id="panel-d">
    <rect x="315" y="148" width="270" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="325" y="161" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">D</text>
    <!-- X axis -->
    <line x1="340" y1="228" x2="575" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <!-- Y axis -->
    <line x1="340" y1="158" x2="340" y2="238" stroke="#94a3b8" stroke-width="1"/>
    <!-- Distorted/clipped sine: flat-topped peaks (clipping) with harmonic spikes -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="
        342,198
        345,186 348,178 351,172 354,168
        357,168 360,168 363,168 366,168
        369,172 372,178 375,186 378,198 381,210 384,218 387,224 390,228
        393,228 396,228 399,228
        402,224 405,218 408,210 411,198
        414,186 417,178 420,172 423,168
        426,168 429,168 432,168 435,168
        438,172 441,178 444,186 447,198 450,210 453,218 456,224 459,228
        462,228 465,228 468,228
        471,224 474,218 477,210 480,198
        483,186 486,178 489,172 492,168
        495,168 498,168 501,168 504,168
        507,172 510,178 513,186 516,198 519,210 522,218 525,224 528,228
        531,228 534,228 537,228
        540,224 543,218 546,210 549,198
        552,186 555,178 558,172 561,170 564,170 567,172 570,176 572,180
      "/>
    <!-- Clipping level annotation -->
    <line x1="340" y1="168" x2="575" y2="168" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.4"/>
    <line x1="340" y1="228" x2="575" y2="228" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.4"/>
    <text x="458" y="243" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">clipped / distorted</text>
  </g>

  <!-- Caption -->
  <text x="300" y="280" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="#64748b">Full 3H (D2F-M1-Q33) — CW keying waveforms: which is most desirable?</text>
</svg>
