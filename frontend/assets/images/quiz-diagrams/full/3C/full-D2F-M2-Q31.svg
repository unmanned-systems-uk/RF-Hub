<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">Block diagram — what type of receiver is shown?</text>

  <!-- ═══ SUPERHET RECEIVER BLOCK CHAIN ═══ -->

  <!-- Antenna -->
  <line x1="24" y1="110" x2="24" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="24" y1="88" x2="13" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="88" x2="35" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="88" x2="24" y2="71" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Arrow to RF Amp -->
  <line x1="24" y1="110" x2="40" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="40,106 40,114 48,110" fill="#94a3b8"/>

  <!-- RF Amp -->
  <rect x="48" y="95" width="60" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="78" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">RF Amp</text>

  <!-- Arrow RF Amp → Mixer -->
  <line x1="108" y1="110" x2="126" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="126,106 126,114 134,110" fill="#94a3b8"/>

  <!-- Mixer -->
  <rect x="134" y="95" width="54" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="161" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">Mixer</text>

  <!-- LO → Mixer (from below) -->
  <rect x="134" y="160" width="54" height="28" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="161" y="172" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Local</text>
  <text x="161" y="183" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">Oscillator</text>
  <line x1="161" y1="160" x2="161" y2="129" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="157,129 165,129 161,125" fill="#94a3b8"/>

  <!-- Arrow Mixer → IF Amp -->
  <line x1="188" y1="110" x2="208" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="208,106 208,114 216,110" fill="#94a3b8"/>

  <!-- IF Amp -->
  <rect x="216" y="95" width="60" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="246" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">IF Amp</text>

  <!-- Arrow IF Amp → Detector -->
  <line x1="276" y1="110" x2="296" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="296,106 296,114 304,110" fill="#94a3b8"/>

  <!-- Detector -->
  <rect x="304" y="95" width="62" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="335" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">Detector</text>

  <!-- Arrow Detector → AF Amp -->
  <line x1="366" y1="110" x2="386" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="386,106 386,114 394,110" fill="#94a3b8"/>

  <!-- AF Amp -->
  <rect x="394" y="95" width="60" height="30" rx="3" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="424" y="114" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">AF Amp</text>

  <!-- Arrow AF Amp → Speaker -->
  <line x1="454" y1="110" x2="472" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="472,106 472,114 480,110" fill="#94a3b8"/>

  <!-- Speaker -->
  <rect x="480" y="101" width="12" height="18" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="492,105 504,97 504,123 492,115" fill="#94a3b8"/>
  <path d="M 506,102 Q 513,110 506,118" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 509,98 Q 518,110 509,122" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- Label: IF frequency note -->
  <text x="246" y="145" font-family="IBM Plex Mono" font-size="7" fill="#64748b" text-anchor="middle">fixed IF frequency</text>

  <!-- ═══ ANSWER OPTIONS ═══ -->
  <rect x="10" y="200" width="580" height="70" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>

  <!-- A correct -->
  <text x="22" y="217" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4" font-weight="bold">A</text>
  <text x="34" y="217" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">Superhet receiver  ← correct</text>

  <text x="22" y="234" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" font-weight="bold">B</text>
  <text x="34" y="234" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">TRF receiver (Tuned Radio Frequency)</text>

  <text x="22" y="251" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" font-weight="bold">C</text>
  <text x="34" y="251" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">Regenerative receiver</text>

  <text x="22" y="268" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8" font-weight="bold">D</text>
  <text x="34" y="268" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">Direct-conversion receiver</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Full 3C (D2F-M2-Q31) — Receiver block diagram: what type is shown?</text>
</svg>
