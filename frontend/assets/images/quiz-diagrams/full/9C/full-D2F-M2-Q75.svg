<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      text { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .caption { font-family: 'IBM Plex Sans', 'Arial', sans-serif; }
    </style>
    <marker id="arrow-g3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- ===== CIRCUIT: loaded potential divider =====
       24V supply left vertical, R1(20kΩ) top section, junction node,
       R2(10kΩ) bottom section to GND, voltmeter across R2 in parallel.
       Layout: supply left x=80, top y=30, GND y=250
  -->

  <!-- 24V supply label at top -->
  <text x="80" y="24" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">24V</text>
  <!-- Wire from supply top to R1 top -->
  <line x1="80" y1="28" x2="80" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <!-- + symbol -->
  <text x="65" y="42" fill="#e2e8f0" font-size="10">+</text>

  <!-- R1: IEC rect 60×24, centred x=80, y=72 (60–84) -->
  <rect x="50" y="60" width="60" height="24" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="75" fill="#e2e8f0" font-size="10" text-anchor="middle">R1</text>
  <!-- R1 value label -->
  <text x="30" y="75" fill="#94a3b8" font-size="10" text-anchor="end">20kΩ</text>

  <!-- Wire from R1 bottom to junction node at y=130 -->
  <line x1="80" y1="84" x2="80" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- Junction node dot -->
  <circle cx="80" cy="130" r="4" fill="#e2e8f0"/>

  <!-- Wire from junction down to R2 top -->
  <line x1="80" y1="134" x2="80" y2="155" stroke="#94a3b8" stroke-width="2"/>

  <!-- R2: IEC rect 60×24, centred x=80, y=167 (155–179) -->
  <rect x="50" y="155" width="60" height="24" rx="2" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="170" fill="#e2e8f0" font-size="10" text-anchor="middle">R2</text>
  <!-- R2 value label -->
  <text x="30" y="170" fill="#94a3b8" font-size="10" text-anchor="end">10kΩ</text>

  <!-- Wire from R2 bottom to GND -->
  <line x1="80" y1="179" x2="80" y2="235" stroke="#94a3b8" stroke-width="2"/>

  <!-- GND symbol -->
  <line x1="68" y1="237" x2="92" y2="237" stroke="#94a3b8" stroke-width="2"/>
  <line x1="71" y1="242" x2="89" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="74" y1="247" x2="86" y2="247" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== VOLTMETER across R2 =====
       Connected at junction node (80,130) and R2 bottom (80,235)
       Voltmeter branch at x=180
  -->
  <!-- Tap wire from junction node (80,130) right to voltmeter top -->
  <line x1="80" y1="130" x2="180" y2="130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Tap wire from GND-level (80,235) right to voltmeter bottom -->
  <line x1="80" y1="235" x2="180" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Voltmeter vertical wire -->
  <line x1="180" y1="130" x2="180" y2="163" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="180" y1="202" x2="180" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Voltmeter circle, centred at x=180, y=182 -->
  <circle cx="180" cy="182" r="20" fill="#0d1321" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="180" y="186" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="bold">V</text>

  <!-- Voltmeter spec label -->
  <text x="210" y="175" fill="#38bdf8" font-size="9" text-anchor="start">0–15V</text>
  <text x="210" y="187" fill="#38bdf8" font-size="9" text-anchor="start">10kΩ</text>

  <!-- Parallel indicator label -->
  <text x="130" y="125" fill="#64748b" font-size="8" text-anchor="middle">R2 ∥ V<tspan baseline-shift="sub" font-size="70%">meter</tspan></text>

  <!-- ===== QUESTION TEXT ===== -->
  <text x="290" y="30" fill="#e2e8f0" font-size="11" text-anchor="start">24V supply</text>
  <text x="290" y="48" fill="#e2e8f0" font-size="11" text-anchor="start">R1 = 20kΩ, R2 = 10kΩ</text>
  <text x="290" y="66" fill="#e2e8f0" font-size="11" text-anchor="start">Voltmeter: 0–15V, R=10kΩ</text>
  <text x="290" y="84" fill="#94a3b8" font-size="10" text-anchor="start">What voltage does the</text>
  <text x="290" y="98" fill="#94a3b8" font-size="10" text-anchor="start">voltmeter read?</text>
  <text x="290" y="114" fill="#64748b" font-size="9" text-anchor="start">R<tspan baseline-shift="sub" font-size="70%">load</tspan> = 10k||10k = 5kΩ</text>

  <!-- ===== ANSWER OPTIONS PANEL ===== -->
  <rect x="280" y="125" width="300" height="155" rx="6" fill="#0d1321" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="145" fill="#64748b" font-size="10" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif">SELECT ANSWER</text>

  <!-- A -->
  <rect x="293" y="152" width="128" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="305" y="173" fill="#94a3b8" font-size="13" font-weight="bold">A</text>
  <text x="323" y="173" fill="#e2e8f0" font-size="13">8 V</text>

  <!-- B -->
  <rect x="438" y="152" width="128" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="173" fill="#94a3b8" font-size="13" font-weight="bold">B</text>
  <text x="468" y="173" fill="#e2e8f0" font-size="13">6 V</text>

  <!-- C -->
  <rect x="293" y="197" width="128" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="305" y="218" fill="#94a3b8" font-size="13" font-weight="bold">C</text>
  <text x="323" y="218" fill="#e2e8f0" font-size="13">5 V</text>

  <!-- D -->
  <rect x="438" y="197" width="128" height="34" rx="4" fill="#0a0e1a" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="218" fill="#94a3b8" font-size="13" font-weight="bold">D</text>
  <text x="468" y="218" fill="#e2e8f0" font-size="13">3 V</text>

  <!-- ===== CAPTION ===== -->
  <text x="300" y="282" fill="#64748b" font-size="10" text-anchor="middle" class="caption" font-family="'IBM Plex Sans', Arial, sans-serif">Full 9C (D2F-M2-Q75) — Loaded potential divider: voltmeter loading effect</text>
</svg>
