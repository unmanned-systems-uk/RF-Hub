<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">Filter circuit — identify this network topology</text>

  <!-- ═══ T-SECTION LOW-PASS FILTER ═══ -->
  <!-- Input terminal -->
  <circle cx="55" cy="115" r="5" fill="#94a3b8"/>
  <text x="18" y="119" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">INPUT</text>
  <line x1="60" y1="115" x2="115" y2="115" stroke="#94a3b8" stroke-width="2"/>

  <!-- Inductor L1 (series, left) -->
  <path d="M 115,115 Q 124,98 133,115" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 133,115 Q 142,98 151,115" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 151,115 Q 160,98 169,115" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="169" y1="115" x2="210" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <text x="142" y="94" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="middle">L1</text>

  <!-- Shunt capacitor C1 (to GND, between L1 and L2) -->
  <line x1="210" y1="115" x2="210" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <line x1="198" y1="145" x2="222" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <line x1="198" y1="153" x2="222" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="153" x2="210" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="198" y1="175" x2="222" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="202" y1="180" x2="218" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="206" y1="185" x2="214" y2="185" stroke="#94a3b8" stroke-width="1"/>
  <text x="226" y="153" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">C1</text>

  <!-- Inductor L2 (series, right) -->
  <line x1="210" y1="115" x2="265" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 265,115 Q 274,98 283,115" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 283,115 Q 292,98 301,115" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 301,115 Q 310,98 319,115" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="319" y1="115" x2="360" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <text x="292" y="94" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="middle">L2</text>

  <!-- Output terminal -->
  <circle cx="535" cy="115" r="5" fill="#94a3b8"/>
  <line x1="360" y1="115" x2="530" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <text x="543" y="119" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">OUTPUT</text>

  <!-- GND return rail (bottom) -->
  <line x1="60" y1="175" x2="360" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60" y1="115" x2="60" y2="175" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="360" y1="115" x2="360" y2="175" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- T-shape annotation -->
  <text x="210" y="55" font-family="IBM Plex Mono" font-size="10" fill="#64748b" text-anchor="middle">Two series elements (L1, L2) + one shunt (C1) = T topology</text>
  <!-- T-shape visual hint -->
  <path d="M 115,65 L 319,65 M 210,65 L 210,78" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ ANSWER OPTIONS ═══ -->
  <rect x="10" y="200" width="580" height="70" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>

  <rect x="20" y="210" width="125" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="83" y="225" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">A: High-pass filter</text>

  <rect x="155" y="210" width="125" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="218" y="225" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">B: Band-pass filter</text>

  <rect x="290" y="210" width="125" height="22" rx="3" fill="#0a0e1a" stroke="#94a3b8" stroke-width="1"/>
  <text x="353" y="225" font-family="IBM Plex Mono" font-size="8" fill="#e2e8f0" text-anchor="middle">C: L-network</text>

  <!-- D correct -->
  <rect x="425" y="210" width="155" height="22" rx="3" fill="#0a0e1a" stroke="#06b6d4" stroke-width="2"/>
  <text x="503" y="225" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4" text-anchor="middle">D: Low-pass filter ✓</text>

  <text x="300" y="258" font-family="IBM Plex Mono" font-size="8" fill="#64748b" text-anchor="middle">Correct answer: D — series inductors + shunt capacitor passes low frequencies, blocks high</text>

  <!-- Caption -->
  <text x="300" y="290" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Full 4B (D2F-M2-Q42) — Filter circuit: identify this network topology</text>
</svg>
