<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title hint -->
  <text x="300" y="18" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Class A transistor amplifier — identify bias class from circuit</text>

  <!-- ===== VCC ===== -->
  <text x="300" y="38" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">CC</tspan></text>
  <line x1="170" y1="42" x2="430" y2="42" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R1 (top of voltage divider) VCC to base node ===== -->
  <line x1="240" y1="42" x2="240" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="223" y="58" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="68" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R1</text>
  <line x1="240" y1="72" x2="240" y2="118" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R2 (bottom of voltage divider) base node to GND ===== -->
  <line x1="240" y1="118" x2="240" y2="136" stroke="#94a3b8" stroke-width="2"/>
  <rect x="223" y="136" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="146" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R2</text>
  <line x1="240" y1="150" x2="240" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND R2 -->
  <line x1="228" y1="200" x2="252" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="232" y1="204" x2="248" y2="204" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="236" y1="208" x2="244" y2="208" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== C_in coupling cap at input ===== -->
  <!-- from left signal source to base -->
  <line x1="130" y1="118" x2="148" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <!-- cap plates vertical layout, horizontal signal path -->
  <line x1="148" y1="108" x2="148" y2="128" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="154" y1="108" x2="154" y2="128" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="154" y1="118" x2="240" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <!-- signal input arrow -->
  <line x1="110" y1="118" x2="130" y2="118" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="128,114 136,118 128,122" fill="#94a3b8"/>
  <text x="95" y="122" font-family="IBM Plex Mono" font-size="9" fill="#38bdf8">in</text>
  <!-- C_in label -->
  <text x="142" y="106" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">C<tspan baseline-shift="sub" font-size="70%">in</tspan></text>

  <!-- ===== NPN Transistor centred (320,118) ===== -->
  <circle cx="320" cy="118" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="240" y1="118" x2="292" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="292" y1="100" x2="292" y2="136" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector -->
  <line x1="292" y1="100" x2="320" y2="83" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="83" x2="320" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter with NPN arrow -->
  <line x1="292" y1="136" x2="320" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="315,150 324,156 318,160" fill="#94a3b8"/>
  <line x1="320" y1="153" x2="320" y2="170" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R_C from VCC to collector ===== -->
  <line x1="320" y1="42" x2="320" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="303" y="58" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="68" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
  <line x1="320" y1="72" x2="320" y2="83" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== C_out coupling cap at output (collector) ===== -->
  <line x1="320" y1="72" x2="380" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <!-- cap plates -->
  <line x1="380" y1="62" x2="380" y2="82" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="386" y1="62" x2="386" y2="82" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="386" y1="72" x2="420" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <line x1="420" y1="72" x2="440" y2="72" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="438,68 446,72 438,76" fill="#94a3b8"/>
  <text x="450" y="76" font-family="IBM Plex Mono" font-size="9" fill="#38bdf8">out</text>
  <text x="376" y="58" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">C<tspan baseline-shift="sub" font-size="70%">out</tspan></text>

  <!-- ===== R_E from emitter to GND ===== -->
  <rect x="303" y="170" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="180" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">R<tspan baseline-shift="sub" font-size="70%">E</tspan></text>
  <line x1="320" y1="184" x2="320" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND emitter -->
  <line x1="308" y1="200" x2="332" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="312" y1="204" x2="328" y2="204" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="316" y1="208" x2="324" y2="208" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== C_E bypass cap across R_E ===== -->
  <!-- cap plates horizontal across R_E: right side of emitter branch -->
  <line x1="370" y1="170" x2="370" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="170" x2="380" y2="170" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="360" y1="176" x2="380" y2="176" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="370" y1="184" x2="370" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <!-- wire to join C_E in parallel with R_E -->
  <line x1="337" y1="170" x2="360" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="337" y1="200" x2="370" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND at C_E bottom -->
  <line x1="358" y1="200" x2="382" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="362" y1="204" x2="378" y2="204" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="366" y1="208" x2="374" y2="208" stroke="#94a3b8" stroke-width="1"/>
  <text x="384" y="178" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">C<tspan baseline-shift="sub" font-size="70%">E</tspan></text>

  <!-- ===== Class A annotation ===== -->
  <rect x="458" y="95" width="112" height="40" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="514" y="111" font-family="IBM Plex Mono" font-size="10" fill="#a5b4fc" text-anchor="middle">Q-point:</text>
  <text x="514" y="125" font-family="IBM Plex Mono" font-size="10" fill="#a5b4fc" text-anchor="middle">mid load-line</text>

  <!-- ===== ANSWER OPTIONS ===== -->
  <rect x="10" y="232" width="580" height="38" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <rect x="18" y="238" width="130" height="26" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="83" y="255" font-family="IBM Plex Mono" font-size="10" fill="#22c55e" text-anchor="middle">A  Class A ✓</text>
  <rect x="158" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="223" y="255" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" text-anchor="middle">B  Class B</text>
  <rect x="298" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="363" y="255" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" text-anchor="middle">C  Class C</text>
  <rect x="438" y="238" width="150" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="513" y="255" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" text-anchor="middle">D  Class AB</text>

  <!-- CAPTION -->
  <text x="300" y="284" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Full 2I (D2F-M1-Q27) — Transistor amplifier: identify the bias class from circuit</text>
</svg>
