<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- TOP PANEL: Time domain — 1.5 cycles in 1.5µs -->
  <rect x="15" y="10" width="570" height="120" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
  <text x="300" y="24" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">Time domain: 1.5 cycles shown</text>

  <!-- Time axis -->
  <line x1="40" y1="88" x2="560" y2="88" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40" y1="22" x2="40" y2="118" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="558,84 560,88 558,92" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <polyline points="36,24 40,22 44,24" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="565" y="92" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">t</text>
  <text x="33" y="20" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">V</text>

  <!-- 1.5 sine cycles: period = ~320px for 1 cycle (so 1.5 cycles = 480px), amplitude 35px, cx=50 -->
  <!-- Period = 320px spans x=50 to 370 (one cycle), 1.5 cycles to x=530 -->
  <polyline fill="none" stroke="#06b6d4" stroke-width="2.5"
    points="
      50,88
      58,69 66,53 74,41 82,34 90,34 98,41 106,53 114,69 122,88
      130,107 138,123 146,135 154,142 162,142 170,135 178,123 186,107 194,88
      202,69 210,53 218,41 226,34 234,34 242,41 250,53 258,69 266,88
      274,107 282,123 290,135 298,142 306,142 314,135 322,123 330,107 338,88
      346,69 354,53 362,41 370,34 378,34 386,41 394,53 402,69 410,88
      418,107 426,123 434,135 442,142 450,142 458,135 466,123 474,107 482,88
      490,69 498,53 506,41 514,34 522,35 530,42
    "/>

  <!-- Period annotation for one cycle: T = 1µs, from x=50 to x=370 -->
  <!-- Double arrow below axis for 1.5µs span (x=50 to x=530) -->
  <line x1="50" y1="106" x2="530" y2="106" stroke="#94a3b8" stroke-width="1"/>
  <polyline points="54,103 50,106 54,109" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <polyline points="526,103 530,106 526,109" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="290" y="118" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0">1.5µs</text>

  <!-- T=1µs annotation on first cycle (x=50 to 370) -->
  <line x1="50" y1="96" x2="370" y2="96" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,2"/>
  <polyline points="54,93 50,96 54,99" fill="none" stroke="#f59e0b" stroke-width="0.8"/>
  <polyline points="366,93 370,96 366,99" fill="none" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="210" y="94" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#f59e0b">T = 1µs → f = 1MHz</text>

  <!-- BOTTOM HALF: 4 frequency domain panels in 1×4 row (wide panels) -->
  <!-- Panel A: single line at 0.67MHz -->
  <g id="freq-a">
    <rect x="15" y="142" width="128" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="155" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">A</text>
    <line x1="30" y1="228" x2="136" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="30" y1="155" x2="30" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="138" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Spike at 0.67MHz (placed left of centre) -->
    <line x1="65" y1="228" x2="65" y2="180" stroke="#94a3b8" stroke-width="3"/>
    <text x="65" y="176" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">0.67</text>
    <text x="65" y="186" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#64748b">MHz</text>
    <text x="72" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#64748b">0.67MHz</text>
  </g>

  <!-- Panel B: single line at 1.5MHz -->
  <g id="freq-b">
    <rect x="156" y="142" width="128" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="166" y="155" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">B</text>
    <line x1="171" y1="228" x2="277" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="171" y1="155" x2="171" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="279" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Spike at 1.5MHz (placed right of centre) -->
    <line x1="235" y1="228" x2="235" y2="180" stroke="#94a3b8" stroke-width="3"/>
    <text x="235" y="176" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">1.5</text>
    <text x="235" y="186" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#64748b">MHz</text>
    <text x="213" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#64748b">1.5MHz</text>
  </g>

  <!-- Panel C: two lines at 1MHz and 2MHz -->
  <g id="freq-c">
    <rect x="297" y="142" width="128" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="307" y="155" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">C</text>
    <line x1="312" y1="228" x2="418" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="312" y1="155" x2="312" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="420" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Spike at 1MHz -->
    <line x1="345" y1="228" x2="345" y2="180" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="345" y="176" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">1MHz</text>
    <!-- Spike at 2MHz -->
    <line x1="390" y1="228" x2="390" y2="193" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="390" y="189" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">2MHz</text>
    <text x="361" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#64748b">1+2MHz</text>
  </g>

  <!-- Panel D (CORRECT): single line at 1MHz -->
  <g id="freq-d">
    <rect x="438" y="142" width="147" height="110" rx="4" fill="#0f1629" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="448" y="155" font-family="IBM Plex Mono" font-size="11" fill="#06b6d4" font-weight="bold">D</text>
    <line x1="453" y1="228" x2="578" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="453" y1="155" x2="453" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="580" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Single spike at 1MHz -->
    <line x1="510" y1="228" x2="510" y2="168" stroke="#06b6d4" stroke-width="3.5"/>
    <text x="510" y="163" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">1MHz</text>
    <text x="511" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4">1MHz ✓</text>
  </g>

  <!-- Caption -->
  <text x="300" y="285" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="#64748b">Full 3M (D2F-M2-Q37) — Waveform: 1.5 cycles in 1.5µs → frequency domain</text>
</svg>
