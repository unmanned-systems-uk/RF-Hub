<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- TOP HALF: Time domain — fundamental + 2nd harmonic -->
  <rect x="15" y="10" width="570" height="120" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
  <text x="300" y="24" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">Time domain: fundamental (cyan) + 2nd harmonic (amber)</text>

  <!-- Time domain axes -->
  <line x1="40" y1="75" x2="575" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40" y1="25" x2="40" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="573,71 575,75 573,79" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <polyline points="36,27 40,25 44,27" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="580" y="79" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">t</text>
  <text x="33" y="23" font-family="IBM Plex Mono" font-size="9" fill="#94a3b8">V</text>

  <!-- Fundamental: 2 cycles, period=230px, amplitude=35px, centre y=75 -->
  <!-- x starts at 50, period=230, so 2 cycles ends at 510 -->
  <polyline fill="none" stroke="#06b6d4" stroke-width="2.5"
    points="
      50,75
      56,57 62,42 68,32 74,28 80,32 86,42 92,57 98,75
      104,93 110,108 116,118 122,122 128,118 134,108 140,93 146,75
      152,57 158,42 164,32 170,28 176,32 182,42 188,57 194,75
      200,93 206,108 212,118 218,122 224,118 230,108 236,93 242,75
      248,57 254,42 260,32 266,28 272,32 278,42 284,57 290,75
      296,93 302,108 308,118 314,122 320,118 326,108 332,93 338,75
      344,57 350,42 356,32 362,28 368,32 374,42 380,57 386,75
      392,93 398,108 404,118 410,122 416,118 422,108 428,93 434,75
      440,57 446,42 452,32 458,28 464,32 470,42 476,57 482,75
      488,93 494,108 500,118 506,122 510,118
    "/>

  <!-- 2nd harmonic: same range, period=115px, amplitude=18px -->
  <polyline fill="none" stroke="#f59e0b" stroke-width="1.5"
    points="
      50,75
      54,66 58,58 62,53 66,51 70,53 74,58 78,66 82,75
      86,84 90,92 94,97 98,99 102,97 106,92 110,84 114,75
      118,66 122,58 126,53 130,51 134,53 138,58 142,66 146,75
      150,84 154,92 158,97 162,99 166,97 170,92 174,84 178,75
      182,66 186,58 190,53 194,51 198,53 202,58 206,66 210,75
      214,84 218,92 222,97 226,99 230,97 234,92 238,84 242,75
      246,66 250,58 254,53 258,51 262,53 266,58 270,66 274,75
      278,84 282,92 286,97 290,99 294,97 298,92 302,84 306,75
      310,66 314,58 318,53 322,51 326,53 330,58 334,66 338,75
      342,84 346,92 350,97 354,99 358,97 362,92 366,84 370,75
      374,66 378,58 382,53 386,51 390,53 394,58 398,66 402,75
      406,84 410,92 414,97 418,99 422,97 426,92 430,84 434,75
      438,66 442,58 446,53 450,51 454,53 458,58 462,66 466,75
      470,84 474,92 478,97 482,99 486,97 490,92 494,84 498,75
      502,66 506,58 510,53
    "/>

  <!-- Legend -->
  <line x1="520" y1="45" x2="545" y2="45" stroke="#06b6d4" stroke-width="2"/>
  <text x="550" y="49" font-family="IBM Plex Mono" font-size="9" fill="#06b6d4">f (fund.)</text>
  <line x1="520" y1="62" x2="545" y2="62" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="66" font-family="IBM Plex Mono" font-size="9" fill="#f59e0b">2f (harm.)</text>

  <!-- BOTTOM HALF: 4 frequency domain panels in 2×2 grid -->
  <!-- Panel A (correct): two lines at f and 2f -->
  <g id="freq-a">
    <rect x="15" y="142" width="130" height="110" rx="4" fill="#0f1629" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="25" y="155" font-family="IBM Plex Mono" font-size="11" fill="#06b6d4" font-weight="bold">A</text>
    <!-- Axes -->
    <line x1="30" y1="228" x2="138" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="30" y1="155" x2="30" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="140" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Spike at f -->
    <line x1="65" y1="228" x2="65" y2="175" stroke="#06b6d4" stroke-width="3"/>
    <text x="65" y="171" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4">f</text>
    <!-- Spike at 2f -->
    <line x1="100" y1="228" x2="100" y2="193" stroke="#06b6d4" stroke-width="3"/>
    <text x="100" y="189" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#06b6d4">2f</text>
    <text x="72" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#06b6d4">two lines ✓</text>
  </g>

  <!-- Panel B: single line at f only -->
  <g id="freq-b">
    <rect x="158" y="142" width="130" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="168" y="155" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">B</text>
    <!-- Axes -->
    <line x1="173" y1="228" x2="281" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="173" y1="155" x2="173" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="283" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Single spike at f only -->
    <line x1="208" y1="228" x2="208" y2="175" stroke="#94a3b8" stroke-width="3"/>
    <text x="208" y="171" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <text x="220" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#64748b">single line</text>
  </g>

  <!-- Panel C: three lines at f, 2f, 3f -->
  <g id="freq-c">
    <rect x="301" y="142" width="130" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="311" y="155" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">C</text>
    <!-- Axes -->
    <line x1="316" y1="228" x2="424" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="316" y1="155" x2="316" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="426" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Three equal height spikes at f, 2f, 3f -->
    <line x1="340" y1="228" x2="340" y2="182" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="340" y="178" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">f</text>
    <line x1="365" y1="228" x2="365" y2="182" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="365" y="178" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">2f</text>
    <line x1="390" y1="228" x2="390" y2="182" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="390" y="178" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">3f</text>
    <text x="363" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#64748b">three lines</text>
  </g>

  <!-- Panel D: broad noise hump -->
  <g id="freq-d">
    <rect x="444" y="142" width="130" height="110" rx="4" fill="#0f1629" stroke="#1e293b" stroke-width="1"/>
    <text x="454" y="155" font-family="IBM Plex Mono" font-size="11" fill="#94a3b8" font-weight="bold">D</text>
    <!-- Axes -->
    <line x1="459" y1="228" x2="567" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <line x1="459" y1="155" x2="459" y2="232" stroke="#94a3b8" stroke-width="1"/>
    <text x="569" y="232" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">f</text>
    <!-- Broad noise hump using polyline -->
    <polyline fill="none" stroke="#94a3b8" stroke-width="1.5"
      points="
        462,228 468,227 472,225 476,222 480,217 484,212 488,206 492,200
        496,196 500,193 504,192 508,193 512,196 516,200 520,206
        524,212 528,218 532,222 536,225 540,227 544,228 566,228
      "/>
    <!-- Fill suggestion with opacity -->
    <polyline fill="#94a3b8" fill-opacity="0.08" stroke="none"
      points="
        462,228 468,227 472,225 476,222 480,217 484,212 488,206 492,200
        496,196 500,193 504,192 508,193 512,196 516,200 520,206
        524,212 528,218 532,222 536,225 540,227 544,228
      "/>
    <text x="505" y="244" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" fill="#64748b">noise hump</text>
  </g>

  <!-- Caption -->
  <text x="300" y="285" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="#64748b">Full 3M (D2F-M1-Q38) — Time domain to frequency domain: fundamental + harmonic</text>
</svg>
