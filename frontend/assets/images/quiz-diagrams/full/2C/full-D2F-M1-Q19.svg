<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title / question hint -->
  <text x="300" y="18" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Transistor bias network — calculate circuit input resistance</text>

  <!-- ===== SUPPLY RAIL ===== -->
  <!-- VCC label -->
  <text x="300" y="38" font-family="IBM Plex Mono" font-size="11" fill="#e2e8f0" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">CC</tspan></text>
  <!-- VCC horizontal bus -->
  <line x1="180" y1="42" x2="420" y2="42" stroke="#94a3b8" stroke-width="2"/>

  <!-- ===== R1 : 100kΩ from VCC to base node ===== -->
  <!-- wire VCC down to R1 top -->
  <line x1="260" y1="42" x2="260" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <!-- IEC rectangle resistor -->
  <rect x="243" y="68" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="78" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">100k</text>
  <!-- wire R1 bottom to base node -->
  <line x1="260" y1="82" x2="260" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- R1 label -->
  <text x="225" y="77" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="end">R1</text>

  <!-- ===== R2 : 100kΩ from base node to GND ===== -->
  <!-- wire base node down to R2 top -->
  <line x1="260" y1="130" x2="260" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <!-- IEC rectangle resistor -->
  <rect x="243" y="145" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="155" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">100k</text>
  <!-- wire R2 bottom to GND -->
  <line x1="260" y1="159" x2="260" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="248" y1="210" x2="272" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="252" y1="214" x2="268" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="256" y1="218" x2="264" y2="218" stroke="#94a3b8" stroke-width="1"/>
  <!-- R2 label -->
  <text x="225" y="154" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="end">R2</text>

  <!-- ===== INPUT label at base node ===== -->
  <!-- "in" arrow from left -->
  <line x1="190" y1="130" x2="260" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="258,126 266,130 258,134" fill="#94a3b8"/>
  <text x="155" y="134" font-family="IBM Plex Mono" font-size="10" fill="#38bdf8" text-anchor="middle">in</text>
  <!-- input node dot -->
  <circle cx="260" cy="130" r="3" fill="#94a3b8"/>

  <!-- ===== NPN TRANSISTOR ===== -->
  <!-- Circle body centred at (340,130) r=28 -->
  <circle cx="340" cy="130" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base line horizontal into circle -->
  <line x1="260" y1="130" x2="312" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base junction vertical -->
  <line x1="312" y1="112" x2="312" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <!-- Collector line (top-right) -->
  <line x1="312" y1="112" x2="340" y2="95" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="95" x2="340" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter line (bottom-right) with arrow -->
  <line x1="312" y1="148" x2="340" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter arrow (NPN: pointing away from base) -->
  <polygon points="335,162 344,168 338,172" fill="#94a3b8"/>
  <line x1="340" y1="165" x2="340" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- Transistor label -->
  <text x="375" y="134" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">NPN</text>

  <!-- ===== R_C : 4.7kΩ from VCC to collector ===== -->
  <!-- wire VCC to RC top -->
  <line x1="340" y1="42" x2="340" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <!-- IEC rectangle -->
  <rect x="323" y="55" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="65" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">4k7</text>
  <!-- wire RC bottom to collector -->
  <line x1="340" y1="69" x2="340" y2="95" stroke="#94a3b8" stroke-width="2"/>
  <!-- RC label -->
  <text x="382" y="64" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">R<tspan baseline-shift="sub" font-size="70%">C</tspan></text>

  <!-- ===== R_E : 1kΩ from emitter to GND ===== -->
  <!-- IEC rectangle -->
  <rect x="323" y="175" width="34" height="14" rx="0" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="185" font-family="IBM Plex Mono" font-size="9" fill="#e2e8f0" text-anchor="middle">1k0</text>
  <!-- wire emitter to RE top -->
  <line x1="340" y1="169" x2="340" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- wire RE bottom to GND -->
  <line x1="340" y1="189" x2="340" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol emitter -->
  <line x1="328" y1="210" x2="352" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="332" y1="214" x2="348" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="336" y1="218" x2="344" y2="218" stroke="#94a3b8" stroke-width="1"/>
  <!-- RE label -->
  <text x="382" y="185" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">R<tspan baseline-shift="sub" font-size="70%">E</tspan></text>

  <!-- ===== Rin_transistor annotation ===== -->
  <text x="430" y="128" font-family="IBM Plex Mono" font-size="9" fill="#fbbf24">R<tspan baseline-shift="sub" font-size="70%">in</tspan>(transistor)</text>
  <text x="430" y="140" font-family="IBM Plex Mono" font-size="9" fill="#fbbf24">= 50 kΩ</text>

  <!-- ===== ANSWER OPTIONS PANEL ===== -->
  <rect x="10" y="232" width="580" height="38" rx="4" fill="#0d1321" stroke="#1e293b" stroke-width="1"/>
  <!-- A - correct -->
  <rect x="18" y="238" width="130" height="26" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="83" y="255" font-family="IBM Plex Mono" font-size="10" fill="#22c55e" text-anchor="middle">A  25 kΩ ✓</text>
  <!-- B -->
  <rect x="158" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="223" y="255" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" text-anchor="middle">B  50 kΩ</text>
  <!-- C -->
  <rect x="298" y="238" width="130" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="363" y="255" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" text-anchor="middle">C  100 kΩ</text>
  <!-- D -->
  <rect x="438" y="238" width="150" height="26" rx="3" fill="#0d1321" stroke="#334155" stroke-width="1"/>
  <text x="513" y="255" font-family="IBM Plex Mono" font-size="10" fill="#94a3b8" text-anchor="middle">D  12.5 kΩ</text>

  <!-- ===== CAPTION ===== -->
  <text x="300" y="284" font-family="IBM Plex Sans" font-size="10" fill="#64748b" text-anchor="middle">Full 2C (D2F-M1-Q19) — Transistor bias: calculate circuit input resistance</text>
</svg>
