<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" rx="8" fill="#0a0e1a"/>

  <!-- Title -->
  <text x="300" y="18" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0" text-anchor="middle">Relay switching transistor — which circuit protects against inductive spikes?</text>

  <!-- Helper: draw NPN + relay in each panel -->
  <!-- ═══ PANEL A — No protection (top-left) ═══ -->
  <rect x="10" y="25" width="280" height="115" rx="4" fill="#0d1321" stroke="#94a3b8" stroke-width="1"/>
  <text x="20" y="40" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">A</text>
  <!-- Transistor -->
  <circle cx="170" cy="82" r="16" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base -->
  <line x1="105" y1="82" x2="154" y2="82" stroke="#94a3b8" stroke-width="2"/>
  <line x1="154" y1="70" x2="154" y2="94" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="80" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">PULSE</text>
  <!-- Collector up -->
  <line x1="162" y1="68" x2="162" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <!-- Relay coil from Vcc to collector -->
  <line x1="162" y1="42" x2="200" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <!-- Relay coil (inductor) symbol -->
  <path d="M 200,42 Q 207,30 214,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 214,42 Q 221,30 228,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 228,42 Q 235,30 242,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="242" y1="42" x2="260" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="42" x2="260" y2="32" stroke="#94a3b8" stroke-width="2"/>
  <text x="258" y="30" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">V+</text>
  <!-- Emitter down to GND -->
  <line x1="162" y1="98" x2="162" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="162,98 157,88 167,88" fill="#94a3b8"/>
  <line x1="154" y1="118" x2="170" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="157" y1="122" x2="167" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="126" x2="164" y2="126" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="120" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">No protection</text>
  <text x="180" y="130" font-family="IBM Plex Mono" font-size="7" fill="#64748b">⚠ Spike risk</text>

  <!-- ═══ PANEL B — Flyback diode CORRECT (top-right) ═══ -->
  <rect x="310" y="25" width="280" height="115" rx="4" fill="#0d1321" stroke="#06b6d4" stroke-width="2"/>
  <text x="320" y="40" font-family="IBM Plex Mono" font-size="10" fill="#06b6d4">B ✓</text>
  <!-- Transistor -->
  <circle cx="465" cy="82" r="16" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base -->
  <line x1="400" y1="82" x2="449" y2="82" stroke="#94a3b8" stroke-width="2"/>
  <line x1="449" y1="70" x2="449" y2="94" stroke="#94a3b8" stroke-width="2"/>
  <text x="375" y="80" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">PULSE</text>
  <!-- Collector up -->
  <line x1="457" y1="68" x2="457" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <!-- Relay coil -->
  <line x1="457" y1="42" x2="490" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 490,42 Q 497,30 504,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 504,42 Q 511,30 518,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 518,42 Q 525,30 532,42" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="532" y1="42" x2="555" y2="42" stroke="#94a3b8" stroke-width="2"/>
  <line x1="555" y1="42" x2="555" y2="32" stroke="#94a3b8" stroke-width="2"/>
  <text x="550" y="30" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">V+</text>
  <!-- FLYBACK DIODE: reverse across coil (cathode to V+, anode to collector) -->
  <!-- Diode from collector rail (x=457,y=42) to Vcc (x=555,y=42), drawn above coil -->
  <line x1="457" y1="55" x2="495" y2="55" stroke="#06b6d4" stroke-width="2"/>
  <!-- Diode symbol pointing right (cathode right = towards V+) -->
  <polygon points="495,50 507,55 495,60" fill="#06b6d4"/>
  <line x1="507" y1="50" x2="507" y2="60" stroke="#06b6d4" stroke-width="2"/>
  <line x1="507" y1="55" x2="555" y2="55" stroke="#06b6d4" stroke-width="2"/>
  <line x1="457" y1="42" x2="457" y2="55" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="555" y1="42" x2="555" y2="55" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="478" y="70" font-family="IBM Plex Mono" font-size="7" fill="#06b6d4">Flyback D</text>
  <!-- Emitter to GND -->
  <line x1="457" y1="98" x2="457" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="457,98 452,88 462,88" fill="#94a3b8"/>
  <line x1="449" y1="118" x2="465" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="452" y1="122" x2="462" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="455" y1="126" x2="459" y2="126" stroke="#94a3b8" stroke-width="1"/>
  <text x="468" y="130" font-family="IBM Plex Mono" font-size="7" fill="#06b6d4">✓ Spike suppressed</text>

  <!-- ═══ PANEL C — Capacitor across coil (bottom-left) ═══ -->
  <rect x="10" y="150" width="280" height="115" rx="4" fill="#0d1321" stroke="#94a3b8" stroke-width="1"/>
  <text x="20" y="165" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">C</text>
  <!-- Transistor -->
  <circle cx="170" cy="207" r="16" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="105" y1="207" x2="154" y2="207" stroke="#94a3b8" stroke-width="2"/>
  <line x1="154" y1="195" x2="154" y2="219" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="205" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">PULSE</text>
  <line x1="162" y1="193" x2="162" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <!-- Relay coil -->
  <line x1="162" y1="167" x2="190" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 190,167 Q 197,155 204,167" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 204,167 Q 211,155 218,167" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 218,167 Q 225,155 232,167" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="232" y1="167" x2="260" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="167" x2="260" y2="157" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="155" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">V+</text>
  <!-- Capacitor across coil -->
  <line x1="210" y1="167" x2="210" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <line x1="202" y1="178" x2="218" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <line x1="202" y1="184" x2="218" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="184" x2="210" y2="193" stroke="#94a3b8" stroke-width="2"/>
  <line x1="162" y1="193" x2="210" y2="193" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="222" y="183" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">C</text>
  <line x1="162" y1="223" x2="162" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="162,223 157,213 167,213" fill="#94a3b8"/>
  <line x1="154" y1="255" x2="170" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="157" y1="259" x2="167" y2="259" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="255" font-family="IBM Plex Mono" font-size="7" fill="#64748b">Cap only (poor)</text>

  <!-- ═══ PANEL D — Resistor across coil (bottom-right) ═══ -->
  <rect x="310" y="150" width="280" height="115" rx="4" fill="#0d1321" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="165" font-family="IBM Plex Mono" font-size="10" fill="#e2e8f0">D</text>
  <!-- Transistor -->
  <circle cx="465" cy="207" r="16" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="207" x2="449" y2="207" stroke="#94a3b8" stroke-width="2"/>
  <line x1="449" y1="195" x2="449" y2="219" stroke="#94a3b8" stroke-width="2"/>
  <text x="375" y="205" font-family="IBM Plex Mono" font-size="8" fill="#94a3b8">PULSE</text>
  <line x1="457" y1="193" x2="457" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <!-- Relay coil -->
  <line x1="457" y1="167" x2="480" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 480,167 Q 487,155 494,167" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 494,167 Q 501,155 508,167" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 508,167 Q 515,155 522,167" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="522" y1="167" x2="555" y2="167" stroke="#94a3b8" stroke-width="2"/>
  <line x1="555" y1="167" x2="555" y2="157" stroke="#94a3b8" stroke-width="2"/>
  <text x="550" y="155" font-family="IBM Plex Mono" font-size="7" fill="#94a3b8">V+</text>
  <!-- IEC Resistor across coil -->
  <line x1="505" y1="167" x2="505" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <rect x="498" y="178" width="14" height="20" rx="1" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="505" y="192" font-family="IBM Plex Mono" font-size="7" fill="#e2e8f0" text-anchor="middle">R</text>
  <line x1="505" y1="198" x2="505" y2="207" stroke="#94a3b8" stroke-width="2"/>
  <line x1="457" y1="207" x2="505" y2="207" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="457" y1="223" x2="457" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="457,223 452,213 462,213" fill="#94a3b8"/>
  <line x1="449" y1="255" x2="465" y2="255" stroke="#94a3b8" stroke-width="2"/>
  <line x1="452" y1="259" x2="462" y2="259" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="468" y="255" font-family="IBM Plex Mono" font-size="7" fill="#64748b">Resistor only (poor)</text>

  <!-- Caption -->
  <text x="300" y="292" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Full 2C (D2F-M2-Q19) — Relay switching: which circuit protects against inductive voltage spikes?</text>
</svg>
