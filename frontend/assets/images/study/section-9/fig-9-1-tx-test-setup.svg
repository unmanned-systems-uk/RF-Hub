<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- TX test setup: TX → [SWR meter] → [Dummy load]
                               │
                       [Dir. coupler] → [Spectrum analyser] -->

  <!-- === Top row === -->

  <!-- TX block -->
  <rect x="30" y="48" width="80" height="40" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="70" y="65" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">TX</text>
  <text x="70" y="79" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">transmitter</text>
  <line x1="110" y1="68" x2="128" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="125,64 125,72 132,68" fill="#94a3b8"/>

  <!-- SWR Meter block -->
  <rect x="132" y="48" width="100" height="40" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="182" y="65" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">SWR Meter</text>
  <text x="182" y="79" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">fwd + rev power</text>
  <line x1="232" y1="68" x2="250" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="247,64 247,72 254,68" fill="#94a3b8"/>

  <!-- Dummy Load block -->
  <rect x="254" y="48" width="100" height="40" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="304" y="65" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Dummy Load</text>
  <text x="304" y="79" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">50Ω non-radiating</text>

  <!-- Vertical branch: down from SWR Meter center to Dir. Coupler -->
  <line x1="182" y1="88" x2="182" y2="162" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="178,159 186,159 182,165" fill="#94a3b8"/>

  <!-- === Bottom row === -->

  <!-- Directional Coupler block -->
  <rect x="117" y="165" width="130" height="40" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="182" y="182" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Dir. Coupler</text>
  <text x="182" y="195" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">samples RF signal</text>
  <line x1="247" y1="185" x2="265" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="262,181 262,189 269,185" fill="#94a3b8"/>

  <!-- Spectrum Analyser block -->
  <rect x="269" y="165" width="140" height="40" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="339" y="181" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Spectrum Analyser</text>
  <text x="339" y="193" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">or power meter</text>

  <!-- Purpose annotation -->
  <text x="300" y="228" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Used to check TX output power, harmonics,</text>
  <text x="300" y="242" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">spurious emissions, and SWR simultaneously.</text>

  <!-- Caption -->
  <text x="300" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 9-1 — TX test setup: dummy load absorbs power; coupler routes sample to spectrum analyser</text>
</svg>
