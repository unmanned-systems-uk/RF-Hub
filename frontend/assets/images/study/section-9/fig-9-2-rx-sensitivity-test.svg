<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <rect width="600" height="180" fill="#0a0e1a" rx="8"/>

  <!-- Receiver sensitivity test setup: RF Sig Gen → Attenuator(s) → RX Antenna Input -->

  <!-- RF Signal Generator block -->
  <rect x="60" y="58" width="120" height="42" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="120" y="76" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">RF Sig Gen</text>
  <text x="120" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">calibrated output</text>
  <line x1="180" y1="79" x2="200" y2="79" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="197,75 197,83 204,79" fill="#94a3b8"/>

  <!-- Attenuator(s) block -->
  <rect x="204" y="58" width="110" height="42" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="259" y="76" font-family="IBM Plex Mono, monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">Attenuator(s)</text>
  <text x="259" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">known reduction (dB)</text>
  <line x1="314" y1="79" x2="334" y2="79" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="331,75 331,83 338,79" fill="#94a3b8"/>

  <!-- Receiver Antenna Input block -->
  <rect x="338" y="58" width="130" height="42" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="403" y="74" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">RX Input</text>
  <text x="403" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">antenna port</text>
  <text x="403" y="95" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">(receiver under test)</text>

  <!-- Level label -->
  <text x="120" y="115" font-family="IBM Plex Mono, monospace" font-size="8" fill="#f59e0b" text-anchor="middle">P_out</text>
  <text x="259" y="115" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">P_out − loss</text>
  <text x="403" y="115" font-family="IBM Plex Mono, monospace" font-size="8" fill="#06b6d4" text-anchor="middle">known signal level</text>

  <!-- Caption -->
  <text x="300" y="165" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 9-2 — Receiver sensitivity test: attenuator(s) set a known low signal level at the RX input</text>
</svg>
