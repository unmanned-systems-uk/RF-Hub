<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" style="font-family:'IBM Plex Mono',monospace;">
  <defs>
    <style>
      text { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .label { font-size: 12px; fill: #e2e8f0; }
      .caption { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 13px; fill: #64748b; }
      .caption-em { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 13px; fill: #06b6d4; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Top rail segments -->
  <!-- Battery+ → R1 left -->
  <line x1="60" y1="100" x2="140" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- R1 right → ammeter left gap (break before ammeter) -->
  <line x1="200" y1="100" x2="255" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- Ammeter right gap → R2 left -->
  <line x1="305" y1="100" x2="380" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- R2 right → right top -->
  <line x1="440" y1="100" x2="540" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- Bottom rail -->
  <line x1="60" y1="200" x2="540" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- Left vertical (battery) -->
  <line x1="60" y1="100" x2="60" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60" y1="178" x2="60" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- Right vertical -->
  <line x1="540" y1="100" x2="540" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- Battery symbol at x=60, y=148–178 -->
  <line x1="42" y1="150" x2="78" y2="150" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="50" y1="159" x2="70" y2="159" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="42" y1="167" x2="78" y2="167" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="50" y1="175" x2="70" y2="175" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="84" y="166" class="label">Vb</text>

  <!-- R1 at x=140–200 -->
  <rect x="140" y="88" width="60" height="24" rx="3" fill="#0d1321" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="162" y="104" class="label">R1</text>

  <!-- Break marks on wire before and after ammeter -->
  <!-- Left break slash -->
  <line x1="250" y1="94" x2="258" y2="106" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Right break slash -->
  <line x1="302" y1="94" x2="310" y2="106" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Ammeter circle centred at x=280, y=100 — CYAN highlighted -->
  <circle cx="280" cy="100" r="21" fill="#0d1321" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="274" y="105" class="label" fill="#06b6d4">A</text>

  <!-- R2 at x=380–440 -->
  <rect x="380" y="88" width="60" height="24" rx="3" fill="#0d1321" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="402" y="104" class="label">R2</text>

  <!-- Break callout arrow pointing to the ammeter from below -->
  <line x1="280" y1="135" x2="280" y2="148" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="280,121 275,132 285,132" fill="#06b6d4"/>
  <text x="290" y="162" class="label" font-size="11" fill="#64748b">circuit broken here</text>

  <!-- Current direction arrow along top rail -->
  <polygon points="360,96 348,100 360,104" fill="#94a3b8"/>
  <text x="325" y="94" class="label" font-size="10" fill="#64748b">I →</text>

  <!-- Caption -->
  <text x="300" y="230" text-anchor="middle">
    <tspan class="caption">Ammeter (</tspan><tspan class="caption-em">A</tspan><tspan class="caption">) inserted </tspan><tspan class="caption-em">IN SERIES</tspan><tspan class="caption"> — circuit broken, meter inserted</tspan>
  </text>
  <text x="300" y="248" text-anchor="middle" class="caption">Near-zero internal resistance — ammeter acts as a wire in the current path</text>
</svg>
