<text x="390.0" y="290" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 7.6 — PLL synthesiser: crystal accuracy + VCO agility. f_out = f_crystal × N/A; step size = reference frequency</text>
