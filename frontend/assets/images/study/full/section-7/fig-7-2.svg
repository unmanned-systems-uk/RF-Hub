<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Simple FM VHF transmitter block diagram">
<rect width="800" height="260" fill="#0a0e1a" rx="8"/>
<rect x="20" y="100" width="80" height="42" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
<text x="60.0" y="125.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Mic</text>
<line x1="100" y1="121" x2="120" y2="121" stroke="#94a3b8" stroke-width="2"/>
<polygon points="118,117 118,125 126,121" fill="#94a3b8"/>
<rect x="126" y="100" width="90" height="42" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
<text x="171.0" y="119.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Audio</text>
<text x="171.0" y="131.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Amp</text>
<line x1="216" y1="121" x2="240" y2="121" stroke="#94a3b8" stroke-width="2"/>
<polygon points="238,117 238,125 246,121" fill="#94a3b8"/>
<rect x="246" y="90" width="100" height="60" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
<text x="296.0" y="118.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Oscillator</text>
<text x="296.0" y="130.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">8 MHz</text>
<text x="296.0" y="144" font-family="IBM Plex Sans, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">FM/PM injected here</text>
<line x1="296" y1="100" x2="296" y2="60" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,3"/><text x="296" y="52" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle">modulation injected</text>
<line x1="346" y1="121" x2="366" y2="121" stroke="#94a3b8" stroke-width="2"/>
<polygon points="364,117 364,125 372,121" fill="#94a3b8"/>
<rect x="372" y="100" width="90" height="42" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
<text x="417.0" y="119.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Buffer</text>
<text x="417.0" y="131.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Amp</text>
<line x1="462" y1="121" x2="482" y2="121" stroke="#94a3b8" stroke-width="2"/>
<polygon points="480,117 480,125 488,121" fill="#94a3b8"/>
<rect x="488" y="90" width="130" height="60" fill="#0d1321" stroke="#22c55e" stroke-width="1.5" rx="4"/>
<text x="553.0" y="118.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">×3 ×3 ×2</text>
<text x="553.0" y="130.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">Multiplier chain</text>
<text x="553.0" y="144" font-family="IBM Plex Sans, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">8 MHz × 18 = 144 MHz</text>
<line x1="618" y1="121" x2="638" y2="121" stroke="#94a3b8" stroke-width="2"/>
<polygon points="636,117 636,125 644,121" fill="#94a3b8"/>
<rect x="644" y="100" width="70" height="42" fill="#0d1321" stroke="#22c55e" stroke-width="1.5" rx="4"/>
<text x="679.0" y="119.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">Filter</text>
<text x="679.0" y="131.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">&amp; Driver</text>
<line x1="714" y1="121" x2="734" y2="121" stroke="#94a3b8" stroke-width="2"/>
<polygon points="732,117 732,125 740,121" fill="#94a3b8"/>
<rect x="740" y="100" width="50" height="42" fill="#0d1321" stroke="#22c55e" stroke-width="1.5" rx="4"/>
<text x="765.0" y="125.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">PA</text>
<line x1="790" y1="121" x2="800" y2="121" stroke="#94a3b8" stroke-width="1.8"/><text x="400.0" y="250" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 7.2 — Simple FM VHF transmitter using a multiplier chain: low-frequency oscillator ×18 = 144 MHz; deviation is also multiplied</text>
</svg>
