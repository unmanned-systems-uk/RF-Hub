<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-label="CW keying envelope waveforms">
<rect width="780" height="380" fill="#0a0e1a" rx="8"/>
<text x="20" y="66" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="start">Key</text>
<text x="20" y="78" font-family="IBM Plex Mono, monospace" font-size="9" fill="#64748b" text-anchor="start">up/down</text>
<line x1="60" y1="80" x2="740" y2="80" stroke="#1e293b" stroke-width="1"/>
<path d="M 60,80 L 60,54 L 220,54 L 220,80 L 340,80 L 340,54 L 520,54 L 520,80 L 640,80 L 640,54 L 740,54" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="160" y="46" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">key down (dash)</text>
<text x="20" y="176" font-family="IBM Plex Mono, monospace" font-size="10" fill="#ef4444" text-anchor="start">Fast rise</text>
<text x="20" y="188" font-family="IBM Plex Mono, monospace" font-size="9" fill="#ef4444" text-anchor="start">→ clicks</text>
<line x1="60" y1="190" x2="740" y2="190" stroke="#1e293b" stroke-width="1"/>
<path d="M 60,190 L 60,190 L 62,158 L 218,158 L 220,190 L 220,190 L 340,190 L 340,190 L 342,158 L 518,158 L 520,190 L 520,190 L 640,190 L 640,190 L 642,158 L 738,158 L 740,190" stroke="#ef4444" stroke-width="2" fill="none"/>
<text x="400" y="220" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">abrupt edges — wide spectral spread, audible key clicks</text>
<text x="20" y="306" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="start">Shaped rise</text>
<text x="20" y="318" font-family="IBM Plex Mono, monospace" font-size="9" fill="#22c55e" text-anchor="start">→ clean</text>
<line x1="60" y1="320" x2="740" y2="320" stroke="#1e293b" stroke-width="1"/>
<path d="M 60,320 L 60.0,320.0 L 66.7,316.3 L 73.3,306.8 L 80.0,296.0 L 86.7,289.0 L 93.3,288.0 L 100.0,288.0 L 106.7,288.0 L 113.3,288.0 L 120.0,288.0 L 126.7,288.0 L 133.3,288.0 L 140.0,288.0 L 146.7,288.0 L 153.3,288.0 L 160.0,288.0 L 166.7,288.0 L 173.3,288.0 L 180.0,288.0 L 186.7,288.0 L 193.3,289.0 L 200.0,296.0 L 206.7,306.8 L 213.3,316.3 L 220.0,320.0 L 220,320 L 340,320 L 340.0,320.0 L 347.5,315.3 L 355.0,304.0 L 362.5,292.7 L 370.0,288.0 L 377.5,288.0 L 385.0,288.0 L 392.5,288.0 L 400.0,288.0 L 407.5,288.0 L 415.0,288.0 L 422.5,288.0 L 430.0,288.0 L 437.5,288.0 L 445.0,288.0 L 452.5,288.0 L 460.0,288.0 L 467.5,288.0 L 475.0,288.0 L 482.5,288.0 L 490.0,288.0 L 497.5,292.7 L 505.0,304.0 L 512.5,315.3 L 520.0,320.0 L 520,320 L 640,320 L 640.0,320.0 L 644.2,318.5 L 648.3,314.3 L 652.5,308.1 L 656.7,301.2 L 660.8,294.8 L 665.0,290.1 L 669.2,288.1 L 673.3,288.0 L 677.5,288.0 L 681.7,288.0 L 685.8,288.0 L 690.0,288.0 L 694.2,288.0 L 698.3,288.0 L 702.5,288.0 L 706.7,288.0 L 710.8,288.1 L 715.0,290.1 L 719.2,294.8 L 723.3,301.2 L 727.5,308.1 L 731.7,314.3 L 735.8,318.5 L 740.0,320.0" stroke="#22c55e" stroke-width="2" fill="none"/>
<text x="400" y="350" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">rounded edges — narrow bandwidth, no key clicks</text>
<text x="390.0" y="370" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 7.15 &#8212; CW keying: fast rise (top) causes key clicks; shaped slow rise (bottom) gives a clean, narrow-bandwidth signal</text>
</svg>
