<text x="226.0" y="121.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Control Register</text>
<text x="226.0" y="126" font-family="IBM Plex Sans, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">sets step size</text>
<line x1="296" y1="111" x2="316" y2="111" stroke="#94a3b8" stroke-width="2"/>
<polygon points="314,107 314,115 322,111" fill="#94a3b8"/>
