<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="DDS block diagram">
<rect width="780" height="240" fill="#0a0e1a" rx="8"/>
<rect x="20" y="90" width="110" height="42" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
<text x="75.0" y="115.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Clock</text>
<line x1="130" y1="111" x2="150" y2="111" stroke="#94a3b8" stroke-width="2"/>
