<text x="523.0" y="115.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">DAC</text>
<line x1="558" y1="111" x2="578" y2="111" stroke="#94a3b8" stroke-width="2"/>
<polygon points="576,107 576,115 584,111" fill="#94a3b8"/>
<rect x="584" y="90" width="130" height="42" fill="#0d1321" stroke="#22c55e" stroke-width="1.5" rx="4"/>
<text x="649.0" y="109.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">Low-pass</text>
<text x="649.0" y="121.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#22c55e" text-anchor="middle">Output Filter</text>
<text x="649.0" y="126" font-family="IBM Plex Sans, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">removes staircase steps</text>
<line x1="714" y1="111" x2="734" y2="111" stroke="#94a3b8" stroke-width="2"/>
<polygon points="732,107 732,115 740,111" fill="#94a3b8"/>
<text x="755" y="111" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">sine</text>
<text x="390.0" y="230" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 7.8 — DDS block diagram. The step-size register controls output frequency: f_out = (step × clock) / table length</text>
</svg>
