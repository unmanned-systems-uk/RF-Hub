<text x="392.0" y="109.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Sinewave</text>
<text x="392.0" y="121.0" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Look-Up Table</text>
<text x="392.0" y="126" font-family="IBM Plex Sans, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">one cycle, digital</text>
<line x1="462" y1="111" x2="482" y2="111" stroke="#94a3b8" stroke-width="2"/>
<polygon points="480,107 480,115 488,111" fill="#94a3b8"/>
