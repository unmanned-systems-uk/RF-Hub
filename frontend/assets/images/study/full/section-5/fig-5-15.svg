<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Simple transistor bias: R_B from V_CC to base, R_C as collector load -->
  <!-- V_CC at top, GND at bottom -->

  <!-- V_CC supply rail -->
  <line x1="300" y1="20" x2="300" y2="40" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="16" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+V_CC</text>

  <!-- R_C from V_CC to collector -->
  <line x1="300" y1="40" x2="300" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="60" width="24" height="44" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="340" y="85" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">R_C</text>
  <line x1="300" y1="104" x2="300" y2="120" stroke="#94a3b8" stroke-width="2"/>

  <!-- Transistor NPN symbol, centred at (300, 155), circle r=28 -->
  <circle cx="300" cy="155" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base junction line (vertical) -->
  <line x1="285" y1="128" x2="285" y2="182" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Collector diagonal (upper right) -->
  <line x1="285" y1="133" x2="308" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <!-- Line from body to R_C wire -->
  <line x1="308" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter diagonal with arrow (NPN) -->
  <line x1="285" y1="177" x2="308" y2="190" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="304,192 308,182 316,194" fill="#94a3b8"/>
  <!-- Emitter to GND -->
  <line x1="308" y1="190" x2="308" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="220" x2="308" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="220" x2="300" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="282" y1="240" x2="318" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <line x1="288" y1="246" x2="312" y2="246" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="294" y1="252" x2="306" y2="252" stroke="#94a3b8" stroke-width="1"/>

  <!-- R_B from V_CC (via separate branch) to base -->
  <line x1="300" y1="40" x2="175" y2="40" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="40" x2="175" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <rect x="163" y="85" width="24" height="44" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="148" y="109" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">R_B</text>
  <line x1="175" y1="129" x2="175" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <!-- Wire from R_B to base -->
  <line x1="175" y1="155" x2="272" y2="155" stroke="#94a3b8" stroke-width="2"/>

  <!-- Terminal labels on transistor -->
  <text x="258" y="130" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="end">B</text>
  <text x="315" y="114" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">C</text>
  <text x="322" y="200" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">E</text>

  <!-- Output annotation -->
  <line x1="300" y1="112" x2="440" y2="112" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="450" y="116" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">V_out</text>

  <!-- Problem annotation: β-dependent bias -->
  <text x="100" y="195" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">⚠ I_B = (V_CC−V_BE)/R_B</text>
  <text x="100" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">I_C = h_FE × I_B</text>
  <text x="100" y="225" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Varies with h_FE —</text>
  <text x="100" y="240" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">thermally unstable</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-15 — Simple bias: R_B sets I_B, R_C is collector load; thermally unstable (Q-point varies with h_FE)</text>
</svg>
