<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Varactor: capacitance vs reverse voltage graph -->
  <!-- C falls as reverse voltage increases -->
  <!-- Chart: x=70-545, y=25-220 -->

  <line x1="70" y1="220" x2="548" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="220" x2="70" y2="22" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="545,217 545,223 553,220" fill="#94a3b8"/>
  <polygon points="67,22 73,22 70,14" fill="#94a3b8"/>

  <text x="560" y="224" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">V<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
  <text x="63" y="18" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">C (pF)</text>

  <!-- Axis ticks for V_R: 0V at x=70, 1V at x=160, 2V at x=250, 3V at x=340, 4V at x=430, 5V at x=520 -->
  <!-- But chart goes to x=545 = about 5.3V -->
  <line x1="160" y1="220" x2="160" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="250" y1="220" x2="250" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="340" y1="220" x2="340" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="430" y1="220" x2="430" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="520" y1="220" x2="520" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="236" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">1</text>
  <text x="250" y="236" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">2</text>
  <text x="340" y="236" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">3</text>
  <text x="430" y="236" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">4</text>
  <text x="520" y="236" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">5</text>
  <text x="300" y="252" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Reverse voltage V<tspan baseline-shift="sub" font-size="70%">R</tspan> (V)</text>

  <!-- C axis ticks: 40pF at y=35, 30pF at y=78, 20pF at y=120, 10pF at y=163, 5pF at y=205 -->
  <!-- Scale: 40pF at y=35, 0pF at y=220; 40pF span = 185px → 1pF = 4.6px -->
  <line x1="70" y1="35" x2="63" y2="35" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="78" x2="63" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="120" x2="63" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="163" x2="63" y2="163" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="39" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">40</text>
  <text x="58" y="82" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">30</text>
  <text x="58" y="124" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">20</text>
  <text x="58" y="167" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">10</text>

  <!-- Varactor C vs V curve: C(V) ∝ 1/√(V+V_0) -->
  <!-- At V=0: C≈40pF (y=35); at V=1: ~28pF (y=87); at V=2: ~22pF (y=115); at V=3: ~18pF (y=137) -->
  <!-- at V=4: ~15pF (y=150); at V=5: ~13pF (y=160) -->
  <!-- Map: x = 70 + V*90 (90px per volt) -->
  <polyline points="70,35 115,70 160,87 205,102 250,115 295,126 340,137 385,144 430,150 475,156 520,160 545,163"
    fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Operating range annotation -->
  <rect x="70" y="35" width="450" height="128" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
  <text x="300" y="80" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">Typical range: 5–40 pF</text>
  <text x="300" y="96" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">controlled by V<tspan baseline-shift="sub" font-size="70%">R</tspan> (tuning voltage)</text>

  <!-- Usage annotation -->
  <text x="400" y="185" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">VCO: vary V<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
  <text x="400" y="199" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">→ vary C → vary f</text>

  <!-- Varactor symbol (small) -->
  <text x="200" y="185" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Symbol: diode with</text>
  <text x="200" y="199" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">parallel line on cathode</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-11 — Varactor (varicap): capacitance falls as reverse voltage increases; used for VCO tuning in PLLs</text>
</svg>
