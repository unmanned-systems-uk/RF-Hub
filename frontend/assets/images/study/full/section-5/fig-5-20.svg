<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Common Emitter configuration -->
  <text x="300" y="22" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle" font-weight="bold">Common Emitter</text>

  <!-- V_CC at top -->
  <line x1="300" y1="32" x2="300" y2="52" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="29" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="middle">V_CC</text>

  <!-- R_C -->
  <rect x="288" y="52" width="24" height="36" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="328" y="73" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R_C</text>
  <line x1="300" y1="88" x2="300" y2="103" stroke="#94a3b8" stroke-width="2"/>

  <!-- Transistor -->
  <circle cx="300" cy="128" r="24" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="106" x2="285" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="285" y1="111" x2="306" y2="103" stroke="#94a3b8" stroke-width="2"/>
  <line x1="306" y1="103" x2="300" y2="103" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="145" x2="306" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="303,155 306,145 314,158" fill="#94a3b8"/>
  <line x1="306" y1="153" x2="306" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="170" x2="306" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="170" x2="300" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- GND (emitter to GND = common terminal) -->
  <line x1="282" y1="200" x2="318" y2="200" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="288" y1="206" x2="312" y2="206" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="294" y1="212" x2="306" y2="212" stroke="#94a3b8" stroke-width="1"/>
  <text x="333" y="200" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4">Common</text>
  <text x="333" y="214" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4">(Emitter)</text>

  <!-- Input at base (left) -->
  <line x1="155" y1="128" x2="261" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="155" cy="128" r="4" fill="#94a3b8"/>
  <text x="140" y="132" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">in</text>

  <!-- Output at collector (right) -->
  <line x1="300" y1="95" x2="440" y2="95" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="440" cy="95" r="4" fill="#06b6d4"/>
  <text x="452" y="99" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">out</text>

  <!-- Parameters panel -->
  <rect x="30" y="225" width="540" height="42" fill="#0d1321" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="65" y="241" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Z_in ~1kΩ</text>
  <text x="190" y="241" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Z_out ~5kΩ</text>
  <text x="330" y="241" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Voltage gain: medium–high</text>
  <text x="510" y="241" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="middle">180° inversion</text>
  <text x="300" y="259" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Most common amp configuration. Output inverted relative to input.</text>

  <!-- Caption -->
  <text x="300" y="277" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 5-20 — Common emitter: input at base, output at collector, emitter grounded; medium Z_in, 180° phase inversion</text>
</svg>
