<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Improved bias: R_B, R_C, R_E. NFB via R_E stabilises Q-point -->

  <!-- V_CC -->
  <line x1="300" y1="18" x2="300" y2="40" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="14" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="middle">+V<tspan baseline-shift="sub" font-size="70%">CC</tspan></text>

  <!-- R_C from V_CC to collector -->
  <line x1="300" y1="40" x2="300" y2="60" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="60" width="24" height="40" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="336" y="82" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">R<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
  <line x1="300" y1="100" x2="300" y2="115" stroke="#94a3b8" stroke-width="2"/>

  <!-- V_CC splits to R_B as well -->
  <line x1="300" y1="40" x2="170" y2="40" stroke="#94a3b8" stroke-width="2"/>
  <!-- R_B -->
  <line x1="170" y1="40" x2="170" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <rect x="158" y="75" width="24" height="40" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="142" y="97" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">R<tspan baseline-shift="sub" font-size="70%">B</tspan></text>
  <line x1="170" y1="115" x2="170" y2="147" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base wire -->
  <line x1="170" y1="147" x2="274" y2="147" stroke="#94a3b8" stroke-width="2"/>

  <!-- Transistor NPN centred at (300, 147) -->
  <circle cx="300" cy="147" r="26" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="122" x2="285" y2="172" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="285" y1="127" x2="308" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="308" y1="115" x2="300" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="167" x2="308" y2="179" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="304,181 308,171 316,183" fill="#94a3b8"/>
  <line x1="308" y1="179" x2="308" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="195" x2="308" y2="195" stroke="#94a3b8" stroke-width="2"/>

  <!-- Terminal labels -->
  <text x="250" y="148" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="end">B</text>
  <text x="316" y="109" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">C</text>
  <text x="320" y="192" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">E</text>

  <!-- R_E from emitter to GND -->
  <line x1="300" y1="195" x2="300" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="210" width="24" height="40" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="336" y="232" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">R<tspan baseline-shift="sub" font-size="70%">E</tspan></text>
  <line x1="300" y1="250" x2="300" y2="265" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND -->
  <line x1="282" y1="265" x2="318" y2="265" stroke="#94a3b8" stroke-width="2"/>
  <line x1="288" y1="271" x2="312" y2="271" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="294" y1="277" x2="306" y2="277" stroke="#94a3b8" stroke-width="1"/>

  <!-- Output (collector) annotation -->
  <line x1="300" y1="107" x2="430" y2="107" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="438" y="111" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">V<tspan baseline-shift="sub" font-size="70%">out</tspan></text>

  <!-- NFB explanation -->
  <text x="90" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">NFB via R<tspan baseline-shift="sub" font-size="70%">E</tspan>:</text>
  <text x="90" y="225" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">C</tspan>↑ → V<tspan baseline-shift="sub" font-size="70%">E</tspan>↑ →</text>
  <text x="90" y="240" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">BE</tspan>↓ → I<tspan baseline-shift="sub" font-size="70%">B</tspan>↓ →</text>
  <text x="90" y="255" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">C</tspan> stabilised</text>

  <!-- Caption -->
  <text x="300" y="276" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 5-17 — Improved bias: R<tspan baseline-shift="sub" font-size="70%">E</tspan> provides negative feedback to stabilise I<tspan baseline-shift="sub" font-size="70%">C</tspan> against h<tspan baseline-shift="sub" font-size="70%">FE</tspan> variation and temperature</text>
</svg>
