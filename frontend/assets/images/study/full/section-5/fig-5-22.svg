<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Emitter follower (common collector) -->
  <text x="300" y="22" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Emitter Follower (Common Collector)</text>

  <!-- V_CC at top, goes directly to collector -->
  <line x1="300" y1="32" x2="300" y2="52" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="29" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="middle">V_CC</text>
  <text x="338" y="52" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4">C (common)</text>

  <!-- Transistor -->
  <circle cx="300" cy="100" r="26" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="77" x2="285" y2="123" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Collector directly to V_CC -->
  <line x1="285" y1="82" x2="308" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <line x1="308" y1="74" x2="300" y2="52" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter diagonal with arrow -->
  <line x1="285" y1="118" x2="308" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="303,132 308,122 316,134" fill="#94a3b8"/>
  <line x1="308" y1="130" x2="308" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="160" x2="308" y2="160" stroke="#94a3b8" stroke-width="2"/>

  <!-- Base input (left) -->
  <line x1="155" y1="100" x2="259" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="155" cy="100" r="4" fill="#94a3b8"/>
  <text x="140" y="104" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">in</text>

  <!-- R_E (emitter to GND) — the output is across R_E -->
  <line x1="300" y1="160" x2="300" y2="178" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="178" width="24" height="38" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="336" y="199" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R_E</text>
  <line x1="300" y1="216" x2="300" y2="238" stroke="#94a3b8" stroke-width="2"/>

  <!-- GND -->
  <line x1="282" y1="238" x2="318" y2="238" stroke="#94a3b8" stroke-width="2"/>
  <line x1="288" y1="244" x2="312" y2="244" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="294" y1="250" x2="306" y2="250" stroke="#94a3b8" stroke-width="1"/>

  <!-- Output is taken across R_E (at emitter node) -->
  <circle cx="300" cy="160" r="4" fill="#06b6d4"/>
  <line x1="300" y1="160" x2="440" y2="160" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="440" cy="160" r="4" fill="#06b6d4"/>
  <text x="452" y="164" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">out</text>

  <!-- Parameters panel -->
  <rect x="30" y="258" width="540" height="14" fill="none"/>
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Z_in = 50kΩ–2MΩ · Z_out = 10–500Ω · Gain ≈ 1 (voltage) · No phase inversion · Input buffering / impedance matching</text>

  <!-- Side annotations -->
  <text x="100" y="140" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Very high Z_in</text>
  <text x="100" y="158" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">emitter "follows"</text>
  <text x="100" y="172" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">base voltage</text>

  <text x="490" y="155" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Low Z_out</text>
  <text x="490" y="172" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">drives low-Z</text>
  <text x="490" y="186" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">loads</text>

  <!-- Caption -->
  <text x="300" y="278" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 5-22 — Emitter follower: input at base, output at emitter; very high Z_in, low Z_out, unity voltage gain</text>
</svg>
