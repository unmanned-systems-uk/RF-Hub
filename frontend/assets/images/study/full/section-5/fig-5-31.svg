<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Practical PSU with 78xx IC regulator -->
  <!-- Stages: Transformer → Bridge → C1 smoothing → 78xx → C2/C3 output → V_out -->

  <!-- Stage labels (top) -->
  <text x="55" y="22" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Mains</text>
  <text x="140" y="22" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Bridge</text>
  <text x="240" y="22" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Smooth</text>
  <text x="360" y="22" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">78xx Regulator</text>
  <text x="490" y="22" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Output</text>
  <text x="565" y="22" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">out</tspan></text>

  <!-- Top rail -->
  <line x1="20" y1="100" x2="570" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom rail (GND) -->
  <line x1="20" y1="195" x2="570" y2="195" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="207" font-family="IBM Plex Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="end">GND</text>

  <!-- Transformer symbol: primary arcs left, secondary arcs right, core lines -->
  <!-- Primary winding (left) -->
  <path d="M 30,100 Q 38,88 46,100 Q 54,88 62,100 Q 70,88 78,100" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Core double line -->
  <line x1="87" y1="88" x2="87" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="91" y1="88" x2="91" y2="112" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Secondary winding (right) -->
  <path d="M 100,100 Q 108,88 116,100 Q 124,88 132,100 Q 140,88 148,100" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- AC input label -->
  <text x="55" y="130" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">AC in</text>
  <!-- Transformer label -->
  <text x="89" y="130" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">T1</text>

  <!-- Bridge rectifier diamond (centred at 195, 147) -->
  <!-- D1 top-left: upper wire → junction top -->
  <line x1="148" y1="100" x2="170" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="170" y1="100" x2="195" y2="125" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- D3 top-right: junction top → DC+ rail -->
  <line x1="195" y1="125" x2="220" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- D2 bottom-left: lower wire → junction bottom -->
  <line x1="170" y1="195" x2="195" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- D4 bottom-right: junction bottom → GND -->
  <line x1="195" y1="170" x2="220" y2="195" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Left junction to secondary bottom -->
  <line x1="148" y1="195" x2="170" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bridge diode triangles (simplified) -->
  <polygon points="173,109 183,109 178,119" fill="#0a0e1a" stroke="#06b6d4" stroke-width="1.5"/>
  <polygon points="207,109 217,109 212,119" fill="#0a0e1a" stroke="#06b6d4" stroke-width="1.5"/>
  <polygon points="173,176 183,176 178,186" fill="#0a0e1a" stroke="#06b6d4" stroke-width="1.5"/>
  <polygon points="207,176 217,176 212,186" fill="#0a0e1a" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="195" y="155" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">BR1</text>
  <!-- DC+ from bridge to right -->
  <line x1="220" y1="100" x2="255" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- C1 smoothing capacitor (vertical, parallel to rails) -->
  <circle cx="255" cy="147" r="3" fill="#94a3b8"/>
  <line x1="255" y1="100" x2="255" y2="134" stroke="#94a3b8" stroke-width="2"/>
  <line x1="243" y1="134" x2="267" y2="134" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="243" y1="142" x2="267" y2="142" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="255" y1="142" x2="255" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <text x="275" y="142" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">C1</text>
  <text x="275" y="155" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b">1000µF</text>

  <!-- Wire to 78xx -->
  <line x1="255" y1="100" x2="310" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- 78xx IC block -->
  <rect x="310" y="75" width="100" height="50" fill="#0d1321" stroke="#06b6d4" stroke-width="2.5" rx="6"/>
  <text x="360" y="98" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="middle">78xx</text>
  <text x="360" y="114" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">IC Regulator</text>
  <!-- Input pin -->
  <line x1="310" y1="100" x2="295" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <text x="293" y="95" font-family="IBM Plex Mono, monospace" font-size="9" fill="#64748b" text-anchor="end">IN</text>
  <!-- Output pin -->
  <line x1="410" y1="100" x2="430" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <text x="432" y="95" font-family="IBM Plex Mono, monospace" font-size="9" fill="#64748b">OUT</text>
  <!-- GND pin (middle, down) -->
  <line x1="360" y1="125" x2="360" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <text x="368" y="165" font-family="IBM Plex Mono, monospace" font-size="9" fill="#64748b">GND</text>

  <!-- C2 output cap -->
  <line x1="430" y1="100" x2="455" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="455" cy="100" r="3" fill="#94a3b8"/>
  <line x1="455" y1="100" x2="455" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <line x1="443" y1="126" x2="467" y2="126" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="443" y1="133" x2="467" y2="133" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="455" y1="133" x2="455" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <text x="473" y="132" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">C2</text>
  <text x="473" y="145" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b">100µF</text>

  <!-- C3 ceramic decoupling cap -->
  <line x1="455" y1="100" x2="500" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="500" cy="100" r="3" fill="#94a3b8"/>
  <line x1="500" y1="100" x2="500" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <line x1="488" y1="126" x2="512" y2="126" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="488" y1="133" x2="512" y2="133" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="500" y1="133" x2="500" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <text x="518" y="132" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">C3</text>
  <text x="518" y="145" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b">100nF</text>

  <!-- V_out -->
  <line x1="500" y1="100" x2="570" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <text x="570" y="96" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">V<tspan baseline-shift="sub" font-size="70%">out</tspan></text>
  <text x="570" y="110" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="end">(regulated)</text>

  <!-- 78xx family note -->
  <text x="360" y="225" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">7805=5V · 7809=9V · 7812=12V · 7815=15V</text>

  <!-- Caption -->
  <text x="300" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-31 — Practical PSU: bridge rectifier → C1 smoothing → 78xx IC regulator → C2/C3 decoupling → regulated V<tspan baseline-shift="sub" font-size="70%">out</tspan></text>
</svg>
