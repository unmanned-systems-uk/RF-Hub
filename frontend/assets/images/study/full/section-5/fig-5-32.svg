<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- SMPS block diagram -->
  <!-- Blocks (left to right, top row): AC Filter → Rectifier → Chopper → Ferrite Tx → Output Rect → Output Filter → DC Out -->
  <!-- Bottom: feedback via optical isolator back to Chopper controller -->

  <!-- Block helper: 7 blocks across top, y=55..115 -->

  <!-- Block 1: AC Mains Filter -->
  <rect x="10" y="55" width="68" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="44" y="76" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">AC Mains</text>
  <text x="44" y="89" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Filter</text>
  <text x="44" y="100" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">EMI/RFI</text>
  <!-- Input arrow -->
  <line x1="0" y1="80" x2="10" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <text x="4" y="75" font-family="IBM Plex Mono, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">AC</text>

  <!-- Arrow 1→2 -->
  <line x1="78" y1="80" x2="95" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="92,76 92,84 99,80" fill="#94a3b8"/>

  <!-- Block 2: Rectifier & Smooth -->
  <rect x="99" y="55" width="68" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="133" y="76" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Rectifier</text>
  <text x="133" y="89" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">&amp; Smooth</text>
  <text x="133" y="100" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">High-V DC</text>

  <!-- Arrow 2→3 -->
  <line x1="167" y1="80" x2="184" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="181,76 181,84 188,80" fill="#94a3b8"/>

  <!-- Block 3: Chopper / Switch -->
  <rect x="188" y="55" width="68" height="50" fill="#0d1321" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="222" y="73" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Chopper</text>
  <text x="222" y="85" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Switch</text>
  <text x="222" y="97" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">30–60 kHz</text>
  <text x="222" y="108" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">PWM ctrl</text>

  <!-- Arrow 3→4 -->
  <line x1="256" y1="80" x2="273" y2="80" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="270,76 270,84 277,80" fill="#f59e0b"/>

  <!-- Block 4: Ferrite Transformer -->
  <rect x="277" y="55" width="68" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="311" y="73" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Ferrite</text>
  <text x="311" y="85" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Transform.</text>
  <text x="311" y="97" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">isolation</text>
  <text x="311" y="108" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">step-down</text>

  <!-- Arrow 4→5 -->
  <line x1="345" y1="80" x2="362" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="359,76 359,84 366,80" fill="#94a3b8"/>

  <!-- Block 5: Output Rectifier -->
  <rect x="366" y="55" width="68" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="400" y="76" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Output</text>
  <text x="400" y="89" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Rectifier</text>
  <text x="400" y="100" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">Schottky</text>

  <!-- Arrow 5→6 -->
  <line x1="434" y1="80" x2="451" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="448,76 448,84 455,80" fill="#94a3b8"/>

  <!-- Block 6: Output Filter -->
  <rect x="455" y="55" width="68" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="489" y="76" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Output</text>
  <text x="489" y="89" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="middle">Filter</text>
  <text x="489" y="100" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">L + C</text>

  <!-- Arrow 6→out -->
  <line x1="523" y1="80" x2="548" y2="80" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="545,76 545,84 552,80" fill="#06b6d4"/>
  <text x="570" y="76" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">DC</text>
  <text x="570" y="90" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">Out</text>

  <!-- Advantages panel (right side, below DC out) -->
  <text x="570" y="115" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="end">Small · light</text>
  <text x="570" y="127" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="end">high efficiency</text>
  <text x="570" y="139" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="end">~85–90%</text>

  <!-- Optical Isolator feedback block -->
  <!-- Feedback line from DC Out taps down to feedback block -->
  <line x1="548" y1="80" x2="548" y2="170" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Feedback block: Optical Isolator -->
  <rect x="460" y="155" width="90" height="40" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="505" y="172" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Opto-</text>
  <text x="505" y="186" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">isolator</text>
  <line x1="548" y1="170" x2="550" y2="170" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="170" x2="550" y2="175" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="175" x2="460" y2="175" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Feedback from opto to PWM controller (Chopper) -->
  <line x1="460" y1="175" x2="350" y2="175" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="350" y1="175" x2="222" y2="175" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="222" y1="175" x2="222" y2="105" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Arrow up into Chopper block -->
  <polygon points="218,108 226,108 222,102" fill="#06b6d4"/>
  <text x="335" y="193" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">PWM feedback (controls duty cycle)</text>

  <!-- Isolation barrier annotation -->
  <line x1="311" y1="38" x2="311" y2="52" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="311" y="36" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#334155" text-anchor="middle">isolation barrier</text>

  <!-- Key advantages vs linear -->
  <text x="300" y="220" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">SMPS advantages over linear: far higher efficiency, smaller transformer (high-frequency ferrite core)</text>
  <text x="300" y="234" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Disadvantage: switching noise (30–60 kHz harmonics) requires careful EMC filtering</text>

  <!-- Caption -->
  <text x="300" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-32 — SMPS block diagram: AC filter → rectify → chop (30–60 kHz) → ferrite Tx → rectify → filter → DC; opto feedback</text>
</svg>
