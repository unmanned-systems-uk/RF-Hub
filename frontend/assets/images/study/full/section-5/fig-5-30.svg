<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Regulated PSU block diagram: Tr1 series pass, Tr2 error amp, Zener reference, R3/R4 sense -->

  <!-- Blocks from left to right -->
  <!-- V_in (unregulated DC) -->
  <text x="30" y="140" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">in</tspan></text>
  <text x="30" y="154" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">(unreg)</text>
  <line x1="55" y1="145" x2="85" y2="145" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tr1 series pass transistor block -->
  <rect x="85" y="110" width="90" height="70" fill="#0d1321" stroke="#06b6d4" stroke-width="2" rx="6"/>
  <text x="130" y="143" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="middle">Tr1</text>
  <text x="130" y="157" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Series Pass</text>
  <text x="130" y="170" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(NPN)</text>

  <!-- Output line from Tr1 to V_out -->
  <line x1="175" y1="145" x2="230" y2="145" stroke="#94a3b8" stroke-width="2"/>

  <!-- Output junction (splits to load and sense resistors) -->
  <circle cx="230" cy="145" r="3.5" fill="#94a3b8"/>

  <!-- V_out to load (right side) -->
  <line x1="230" y1="145" x2="570" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <text x="570" y="140" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">V<tspan baseline-shift="sub" font-size="70%">out</tspan></text>
  <text x="570" y="155" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="end">(regulated)</text>

  <!-- GND rail -->
  <line x1="55" y1="220" x2="570" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="232" font-family="IBM Plex Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="end">GND</text>

  <!-- Sense divider R3/R4 (from V_out to GND) -->
  <line x1="300" y1="145" x2="300" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="160" width="24" height="20" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="330" y="173" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">R3</text>
  <line x1="300" y1="180" x2="300" y2="192" stroke="#94a3b8" stroke-width="2"/>
  <!-- Sense junction -->
  <circle cx="300" cy="192" r="3" fill="#f59e0b"/>
  <line x1="300" y1="192" x2="300" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="202" width="24" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="330" y="214" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">R4</text>
  <line x1="300" y1="220" x2="300" y2="222" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tr2 error amplifier block -->
  <rect x="350" y="168" width="90" height="60" fill="#0d1321" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="395" y="192" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b" text-anchor="middle">Tr2</text>
  <text x="395" y="206" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Error Amp</text>
  <text x="395" y="218" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(compares)</text>

  <!-- Sense → Tr2 (base of Tr2) -->
  <line x1="300" y1="192" x2="350" y2="192" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Zener reference to Tr2 -->
  <line x1="420" y1="228" x2="420" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <!-- Zener symbol horizontal (simple) -->
  <line x1="405" y1="228" x2="435" y2="228" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="405" y1="228" x2="397" y2="220" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="435" y1="228" x2="443" y2="236" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="420" y1="228" x2="420" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <text x="452" y="232" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b">V<tspan baseline-shift="sub" font-size="70%">ref</tspan></text>

  <!-- Tr2 output → Tr1 base (feedback path) -->
  <line x1="350" y1="198" x2="130" y2="198" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="130" y1="198" x2="130" y2="180" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="240" y="193" font-family="IBM Plex Mono, monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">error correction →</text>

  <!-- V_in to Tr1 (top) -->
  <line x1="55" y1="120" x2="85" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="55" y1="120" x2="55" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <line x1="55" y1="145" x2="55" y2="220" stroke="#94a3b8" stroke-width="2"/>

  <!-- Operation caption -->
  <text x="300" y="248" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">out</tspan>↑ → Tr2 conducts more → reduces Tr1 base drive → V<tspan baseline-shift="sub" font-size="70%">out</tspan>↓ (NFB)</text>

  <!-- Caption -->
  <text x="300" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-30 — Regulated PSU: Tr1 series pass; Tr2 error amp compares R3/R4 sense to Zener V<tspan baseline-shift="sub" font-size="70%">ref</tspan> via NFB</text>
</svg>
