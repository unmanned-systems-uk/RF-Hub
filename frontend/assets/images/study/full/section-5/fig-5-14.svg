<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Two graphs: I_C vs V_BE (left) and I_C vs V_CE family curves (right) -->
  <line x1="295" y1="15" x2="295" y2="260" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === LEFT: I_C vs V_BE === -->
  <text x="148" y="28" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">C</tspan> vs V<tspan baseline-shift="sub" font-size="70%">BE</tspan></text>

  <!-- Left axes -->
  <line x1="50" y1="220" x2="270" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="50" y1="220" x2="50" y2="35" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="267,217 267,223 275,220" fill="#94a3b8"/>
  <polygon points="47,35 53,35 50,27" fill="#94a3b8"/>
  <text x="278" y="224" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">V<tspan baseline-shift="sub" font-size="70%">BE</tspan></text>
  <text x="43" y="31" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="end">I<tspan baseline-shift="sub" font-size="70%">C</tspan></text>

  <!-- 0.6V knee: x = 50 + 0.6/1.0*220 = 50+132 = 182 (1V spans full width to x=270) -->
  <!-- V_BE ticks: 0.2V at x=94, 0.4V at x=138, 0.6V at x=182, 0.8V at x=226 -->
  <line x1="182" y1="220" x2="182" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="182" y="235" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">0.6</text>
  <text x="226" y="235" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">0.8</text>
  <line x1="226" y1="220" x2="226" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="247" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>

  <!-- I_C vs V_BE curve: near zero until 0.6V, exponential rise -->
  <polyline points="50,219 138,219 160,219 182,217 194,210 205,195 216,172 226,148 238,110 250,70 262,40 270,25"
    fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Knee annotation -->
  <line x1="182" y1="217" x2="182" y2="220" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="178" y="210" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="end">knee</text>

  <!-- === RIGHT: I_C vs V_CE family curves === -->
  <text x="448" y="28" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">C</tspan> vs V<tspan baseline-shift="sub" font-size="70%">CE</tspan> (I<tspan baseline-shift="sub" font-size="70%">B</tspan> stepped)</text>

  <!-- Right axes -->
  <line x1="320" y1="220" x2="575" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="320" y1="220" x2="320" y2="35" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="572,217 572,223 580,220" fill="#94a3b8"/>
  <polygon points="317,35 323,35 320,27" fill="#94a3b8"/>
  <text x="582" y="224" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">V<tspan baseline-shift="sub" font-size="70%">CE</tspan></text>
  <text x="313" y="31" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="end">I<tspan baseline-shift="sub" font-size="70%">C</tspan></text>

  <!-- Family of curves for I_B1 < I_B2 < I_B3 < I_B4 -->
  <!-- Each curve: rises steeply near V_CE=0, then nearly flat (saturated region then active) -->
  <!-- I_B4 (top): rises steeply to y=55, then flat -->
  <path d="M 320,220 C 335,220 340,58 355,55 C 400,52 450,50 575,48"
    fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="578" y="52" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4">I<tspan baseline-shift="sub" font-size="70%">B4</tspan></text>

  <!-- I_B3 -->
  <path d="M 320,220 C 335,220 340,93 355,90 C 400,87 450,85 575,83"
    fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="578" y="87" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4">I<tspan baseline-shift="sub" font-size="70%">B3</tspan></text>

  <!-- I_B2 -->
  <path d="M 320,220 C 335,220 340,130 355,127 C 400,124 450,122 575,120"
    fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="578" y="124" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4">I<tspan baseline-shift="sub" font-size="70%">B2</tspan></text>

  <!-- I_B1 (lowest) -->
  <path d="M 320,220 C 335,220 340,170 355,167 C 400,164 450,162 575,160"
    fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="578" y="164" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4">I<tspan baseline-shift="sub" font-size="70%">B1</tspan></text>

  <!-- I_B=0 (cutoff) -->
  <line x1="320" y1="218" x2="575" y2="218" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="578" y="218" font-family="IBM Plex Mono, monospace" font-size="10" fill="#334155">0</text>

  <!-- Saturation region vertical dashed line -->
  <line x1="345" y1="35" x2="345" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="333" y="250" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">Sat.</text>
  <text x="450" y="250" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">Active region</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-14 — Left: I<tspan baseline-shift="sub" font-size="70%">C</tspan> vs V<tspan baseline-shift="sub" font-size="70%">BE</tspan> (exponential above 0.6 V). Right: output curves — each line = constant I<tspan baseline-shift="sub" font-size="70%">B</tspan></text>
</svg>
