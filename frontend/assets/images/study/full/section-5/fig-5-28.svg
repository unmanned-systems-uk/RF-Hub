<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- IC packages: DIP (left) and SMD (right) -->
  <line x1="300" y1="20" x2="300" y2="258" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === LEFT: DIP (Dual In-Line Package) === -->
  <text x="150" y="32" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#06b6d4" text-anchor="middle">DIP (Through-Hole)</text>

  <!-- DIP body: 8-pin example, centred at (150, 148) -->
  <rect x="90" y="68" width="120" height="160" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="4"/>

  <!-- Notch at top (pin 1 indicator) -->
  <path d="M 140,68 A 10,10 0 0,1 160,68" fill="#0a0e1a" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Pin 1 dot -->
  <circle cx="95" cy="88" r="3" fill="#06b6d4"/>

  <!-- Left pins (pins 1,2,3,4) -->
  <line x1="90" y1="88" x2="55" y2="88" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="90" y1="118" x2="55" y2="118" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="90" y1="148" x2="55" y2="148" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="90" y1="178" x2="55" y2="178" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Right pins (pins 8,7,6,5) -->
  <line x1="210" y1="88" x2="245" y2="88" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="210" y1="118" x2="245" y2="118" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="210" y1="148" x2="245" y2="148" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="210" y1="178" x2="245" y2="178" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Pin labels -->
  <text x="48" y="92" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">1</text>
  <text x="48" y="122" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">2</text>
  <text x="48" y="152" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">3</text>
  <text x="48" y="182" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">4</text>
  <text x="252" y="92" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">8</text>
  <text x="252" y="122" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">7</text>
  <text x="252" y="152" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">6</text>
  <text x="252" y="182" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">5</text>

  <!-- IC part number on body -->
  <text x="150" y="140" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">NE555</text>
  <text x="150" y="158" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">DIP-8</text>

  <!-- Dimension label -->
  <text x="150" y="248" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">2.54 mm pitch · solders into PCB holes</text>

  <!-- === RIGHT: SMD (Surface Mount) === -->
  <text x="450" y="32" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle">SMD (Surface-Mount)</text>

  <!-- SOIC/SO-8 body: smaller, wider pads on sides -->
  <rect x="370" y="95" width="160" height="90" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="4"/>

  <!-- Notch at left (pin 1) -->
  <circle cx="375" cy="115" r="5" fill="#0a0e1a" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Left pads (pins 1,2,3,4) — horizontal flat pads sticking out -->
  <rect x="340" y="100" width="32" height="12" fill="#475569" rx="2"/>
  <rect x="340" y="118" width="32" height="12" fill="#475569" rx="2"/>
  <rect x="340" y="136" width="32" height="12" fill="#475569" rx="2"/>
  <rect x="340" y="154" width="32" height="12" fill="#475569" rx="2"/>

  <!-- Right pads (pins 8,7,6,5) -->
  <rect x="528" y="100" width="32" height="12" fill="#475569" rx="2"/>
  <rect x="528" y="118" width="32" height="12" fill="#475569" rx="2"/>
  <rect x="528" y="136" width="32" height="12" fill="#475569" rx="2"/>
  <rect x="528" y="154" width="32" height="12" fill="#475569" rx="2"/>

  <!-- Pin numbers -->
  <text x="336" y="110" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">1</text>
  <text x="336" y="128" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">2</text>
  <text x="336" y="146" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">3</text>
  <text x="336" y="164" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="end">4</text>
  <text x="566" y="110" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">8</text>
  <text x="566" y="128" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">7</text>
  <text x="566" y="146" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">6</text>
  <text x="566" y="164" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b">5</text>

  <!-- Part number on body -->
  <text x="450" y="138" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">SO-8</text>
  <text x="450" y="155" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">SMD</text>

  <!-- Dimension label -->
  <text x="450" y="215" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">1.27 mm pitch · solders flat to PCB surface</text>
  <text x="450" y="230" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Smaller, lighter, better RF performance</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-28 — IC packages: DIP (dual in-line, through-hole) and SMD SO (surface-mount); SMD preferred for RF</text>
</svg>
