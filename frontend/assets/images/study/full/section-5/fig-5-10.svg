<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Simple zener voltage reference: R_S in series, zener from rail to GND -->
  <!-- 12V supply at top, R_S in top wire, output node, Zener to GND, R_L as load -->

  <!-- Supply rail (top horizontal wire) -->
  <line x1="60" y1="70" x2="540" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND rail (bottom horizontal wire) -->
  <line x1="60" y1="210" x2="540" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- 12V supply (left vertical) -->
  <line x1="60" y1="70" x2="60" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="38" y1="120" x2="82" y2="120" stroke="#e2e8f0" stroke-width="3.5"/>
  <line x1="48" y1="148" x2="72" y2="148" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="60" y1="148" x2="60" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <text x="18" y="137" font-family="IBM Plex Mono, monospace" font-size="15" fill="#e2e8f0" text-anchor="end">12V</text>
  <text x="35" y="124" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">+</text>
  <text x="35" y="153" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8" text-anchor="end">−</text>

  <!-- R_S series resistor on top wire -->
  <line x1="60" y1="70" x2="150" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <rect x="150" y="60" width="80" height="20" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="190" y="52" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">R<tspan baseline-shift="sub" font-size="70%">S</tspan></text>
  <line x1="230" y1="70" x2="310" y2="70" stroke="#94a3b8" stroke-width="2"/>

  <!-- Output junction at x=310 -->
  <circle cx="310" cy="70" r="4" fill="#94a3b8"/>

  <!-- Wire from junction to right (load) and down (zener) -->
  <line x1="310" y1="70" x2="460" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="70" x2="310" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- Zener diode (vertical, reverse biased: cathode at top, anode at bottom) -->
  <!-- Symbol: triangle points up (current would flow up when forward biased; Zener is reverse, so cathode is up) -->
  <!-- Vertical Zener: from (310,100) → cathode bar at (310,100+triangle_height) → anode → GND -->
  <!-- For reverse-biased zener: cathode (+) at top (connected to V+), anode (−) at bottom (GND) -->
  <!-- Draw zener symbol rotated 90° CCW: cathode bar horizontal at top, triangle below pointing down -->
  <!-- Let's draw it as: from y=100, cathode bar, gap, triangle pointing toward GND -->
  <!-- Cathode (K) at y=100 (connected to output node) -->
  <polygon points="298,130 322,130 310,160" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="298" y1="130" x2="322" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="298" y1="130" x2="290" y2="120" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="322" y1="130" x2="330" y2="140" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="310" y1="100" x2="310" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="160" x2="310" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- Zener label -->
  <text x="345" y="148" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">DZ</text>
  <text x="345" y="163" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b">V<tspan baseline-shift="sub" font-size="70%">z</tspan>=9.6V</text>

  <!-- Load R_L (rightmost, parallel with Zener) -->
  <line x1="460" y1="70" x2="460" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <rect x="448" y="105" width="24" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="495" y="132" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">R<tspan baseline-shift="sub" font-size="70%">L</tspan></text>
  <line x1="460" y1="155" x2="460" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="210" x2="310" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- GND connection -->
  <line x1="310" y1="210" x2="310" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="292" y1="230" x2="328" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="298" y1="236" x2="322" y2="236" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="304" y1="242" x2="316" y2="242" stroke="#94a3b8" stroke-width="1"/>

  <!-- V_out annotation -->
  <line x1="460" y1="90" x2="540" y2="90" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="548" y="94" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">V<tspan baseline-shift="sub" font-size="70%">out</tspan></text>
  <text x="548" y="108" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4">= 9.6V</text>

  <!-- Operation description -->
  <text x="190" y="250" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">S</tspan> = (V<tspan baseline-shift="sub" font-size="70%">supply</tspan> − V<tspan baseline-shift="sub" font-size="70%">z</tspan>) / R<tspan baseline-shift="sub" font-size="70%">S</tspan></text>
  <text x="190" y="265" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Zener clamps output to V<tspan baseline-shift="sub" font-size="70%">z</tspan></text>

  <!-- Caption -->
  <text x="300" y="278" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 5-10 — Zener voltage reference: R<tspan baseline-shift="sub" font-size="70%">S</tspan> limits current; zener holds V<tspan baseline-shift="sub" font-size="70%">out</tspan> = V<tspan baseline-shift="sub" font-size="70%">z</tspan> = 9.6V despite load variations</text>
</svg>
