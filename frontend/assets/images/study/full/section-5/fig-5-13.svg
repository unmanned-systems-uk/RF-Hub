<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <marker id="ic" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
    <marker id="ib" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="ie" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- NPN transistor symbol + current annotations -->
  <!-- Transistor body circle centred at (260, 140) -->
  <circle cx="260" cy="140" r="45" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>

  <!-- Base junction line (vertical inside circle) -->
  <line x1="245" y1="110" x2="245" y2="170" stroke="#94a3b8" stroke-width="3"/>

  <!-- Collector (upper diagonal): from junction at (245,115) to exit at (290,95) -->
  <line x1="245" y1="115" x2="290" y2="95" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Emitter (lower diagonal) with arrow (NPN): from junction at (245,165) to exit at (290,185) -->
  <!-- Arrow at the exit end of emitter line, pointing away from transistor -->
  <line x1="245" y1="165" x2="284" y2="181" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Emitter arrow at (284,181) - a triangle pointing toward exit -->
  <polygon points="278,186 282,174 292,184" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/>

  <!-- External lead wires -->
  <!-- Base lead -->
  <line x1="180" y1="140" x2="245" y2="140" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Collector lead -->
  <line x1="290" y1="95" x2="340" y2="70" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Emitter lead -->
  <line x1="292" y1="185" x2="340" y2="210" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Terminal labels -->
  <text x="155" y="144" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="end" font-weight="bold">B</text>
  <text x="350" y="68" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" font-weight="bold">C</text>
  <text x="350" y="220" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" font-weight="bold">E</text>
  <text x="250" y="235" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">NPN</text>

  <!-- Current arrows -->
  <!-- I_B: into base (left to right) -->
  <line x1="170" y1="140" x2="190" y2="140" stroke="#f59e0b" stroke-width="2" marker-end="url(#ib)"/>
  <text x="120" y="134" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">I<tspan baseline-shift="sub" font-size="70%">B</tspan></text>
  <text x="120" y="150" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b">(small)</text>

  <!-- I_C: into collector (down from top) -->
  <line x1="330" y1="78" x2="312" y2="89" stroke="#06b6d4" stroke-width="2" marker-end="url(#ic)"/>
  <text x="358" y="62" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">I<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
  <text x="358" y="78" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b">(large)</text>

  <!-- I_E: out of emitter (bottom) -->
  <line x1="312" y1="191" x2="330" y2="202" stroke="#94a3b8" stroke-width="2" marker-end="url(#ie)"/>
  <text x="358" y="208" font-family="IBM Plex Mono, monospace" font-size="13" fill="#94a3b8">I<tspan baseline-shift="sub" font-size="70%">E</tspan></text>
  <text x="358" y="224" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b">= I<tspan baseline-shift="sub" font-size="70%">B</tspan> + I<tspan baseline-shift="sub" font-size="70%">C</tspan></text>

  <!-- Equations panel -->
  <rect x="415" y="80" width="165" height="115" fill="#0d1321" stroke="#334155" stroke-width="1" rx="6"/>
  <text x="497" y="100" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Current Relations</text>
  <line x1="425" y1="106" x2="572" y2="106" stroke="#334155" stroke-width="1"/>
  <text x="497" y="122" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">E</tspan> = I<tspan baseline-shift="sub" font-size="70%">B</tspan> + I<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
  <text x="497" y="140" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b" text-anchor="middle">h<tspan baseline-shift="sub" font-size="70%">FE</tspan> = I<tspan baseline-shift="sub" font-size="70%">C</tspan> / I<tspan baseline-shift="sub" font-size="70%">B</tspan></text>
  <text x="497" y="158" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">h<tspan baseline-shift="sub" font-size="70%">FE</tspan> = 50–500</text>
  <text x="497" y="176" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">BE</tspan> ≈ 0.6V (Si)</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-13 — NPN transistor: small base current I<tspan baseline-shift="sub" font-size="70%">B</tspan> controls large collector current I<tspan baseline-shift="sub" font-size="70%">C</tspan> = h<tspan baseline-shift="sub" font-size="70%">FE</tspan> × I<tspan baseline-shift="sub" font-size="70%">B</tspan></text>
</svg>
