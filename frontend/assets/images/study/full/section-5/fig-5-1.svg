<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- P-N junction diode structure -->
  <!-- N-type on left (x=70-270), P-type on right (x=330-530) -->
  <!-- Depletion layer in middle (x=270-330) -->

  <!-- N-type region -->
  <rect x="70" y="80" width="200" height="120" fill="#0d1321" stroke="#06b6d4" stroke-width="2" rx="4"/>
  <text x="170" y="130" font-family="IBM Plex Mono, monospace" font-size="16" fill="#06b6d4" text-anchor="middle" font-weight="bold">N-type</text>
  <text x="170" y="150" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">donor atoms</text>
  <!-- Free electrons (−) symbols -->
  <text x="110" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="150" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="190" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="230" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="110" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="150" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="190" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>
  <text x="230" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">⊖</text>

  <!-- Depletion layer (centre) -->
  <rect x="270" y="80" width="60" height="120" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="2"/>
  <text x="300" y="140" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" writing-mode="tb" transform="rotate(90,300,140)">depletion layer</text>

  <!-- P-type region -->
  <rect x="330" y="80" width="200" height="120" fill="#0d1321" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="430" y="130" font-family="IBM Plex Mono, monospace" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">P-type</text>
  <text x="430" y="150" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">acceptor atoms</text>
  <!-- Holes (+) symbols -->
  <text x="345" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="385" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="425" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="465" y="108" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="345" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="385" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="425" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>
  <text x="465" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">⊕</text>

  <!-- Built-in E field arrows (pointing from N to P across depletion layer, i.e. left to right) -->
  <defs>
    <marker id="ef5" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="278" y1="130" x2="322" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ef5)"/>
  <text x="300" y="124" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">E field</text>

  <!-- Terminal connections -->
  <line x1="30" y1="140" x2="70" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <line x1="530" y1="140" x2="570" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <text x="18" y="144" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">K</text>
  <text x="580" y="144" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">A</text>
  <text x="18" y="158" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="end">cathode</text>
  <text x="580" y="158" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">anode</text>

  <!-- Diode circuit symbol below -->
  <text x="300" y="218" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Circuit symbol:</text>
  <!-- Anode wire -->
  <line x1="200" y1="240" x2="230" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <!-- Triangle (diode) -->
  <polygon points="230,228 230,252 255,240" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Cathode bar -->
  <line x1="255" y1="228" x2="255" y2="252" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- Cathode wire -->
  <line x1="255" y1="240" x2="290" y2="240" stroke="#94a3b8" stroke-width="2"/>
  <!-- + / − labels on symbol -->
  <text x="195" y="244" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b" text-anchor="end">A(+)</text>
  <text x="295" y="244" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">K(−)</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-1 — P-N junction: depletion layer forms at boundary; built-in field opposes further diffusion</text>
</svg>
