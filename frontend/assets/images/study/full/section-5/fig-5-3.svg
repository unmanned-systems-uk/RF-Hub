<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <marker id="a5" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#06b6d4"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Half-wave rectifier: circuit (top half) + waveforms (bottom half) -->
  <!-- Panel divider -->
  <line x1="20" y1="148" x2="580" y2="148" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === TOP: CIRCUIT === -->
  <!-- AC source → Diode → Load R_L, return wire at bottom -->
  <!-- AC source at x=80 -->
  <circle cx="80" cy="84" r="28" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="88" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">AC</text>
  <text x="80" y="102" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">source</text>

  <!-- Top wire: source → diode → load -->
  <line x1="80" y1="56" x2="80" y2="35" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="35" x2="200" y2="35" stroke="#94a3b8" stroke-width="2"/>

  <!-- Diode symbol at x=200-240, on top wire -->
  <polygon points="200,23 200,47 232,35" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="232" y1="23" x2="232" y2="47" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="216" y="20" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">D1</text>
  <!-- Arrow showing forward direction -->
  <line x1="248" y1="35" x2="260" y2="35" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#a5)"/>

  <!-- Wire from diode to load junction -->
  <line x1="232" y1="35" x2="380" y2="35" stroke="#94a3b8" stroke-width="2"/>

  <!-- Load R_L (vertical) -->
  <line x1="380" y1="35" x2="380" y2="58" stroke="#94a3b8" stroke-width="2"/>
  <rect x="368" y="58" width="24" height="44" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="415" y="82" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">R_L</text>
  <line x1="380" y1="102" x2="380" y2="133" stroke="#94a3b8" stroke-width="2"/>

  <!-- Bottom return wire -->
  <line x1="380" y1="133" x2="80" y2="133" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="133" x2="80" y2="112" stroke="#94a3b8" stroke-width="2"/>

  <!-- Output voltage label -->
  <text x="438" y="84" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">V_out</text>

  <!-- === BOTTOM: WAVEFORMS === -->
  <!-- Input sinewave (left) and output (right) -->
  <text x="155" y="168" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">AC input</text>
  <text x="440" y="168" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">DC output</text>

  <!-- Input sinewave at x=55-260, centred at y=205 -->
  <path d="M 55,205 C 70,205 78,177 88,177 C 98,177 106,205 120,205 C 134,205 142,233 152,233 C 162,233 170,205 185,205 C 199,205 207,177 217,177 C 227,177 235,205 250,205 C 257,205 258,205 260,205"
    fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Input x-axis -->
  <line x1="55" y1="205" x2="265" y2="205" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Output half-wave at x=310-550, zero-line at y=235, positive pulses only -->
  <!-- Zero line -->
  <line x1="310" y1="235" x2="560" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- First positive half-cycle: from x=310 to x=380, amplitude at y=207 -->
  <path d="M 310,235 C 325,235 333,207 343,207 C 353,207 361,235 375,235"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Gap (flat zero for negative half cycle): 375 to 445 -->
  <line x1="375" y1="235" x2="445" y2="235" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Second positive half-cycle: 445 to 515 -->
  <path d="M 445,235 C 460,235 468,207 478,207 C 488,207 496,235 510,235"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Remaining flat -->
  <line x1="510" y1="235" x2="555" y2="235" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Annotation: negative half-cycles blocked -->
  <text x="410" y="253" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">negative half blocked</text>

  <!-- Caption -->
  <text x="300" y="275" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-3 — Half-wave rectifier: only positive half-cycles pass through the diode</text>
</svg>
