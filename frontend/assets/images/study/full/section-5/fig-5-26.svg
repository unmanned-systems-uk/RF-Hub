<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Field effect transistor: n-channel JFET structure + symbol + MOSFET symbol -->
  <!-- Two panels: Left = JFET symbol, Right = N-channel structure concept -->
  <line x1="300" y1="15" x2="300" y2="260" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === LEFT: JFET Symbol === -->
  <text x="150" y="30" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle">N-channel JFET</text>

  <!-- JFET symbol: vertical channel line (drain top, source bottom), gate arrow on left side -->
  <!-- Channel vertical line at x=220, y=70 to y=210 -->
  <line x1="220" y1="70" x2="220" y2="210" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Drain lead (top) -->
  <line x1="220" y1="70" x2="220" y2="45" stroke="#94a3b8" stroke-width="2"/>
  <text x="238" y="40" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">D</text>

  <!-- Source lead (bottom) with arrow -->
  <line x1="220" y1="210" x2="220" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <text x="238" y="240" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">S</text>

  <!-- Gate lead: horizontal arrow pointing INTO the channel (for n-channel: arrow points right) -->
  <line x1="140" y1="140" x2="190" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <!-- Arrow pointing right (toward channel) at x=190 -->
  <polygon points="185,135 185,145 220,140" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="125" y="144" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="end">G</text>

  <!-- Gate junction line on channel -->
  <line x1="220" y1="130" x2="220" y2="150" stroke="#94a3b8" stroke-width="1"/>

  <!-- Depletion layer annotation -->
  <text x="68" y="178" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">GS</tspan> controls</text>
  <text x="68" y="192" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">channel width</text>
  <text x="68" y="206" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">→ controls I<tspan baseline-shift="sub" font-size="70%">D</tspan></text>

  <!-- V_GS = 0 and pinch-off labels -->
  <text x="68" y="90" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">GS</tspan> = 0:</text>
  <text x="68" y="106" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">max I<tspan baseline-shift="sub" font-size="70%">D</tspan> (open)</text>
  <text x="68" y="130" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">GS</tspan> = V<tspan baseline-shift="sub" font-size="70%">P</tspan>:</text>
  <text x="68" y="146" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">D</tspan> = 0 (pinched)</text>

  <!-- === RIGHT: N-channel structure === -->
  <text x="450" y="30" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle">N-channel structure</text>

  <!-- N-channel body (horizontal bar representing substrate) -->
  <!-- P-type substrate rectangle -->
  <rect x="330" y="110" width="230" height="100" fill="#1e293b" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="445" y="168" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#334155" text-anchor="middle">P substrate</text>

  <!-- N-type channel embedded (lighter) -->
  <rect x="350" y="120" width="190" height="38" fill="#0d2a40" stroke="#06b6d4" stroke-width="1.5" rx="3"/>
  <text x="445" y="143" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">N-channel</text>

  <!-- Depletion regions (narrowing the channel from gate) shown as darker areas -->
  <rect x="350" y="110" width="190" height="12" fill="#0a1a2a" stroke="#334155" stroke-width="1"/>
  <text x="445" y="120" font-family="IBM Plex Mono, monospace" font-size="9" fill="#334155" text-anchor="middle">depletion</text>

  <!-- Drain (right of channel) -->
  <line x1="540" y1="139" x2="560" y2="139" stroke="#94a3b8" stroke-width="2"/>
  <text x="572" y="143" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">D</text>

  <!-- Source (left of channel) -->
  <line x1="350" y1="139" x2="330" y2="139" stroke="#94a3b8" stroke-width="2"/>
  <text x="318" y="143" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">S</text>

  <!-- Gate (on top, controls depletion) -->
  <line x1="445" y1="110" x2="445" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <text x="445" y="80" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">G</text>
  <text x="445" y="95" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(negative V to pinch off)</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-26 — N-channel JFET: gate voltage (V<tspan baseline-shift="sub" font-size="70%">GS</tspan>) controls depletion layer width and drain current I<tspan baseline-shift="sub" font-size="70%">D</tspan></text>
</svg>
