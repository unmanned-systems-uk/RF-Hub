<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Common Base configuration -->
  <text x="300" y="22" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">Common Base</text>

  <!-- V_CC at top -->
  <line x1="380" y1="32" x2="380" y2="52" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="29" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">CC</tspan></text>

  <!-- R_C from V_CC to collector -->
  <rect x="368" y="52" width="24" height="36" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="408" y="73" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
  <line x1="380" y1="88" x2="380" y2="103" stroke="#94a3b8" stroke-width="2"/>

  <!-- Transistor -->
  <circle cx="300" cy="128" r="24" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="106" x2="285" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Collector diagonal (upper right toward R_C) -->
  <line x1="285" y1="111" x2="306" y2="103" stroke="#94a3b8" stroke-width="2"/>
  <line x1="306" y1="103" x2="380" y2="103" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="103" x2="380" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter diagonal with arrow (input) -->
  <line x1="285" y1="145" x2="264" y2="153" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="270,155 263,144 255,158" fill="#94a3b8"/>
  <line x1="255" y1="158" x2="255" y2="185" stroke="#94a3b8" stroke-width="2"/>

  <!-- Base (common): to AC ground via cap or actual ground (base is common node) -->
  <line x1="285" y1="128" x2="215" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bypass capacitor C_B -->
  <line x1="215" y1="116" x2="215" y2="140" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="205" y1="116" x2="205" y2="140" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="205" y1="128" x2="175" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base to GND through bypass cap -->
  <line x1="175" y1="96" x2="175" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="128" x2="175" y2="128" stroke="#94a3b8" stroke-width="1"/>
  <text x="212" y="108" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">C<tspan baseline-shift="sub" font-size="70%">B</tspan></text>
  <text x="155" y="132" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="end">B</text>
  <text x="155" y="148" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="end">Common</text>

  <!-- Input: emitter -->
  <line x1="80" y1="185" x2="255" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="80" cy="185" r="4" fill="#94a3b8"/>
  <text x="65" y="189" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">in</text>

  <!-- Output: collector -->
  <line x1="380" y1="95" x2="500" y2="95" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="500" cy="95" r="4" fill="#06b6d4"/>
  <text x="512" y="99" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">out</text>

  <!-- GND -->
  <line x1="175" y1="200" x2="255" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="255" y1="185" x2="255" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="215" y1="200" x2="215" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="197" y1="220" x2="233" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="203" y1="226" x2="227" y2="226" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="209" y1="232" x2="221" y2="232" stroke="#94a3b8" stroke-width="1"/>

  <!-- Parameters panel -->
  <rect x="30" y="245" width="540" height="26" fill="#0d1321" stroke="#334155" stroke-width="1" rx="4"/>
  <text x="90" y="261" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Z<tspan baseline-shift="sub" font-size="70%">in</tspan> ~50Ω</text>
  <text x="220" y="261" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Z<tspan baseline-shift="sub" font-size="70%">out</tspan> ~50kΩ</text>
  <text x="390" y="261" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Voltage gain (no phase inversion)</text>
  <text x="540" y="261" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">0°</text>

  <!-- Caption -->
  <text x="300" y="278" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 5-21 — Common base: input at emitter, output at collector; very low Z<tspan baseline-shift="sub" font-size="70%">in</tspan> (~50Ω), good at RF, no phase inversion</text>
</svg>
