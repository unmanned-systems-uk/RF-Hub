<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Load line with Q-points for Class A, AB, B, C -->
  <!-- I_C vs V_CE graph with load line -->
  <!-- Chart: x=65-540, y=20-235 -->

  <line x1="65" y1="235" x2="543" y2="235" stroke="#94a3b8" stroke-width="2"/>
  <line x1="65" y1="235" x2="65" y2="18" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="540,232 540,238 548,235" fill="#94a3b8"/>
  <polygon points="62,18 68,18 65,10" fill="#94a3b8"/>

  <text x="552" y="239" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">V<tspan baseline-shift="sub" font-size="70%">CE</tspan></text>
  <text x="58" y="14" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">I<tspan baseline-shift="sub" font-size="70%">C</tspan></text>

  <!-- Load line: from I_C(max) at x=65 to V_CC at x=490 -->
  <!-- I_C(max) at y=30, V_CC at y=235 -->
  <line x1="65" y1="30" x2="490" y2="235" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="490" y="250" font-family="IBM Plex Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">CC</tspan></text>
  <text x="52" y="34" font-family="IBM Plex Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="end">I<tspan baseline-shift="sub" font-size="70%">C</tspan>(sat)</text>

  <!-- Transistor output curves (family) - lighter -->
  <path d="M 65,235 C 80,235 85,65 100,62 C 150,58 300,56 490,54"
    fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <path d="M 65,235 C 80,235 85,95 100,92 C 150,88 300,86 490,84"
    fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <path d="M 65,235 C 80,235 85,125 100,122 C 150,118 300,116 490,114"
    fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <path d="M 65,235 C 80,235 85,155 100,152 C 150,148 300,146 490,144"
    fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <path d="M 65,235 C 80,235 85,185 100,182 C 150,178 300,176 490,174"
    fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Q-point: Class A — midpoint of load line at (277,132) -->
  <circle cx="277" cy="132" r="7" fill="#06b6d4" stroke="#06b6d4"/>
  <text x="290" y="120" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">Class A</text>
  <text x="290" y="135" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">midpoint (max swing)</text>

  <!-- Q-point: Class AB — slightly below midpoint (350, 170) -->
  <circle cx="350" cy="170" r="7" fill="#f59e0b" stroke="#f59e0b"/>
  <text x="363" y="160" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b">Class AB</text>
  <text x="363" y="175" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">near cutoff</text>

  <!-- Q-point: Class B — at cutoff (410, 200) -->
  <circle cx="410" cy="200" r="7" fill="#e2e8f0" stroke="#e2e8f0"/>
  <text x="423" y="192" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">Class B</text>
  <text x="423" y="207" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">at cutoff</text>

  <!-- Q-point: Class C — beyond cutoff (very low, near V_CE axis) -->
  <circle cx="455" cy="228" r="7" fill="#94a3b8" stroke="#94a3b8"/>
  <text x="380" y="260" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Class C (below cutoff)</text>

  <!-- Cutoff line (I_C = 0) -->
  <line x1="65" y1="235" x2="540" y2="235" stroke="#64748b" stroke-width="0.5"/>

  <!-- Saturation line (V_CE ≈ 0) -->
  <line x1="75" y1="20" x2="75" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="77" y="255" font-family="IBM Plex Mono, monospace" font-size="10" fill="#334155">Sat</text>

  <!-- Caption -->
  <text x="300" y="273" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-24 — Load line: Q-point position determines class. Class A = centre; Class B = cutoff; Class C = beyond cutoff</text>
</svg>
