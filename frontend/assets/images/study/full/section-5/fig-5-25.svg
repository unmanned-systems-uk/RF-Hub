<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Class B push-pull amplifier: NPN upper (Tr1) + PNP lower (Tr2) complementary pair -->

  <!-- +V_CC at top -->
  <line x1="300" y1="18" x2="300" y2="38" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="14" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="middle">+V_CC</text>

  <!-- −V_CC at bottom -->
  <line x1="300" y1="248" x2="300" y2="265" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="278" font-family="IBM Plex Mono, monospace" font-size="13" fill="#94a3b8" text-anchor="middle">−V_CC</text>

  <!-- Tr1 NPN (upper transistor) centred at (300, 95) -->
  <circle cx="300" cy="95" r="28" fill="#0d1321" stroke="#06b6d4" stroke-width="2"/>
  <text x="300" y="88" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Tr1</text>
  <text x="300" y="102" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">NPN</text>
  <!-- Collector to +V_CC -->
  <line x1="285" y1="70" x2="300" y2="38" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="70" x2="285" y2="75" stroke="#94a3b8" stroke-width="1"/>
  <!-- Emitter downward -->
  <line x1="285" y1="120" x2="300" y2="143" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="295,145 300,133 308,145" fill="#94a3b8"/>
  <line x1="300" y1="123" x2="300" y2="143" stroke="#94a3b8" stroke-width="2"/>
  <!-- Base lead left -->
  <line x1="272" y1="95" x2="200" y2="95" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tr2 PNP (lower transistor) centred at (300, 195) -->
  <circle cx="300" cy="195" r="28" fill="#0d1321" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="188" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Tr2</text>
  <text x="300" y="202" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">PNP</text>
  <!-- Collector to −V_CC -->
  <line x1="285" y1="220" x2="300" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <!-- Emitter upward (PNP arrow points toward base) -->
  <line x1="285" y1="170" x2="300" y2="143" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="295,141 300,153 308,141" fill="#f59e0b"/>
  <!-- Base lead left -->
  <line x1="272" y1="195" x2="200" y2="195" stroke="#94a3b8" stroke-width="2"/>

  <!-- Output node at junction of emitters (x=300, y=143) -->
  <circle cx="300" cy="143" r="4" fill="#94a3b8"/>
  <line x1="300" y1="143" x2="480" y2="143" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="480" cy="143" r="4" fill="#06b6d4"/>
  <text x="492" y="147" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">out</text>

  <!-- Input signal (bases tied together via biasing network) -->
  <line x1="200" y1="95" x2="200" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="145" r="4" fill="#94a3b8"/>
  <!-- Coupling from input -->
  <line x1="130" y1="145" x2="200" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="130" cy="145" r="4" fill="#94a3b8"/>
  <text x="115" y="149" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">in</text>

  <!-- Annotations -->
  <text x="480" y="90" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">Tr1 on:</text>
  <text x="480" y="104" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">+ve half-cycle</text>
  <text x="480" y="190" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">Tr2 on:</text>
  <text x="480" y="204" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">−ve half-cycle</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-25 — Class B push-pull: NPN Tr1 drives positive half-cycles, PNP Tr2 drives negative; efficient output stage</text>
</svg>
