<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Stable bias: R1/R2 voltage divider + R_C + R_E (bypass cap C_E) + coupling caps -->

  <!-- V_CC at top -->
  <line x1="300" y1="15" x2="300" y2="35" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="11" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="middle">+V_CC</text>

  <!-- Split: V_CC → R_C (right branch to collector) and V_CC → R1 (left branch, divider) -->
  <line x1="300" y1="35" x2="300" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <!-- R_C (vertical, collector load) -->
  <rect x="288" y="55" width="24" height="36" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="328" y="75" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R_C</text>
  <line x1="300" y1="91" x2="300" y2="108" stroke="#94a3b8" stroke-width="2"/>

  <!-- Coupling cap C1 (input): on left of base circuit -->
  <!-- R1 from V_CC to base node -->
  <line x1="300" y1="35" x2="175" y2="35" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="35" x2="175" y2="68" stroke="#94a3b8" stroke-width="2"/>
  <rect x="163" y="68" width="24" height="32" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="148" y="87" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="end">R1</text>
  <line x1="175" y1="100" x2="175" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- Base node at (175,130) — also junction for R2 -->
  <circle cx="175" cy="130" r="3" fill="#94a3b8"/>

  <!-- R2 from base node to GND (lower part of divider) -->
  <line x1="175" y1="130" x2="175" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <rect x="163" y="160" width="24" height="32" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="148" y="179" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="end">R2</text>
  <line x1="175" y1="192" x2="175" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="230" x2="300" y2="230" stroke="#94a3b8" stroke-width="2"/>

  <!-- Input coupling cap C1 (horizontal before base node) -->
  <!-- C1: from input terminal to base node -->
  <line x1="80" y1="130" x2="103" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <line x1="103" y1="118" x2="103" y2="142" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="113" y1="118" x2="113" y2="142" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="113" y1="130" x2="175" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="97" y="112" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">C1</text>
  <circle cx="80" cy="130" r="3" fill="#94a3b8"/>
  <text x="60" y="134" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="end">in</text>

  <!-- Transistor NPN at (300,130) -->
  <circle cx="300" cy="130" r="24" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="108" x2="285" y2="152" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="285" y1="113" x2="308" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <line x1="308" y1="108" x2="300" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="147" x2="308" y2="157" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="303,160 308,149 316,161" fill="#94a3b8"/>
  <line x1="308" y1="157" x2="308" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="175" x2="308" y2="175" stroke="#94a3b8" stroke-width="2"/>

  <!-- Wire from base (175,130) to transistor base -->
  <line x1="175" y1="130" x2="276" y2="130" stroke="#94a3b8" stroke-width="2"/>

  <!-- Output coupling cap C2 -->
  <line x1="300" y1="100" x2="380" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="380" y1="88" x2="380" y2="112" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="390" y1="88" x2="390" y2="112" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="390" y1="100" x2="440" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="440" cy="100" r="3" fill="#94a3b8"/>
  <text x="385" y="82" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">C2</text>
  <text x="452" y="104" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b">out</text>

  <!-- R_E and C_E (bypass) -->
  <line x1="300" y1="175" x2="300" y2="192" stroke="#94a3b8" stroke-width="2"/>
  <rect x="288" y="192" width="24" height="30" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="340" y="210" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R_E</text>
  <line x1="300" y1="222" x2="300" y2="230" stroke="#94a3b8" stroke-width="2"/>

  <!-- C_E bypass in parallel with R_E -->
  <line x1="300" y1="192" x2="360" y2="192" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="192" x2="360" y2="202" stroke="#94a3b8" stroke-width="2"/>
  <line x1="348" y1="202" x2="372" y2="202" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="348" y1="212" x2="372" y2="212" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="360" y1="212" x2="360" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <line x1="360" y1="230" x2="300" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="380" y="210" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b">C_E</text>

  <!-- GND -->
  <line x1="300" y1="230" x2="300" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="248" x2="315" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <line x1="290" y1="254" x2="310" y2="254" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="295" y1="260" x2="305" y2="260" stroke="#94a3b8" stroke-width="1"/>

  <!-- Caption -->
  <text x="300" y="275" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 5-18 — Stable bias: R1/R2 divider holds V_B; R_E provides DC NFB; C_E bypasses R_E for AC gain</text>
</svg>
