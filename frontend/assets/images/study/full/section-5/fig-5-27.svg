<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Dual-gate MOSFET amplifier -->
  <!-- MOSFET symbol with two gates (G1 for signal, G2 for AGC) -->

  <!-- V_DD at top -->
  <line x1="350" y1="18" x2="350" y2="38" stroke="#94a3b8" stroke-width="2"/>
  <text x="350" y="14" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="middle">V_DD</text>

  <!-- Drain load R_D from V_DD to drain -->
  <rect x="338" y="38" width="24" height="38" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="378" y="60" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">R_D</text>
  <line x1="350" y1="76" x2="350" y2="95" stroke="#94a3b8" stroke-width="2"/>

  <!-- Dual-gate MOSFET symbol -->
  <!-- Body circle -->
  <circle cx="350" cy="140" r="40" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>

  <!-- Vertical channel line inside (drain-source) -->
  <line x1="350" y1="100" x2="350" y2="180" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Three dashes for enhancement MOSFET channel (broken line) -->
  <!-- Actually dual-gate is usually depletion/enhancement MOSFET, use solid channel -->

  <!-- G1 (gate 1, bottom gate): connects from left at y=155 -->
  <line x1="350" y1="155" x2="295" y2="155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="295" y1="155" x2="295" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="295" y1="140" x2="295" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Gap (oxide) between gate and channel -->
  <line x1="295" y1="140" x2="325" y2="140" stroke="#94a3b8" stroke-width="1"/>
  <line x1="270" y1="155" x2="295" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <!-- G1 lead -->
  <line x1="200" y1="155" x2="270" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="155" r="3" fill="#94a3b8"/>
  <text x="185" y="159" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">G1</text>
  <text x="185" y="173" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="end">RF signal in</text>

  <!-- G2 (gate 2, upper gate): connects from left at y=125 -->
  <line x1="295" y1="125" x2="270" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <line x1="295" y1="115" x2="295" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="295" y1="115" x2="330" y2="115" stroke="#94a3b8" stroke-width="1"/>
  <line x1="200" y1="125" x2="270" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="200" cy="125" r="3" fill="#94a3b8"/>
  <text x="185" y="129" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b" text-anchor="end">G2</text>
  <text x="185" y="143" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="end">AGC voltage</text>

  <!-- Drain lead (top, to R_D) -->
  <text x="368" y="100" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">D</text>

  <!-- Source lead (bottom, to GND) -->
  <line x1="350" y1="180" x2="350" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <text x="368" y="195" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">S</text>
  <!-- GND -->
  <line x1="332" y1="210" x2="368" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <line x1="338" y1="216" x2="362" y2="216" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="344" y1="222" x2="356" y2="222" stroke="#94a3b8" stroke-width="1"/>

  <!-- Output at drain (coupling cap → out) -->
  <line x1="350" y1="88" x2="430" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <line x1="430" y1="76" x2="430" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="440" y1="76" x2="440" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="440" y1="88" x2="500" y2="88" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="500" cy="88" r="3" fill="#06b6d4"/>
  <text x="512" y="92" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">RF out</text>

  <!-- Input coupling cap on G1 -->
  <line x1="100" y1="155" x2="130" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="143" x2="130" y2="167" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="140" y1="143" x2="140" y2="167" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="140" y1="155" x2="200" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="100" cy="155" r="3" fill="#94a3b8"/>
  <text x="88" y="159" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8" text-anchor="end">in</text>

  <!-- AGC DC bias label -->
  <text x="110" y="128" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="middle">V_AGC</text>
  <text x="110" y="143" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">controls gain</text>

  <!-- Advantage label -->
  <text x="490" y="155" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">Low noise</text>
  <text x="490" y="170" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">electronically</text>
  <text x="490" y="185" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">variable gain</text>
  <text x="490" y="200" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">good isolation</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 5-27 — Dual-gate MOSFET: G1 = RF signal input, G2 = AGC voltage for electronically controlled gain</text>
</svg>
