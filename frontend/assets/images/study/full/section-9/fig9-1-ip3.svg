<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="Third-order intercept diagram">
<rect width="700" height="380" fill="#0a0e1a" rx="8"/>
<line x1="80" y1="320" x2="620" y2="320" stroke="#64748b" stroke-width="1.3"/>
<line x1="80" y1="320" x2="80" y2="40" stroke="#64748b" stroke-width="1.3"/>
<text x="350.0" y="350" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Input power (dBm)</text>
<text x="30" y="180.0" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Output power (dBm)</text>
<line x1="100" y1="300" x2="460" y2="60" stroke="#22c55e" stroke-width="2"/>
<line x1="460" y1="60" x2="610" y2="-10" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="310" y="220" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">fundamental (slope 1)</text>
<line x1="100" y1="316" x2="460" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
<line x1="100" y1="316" x2="200" y2="230" stroke="#ef4444" stroke-width="2"/>
<text x="260" y="290" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">3rd-order IMD (slope 3)</text>
<circle cx="460" cy="60" r="5" fill="#f59e0b"/><text x="460" y="46" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">IP3 (extrapolated)</text>
<line x1="80" y1="305" x2="620" y2="305" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="580" y="299" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">noise floor / MDS</text>
<line x1="120" y1="305" x2="120" y2="60" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3"/>
<text x="135" y="182.5" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#06b6d4" text-anchor="start">SFDR</text>
<text x="350.0" y="370" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 9.1 &#8212; IP3: fundamental (slope 1) and 3rd-order IMD (slope 3) extrapolate to the intercept point; SFDR spans MDS to where IMD meets the noise floor</text>
</svg>
