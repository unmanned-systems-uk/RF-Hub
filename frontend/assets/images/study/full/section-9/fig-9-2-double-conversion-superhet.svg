<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <rect width="800" height="220" fill="#0a0e1a" rx="8"/>

  <!-- Double-conversion superhet receiver -->
  <!-- Antenna → RF Filter → 1st Mixer → 1st IF (high) → 2nd Mixer → 2nd IF (low) → Demod → Audio -->
  <!-- 1st LO below 1st Mixer, 2nd LO (fixed) below 2nd Mixer -->

  <!-- Antenna symbol -->
  <line x1="22" y1="74" x2="22" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="12" y1="50" x2="32" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="15" y1="55" x2="29" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="18" y1="60" x2="26" y2="60" stroke="#94a3b8" stroke-width="1"/>
  <text x="22" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ANT</text>
  <line x1="22" y1="74" x2="50" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="47,70 47,78 54,74" fill="#94a3b8"/>

  <!-- RF Filter block -->
  <rect x="54" y="55" width="72" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="90" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">RF Filter</text>
  <text x="90" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">preselector</text>
  <line x1="126" y1="74" x2="144" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="141,70 141,78 148,74" fill="#94a3b8"/>

  <!-- 1st Mixer block -->
  <rect x="148" y="55" width="76" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="186" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">1st Mixer</text>
  <text x="186" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">RF → high IF</text>
  <text x="186" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">(e.g. 70 MHz)</text>
  <line x1="224" y1="74" x2="242" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="239,70 239,78 246,74" fill="#94a3b8"/>

  <!-- 1st IF block -->
  <rect x="246" y="55" width="86" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="289" y="70" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">1st IF Filter</text>
  <text x="289" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">high freq</text>
  <text x="289" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">image rejection</text>
  <line x1="332" y1="74" x2="350" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="347,70 347,78 354,74" fill="#94a3b8"/>

  <!-- 2nd Mixer block -->
  <rect x="354" y="55" width="76" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="392" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">2nd Mixer</text>
  <text x="392" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">high → low IF</text>
  <text x="392" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">(e.g. 455 kHz)</text>
  <line x1="430" y1="74" x2="448" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="445,70 445,78 452,74" fill="#94a3b8"/>

  <!-- 2nd IF block -->
  <rect x="452" y="55" width="86" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="495" y="70" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">2nd IF Filter</text>
  <text x="495" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">low freq</text>
  <text x="495" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">selectivity</text>
  <line x1="538" y1="74" x2="556" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="553,70 553,78 560,74" fill="#94a3b8"/>

  <!-- Demodulator block -->
  <rect x="560" y="55" width="80" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="600" y="72" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Demodulator</text>
  <text x="600" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">audio out</text>

  <!-- 1st LO block (below 1st Mixer) -->
  <rect x="148" y="135" width="76" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="186" y="152" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">1st LO</text>
  <text x="186" y="165" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">VFO / PLL</text>

  <!-- Arrow: 1st LO up to 1st Mixer -->
  <line x1="186" y1="135" x2="186" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="182,99 190,99 186,93" fill="#f59e0b"/>

  <!-- 2nd LO block (below 2nd Mixer) -->
  <rect x="354" y="135" width="76" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="392" y="151" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">2nd LO</text>
  <text x="392" y="163" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">fixed crystal</text>

  <!-- Arrow: 2nd LO up to 2nd Mixer -->
  <line x1="392" y1="135" x2="392" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="388,99 396,99 392,93" fill="#f59e0b"/>

  <!-- Benefit annotation -->
  <text x="635" y="140" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Benefits:</text>
  <text x="635" y="153" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">better image</text>
  <text x="635" y="165" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">rejection +</text>
  <text x="635" y="177" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">selectivity</text>

  <!-- Caption -->
  <text x="400" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 9-2 — Double-conversion superhet: high 1st IF rejects images; low 2nd IF provides sharp selectivity</text>
</svg>
