<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Two-panel comparison: Differential Mode vs Common Mode current flow -->

  <!-- Panel divider -->
  <line x1="300" y1="30" x2="300" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== LEFT PANEL: Differential Mode ===== -->
  <text x="150" y="48" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">Differential Mode</text>

  <!-- Conductor A (top, current right) -->
  <line x1="40" y1="95" x2="260" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Right-pointing arrows on A -->
  <polygon points="90,91 90,99 97,95" fill="#06b6d4"/>
  <polygon points="155,91 155,99 162,95" fill="#06b6d4"/>
  <polygon points="220,91 220,99 227,95" fill="#06b6d4"/>
  <text x="270" y="99" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4">→ I<tspan baseline-shift="sub" font-size="70%">DM</tspan></text>

  <!-- Conductor B (bottom, current LEFT) -->
  <line x1="40" y1="150" x2="260" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Left-pointing arrows on B -->
  <polygon points="80,146 80,154 73,150" fill="#f59e0b"/>
  <polygon points="145,146 145,154 138,150" fill="#f59e0b"/>
  <polygon points="210,146 210,154 203,150" fill="#f59e0b"/>
  <text x="270" y="154" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b">← I<tspan baseline-shift="sub" font-size="70%">DM</tspan></text>

  <!-- Conductor labels -->
  <text x="22" y="99" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">A</text>
  <text x="22" y="154" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B</text>

  <!-- Field cancellation symbol -->
  <text x="150" y="188" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">External fields oppose</text>
  <text x="150" y="202" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle">External field ≈ 0</text>
  <text x="150" y="216" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(fields cancel — no radiation)</text>

  <!-- ===== RIGHT PANEL: Common Mode ===== -->
  <text x="450" y="48" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="middle">Common Mode</text>

  <!-- Conductor A (top, current right) -->
  <line x1="320" y1="95" x2="540" y2="95" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Right-pointing arrows on A -->
  <polygon points="368,91 368,99 375,95" fill="#f59e0b"/>
  <polygon points="433,91 433,99 440,95" fill="#f59e0b"/>
  <polygon points="498,91 498,99 505,95" fill="#f59e0b"/>
  <text x="550" y="99" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b">→ I<tspan baseline-shift="sub" font-size="70%">CM</tspan></text>

  <!-- Conductor B (bottom, ALSO current right) -->
  <line x1="320" y1="150" x2="540" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Right-pointing arrows on B (SAME direction as A) -->
  <polygon points="368,146 368,154 375,150" fill="#f59e0b"/>
  <polygon points="433,146 433,154 440,150" fill="#f59e0b"/>
  <polygon points="498,146 498,154 505,150" fill="#f59e0b"/>
  <text x="550" y="154" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b">→ I<tspan baseline-shift="sub" font-size="70%">CM</tspan></text>

  <!-- Conductor labels -->
  <text x="306" y="99" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">A</text>
  <text x="306" y="154" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B</text>

  <!-- Field reinforcement symbol -->
  <text x="430" y="188" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">External fields reinforce</text>
  <text x="430" y="202" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">External field: LARGE</text>
  <text x="430" y="216" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(fields add — radiates RF)</text>

  <!-- Caption -->
  <text x="300" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 13-1 — DM currents oppose (fields cancel); CM currents are in-phase (fields add and radiate)</text>
</svg>
