<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Parallel-plate capacitor: two horizontal plates, field lines, charge labels -->

  <!-- Top plate (+Q) -->
  <rect x="80" y="80" width="440" height="16" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2" rx="2"/>
  <!-- Bottom plate (−Q) -->
  <rect x="80" y="184" width="440" height="16" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2" rx="2"/>

  <!-- Charge symbols on top plate (positive) -->
  <text x="130" y="93" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+</text>
  <text x="200" y="93" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+</text>
  <text x="270" y="93" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+</text>
  <text x="340" y="93" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+</text>
  <text x="410" y="93" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+</text>
  <text x="480" y="93" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+</text>

  <!-- Charge symbols on bottom plate (negative) -->
  <text x="130" y="198" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">−</text>
  <text x="200" y="198" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">−</text>
  <text x="270" y="198" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">−</text>
  <text x="340" y="198" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">−</text>
  <text x="410" y="198" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">−</text>
  <text x="480" y="198" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle">−</text>

  <!-- Dielectric region label -->
  <text x="60" y="143" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">ε</text>

  <!-- Electric field lines (arrows pointing downward from + to −) -->
  <defs>
    <marker id="ef" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>
  <line x1="160" y1="100" x2="160" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ef)"/>
  <line x1="230" y1="100" x2="230" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ef)"/>
  <line x1="300" y1="100" x2="300" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ef)"/>
  <line x1="370" y1="100" x2="370" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ef)"/>
  <line x1="440" y1="100" x2="440" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#ef)"/>

  <!-- E field label -->
  <text x="520" y="143" font-family="IBM Plex Mono, monospace" font-size="13" fill="#475569" text-anchor="start">E↓</text>

  <!-- Plate labels -->
  <text x="55" y="92" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="end">+Q</text>
  <text x="55" y="197" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">−Q</text>

  <!-- Dimension d (plate separation) with double-arrow -->
  <line x1="552" y1="96" x2="552" y2="184" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="546" y1="96" x2="558" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="546" y1="184" x2="558" y2="184" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="570" y="143" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" font-style="italic">d</text>

  <!-- Capacitance formula -->
  <text x="300" y="232" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">C = ε₀ εᵣ A / d</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-5 — Parallel-plate capacitor: charges ±Q on plates, uniform E field, dielectric ε between</text>
</svg>
