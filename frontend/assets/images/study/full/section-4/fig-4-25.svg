<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Parallel resonant circuit schematic: L || C with R (coil resistance) in series with L -->
  <!-- Layout: top bus at y=70, bottom bus at y=210, three parallel branches -->
  <!-- Branch 1 (left): input terminals -->
  <!-- Branch 2 (middle): inductor L in series with coil resistance r -->
  <!-- Branch 3 (right): capacitor C -->

  <!-- Input terminals on left -->
  <line x1="70" y1="70" x2="145" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="210" x2="145" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="70" cy="70" r="4" fill="#94a3b8"/>
  <circle cx="70" cy="210" r="4" fill="#94a3b8"/>

  <!-- Top bus -->
  <line x1="145" y1="70" x2="460" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom bus -->
  <line x1="145" y1="210" x2="460" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- Branch: Inductor L + coil resistance r (left-centre branch) -->
  <!-- From top bus (240,70) down to bottom bus (240,210) -->
  <line x1="240" y1="70" x2="240" y2="95" stroke="#94a3b8" stroke-width="2"/>
  <!-- r (coil resistance): small IEC rect -->
  <rect x="228" y="95" width="24" height="38" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="262" y="118" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8" font-style="italic">r</text>
  <line x1="240" y1="133" x2="240" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <!-- Inductor L: bumps -->
  <path d="M240,175 Q248,155 256,175 Q264,155 272,175 Q280,155 288,175 Q296,155 304,175 Q312,155 320,175 Q328,155 336,175"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Inductor wires: adjust to fit the bumps - bumps span x=240 to x=336 -->
  <!-- Actually: the bumps path starts at (240,175) and ends at (336,175). We need wires above and below. -->
  <!-- Wire from r to inductor top -->
  <line x1="240" y1="145" x2="240" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- Inductor bottom to bus -->
  <line x1="240" y1="175" x2="240" y2="185" stroke="#94a3b8" stroke-width="2"/>
  <!-- Hmm the inductor bumps go right from 240 to 336. This is a horizontal inductor. I need a vertical inductor. -->
  <!-- Let me redo with a vertical inductor: bumps arching to the right of the vertical wire -->
  <!-- Vertical coil: series of arcs arching to the right, starting at (240,145) going down to (240,200) -->
  <!-- 4 arcs, each 14px high: -->

  <!-- Let me redo the inductor as vertical bumps arching to the right -->
  <!-- Path: M x,y1 Q x+bump,y1+7 x,y1+14 Q x+bump,y1+21 x,y1+28 ... -->
  <!-- Use x=240 as the center line, bumps arc to x=268 -->

  <!-- Actually, let me just use a simple inductor symbol that works well: -->
  <!-- Clear the previous inductor and draw a proper vertical one -->

  <!-- Vertical inductor: series of connected semicircles arching to the right -->
  <!-- From y=143 to y=200, 4 bumps of 14px each = 56px total -->
  <path d="M 240,143 Q 258,150 240,157 Q 258,164 240,171 Q 258,178 240,185 Q 258,192 240,199"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="240" y1="199" x2="240" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <!-- L label -->
  <text x="270" y="175" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" font-style="italic">L</text>

  <!-- Branch: Capacitor C (right-centre branch) -->
  <line x1="370" y1="70" x2="370" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <!-- Capacitor plates (horizontal) -->
  <line x1="344" y1="130" x2="396" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="344" y1="142" x2="396" y2="142" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="370" y1="142" x2="370" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <!-- C label -->
  <text x="405" y="140" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" font-style="italic">C</text>

  <!-- Input terminal labels -->
  <text x="52" y="74" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="end">+</text>
  <text x="52" y="214" font-family="IBM Plex Mono, monospace" font-size="13" fill="#94a3b8" text-anchor="end">−</text>

  <!-- Dynamic resistance annotation -->
  <text x="300" y="240" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">At f<tspan baseline-shift="sub" font-size="70%">r</tspan>: Z = L/(Cr) = Q²r = R<tspan baseline-shift="sub" font-size="70%">dyn</tspan></text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-25 — Parallel resonant circuit: L (with coil loss r) in parallel with C; high impedance at f<tspan baseline-shift="sub" font-size="70%">r</tspan></text>
</svg>
