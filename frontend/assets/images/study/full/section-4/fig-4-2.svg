<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Panel dividers -->
  <line x1="200" y1="15" x2="200" y2="258" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="15" x2="400" y2="258" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === PANEL A: SERIES === -->
  <text x="100" y="32" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle" letter-spacing="1">SERIES</text>
  <!-- horizontal chain at y=80 -->
  <line x1="20" y1="80" x2="42" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <!-- R1 -->
  <rect x="42" y="71" width="50" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="67" y="62" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">R₁</text>
  <!-- wire between R1 and R2 -->
  <line x1="92" y1="80" x2="108" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <!-- R2 -->
  <rect x="108" y="71" width="50" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="133" y="62" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">R₂</text>
  <line x1="158" y1="80" x2="180" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <!-- terminal dots -->
  <circle cx="20" cy="80" r="3" fill="#94a3b8"/>
  <circle cx="180" cy="80" r="3" fill="#94a3b8"/>
  <!-- formula -->
  <text x="100" y="108" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">R = R₁ + R₂</text>

  <!-- === PANEL B: PARALLEL === -->
  <text x="300" y="32" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle" letter-spacing="1">PARALLEL</text>
  <!-- left bus and right bus -->
  <line x1="215" y1="120" x2="235" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="365" y1="120" x2="385" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <!-- vertical junction lines -->
  <line x1="235" y1="90" x2="235" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="365" y1="90" x2="365" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <!-- top branch (R1) -->
  <line x1="235" y1="90" x2="255" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <rect x="255" y="81" width="50" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="280" y="72" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">R₁</text>
  <line x1="305" y1="90" x2="365" y2="90" stroke="#94a3b8" stroke-width="2"/>
  <!-- bottom branch (R2) -->
  <line x1="235" y1="150" x2="255" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <rect x="255" y="141" width="50" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="280" y="172" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">R₂</text>
  <line x1="305" y1="150" x2="365" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <!-- terminal dots -->
  <circle cx="215" cy="120" r="3" fill="#94a3b8"/>
  <circle cx="385" cy="120" r="3" fill="#94a3b8"/>
  <!-- formula -->
  <text x="300" y="200" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">1/R = 1/R₁ + 1/R₂</text>

  <!-- === PANEL C: POTENTIAL DIVIDER === -->
  <text x="500" y="32" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle" letter-spacing="1">VOLTAGE DIVIDER</text>
  <!-- Vin terminal -->
  <circle cx="500" cy="50" r="3" fill="#06b6d4"/>
  <text x="485" y="54" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">V_in</text>
  <!-- wire to R1 -->
  <line x1="500" y1="50" x2="500" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- R1 vertical -->
  <rect x="489" y="75" width="22" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="520" y="103" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R₁</text>
  <!-- wire from R1 to junction -->
  <line x1="500" y1="125" x2="500" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <!-- Vout node -->
  <circle cx="500" cy="150" r="3.5" fill="#06b6d4"/>
  <!-- Vout tap wire and label -->
  <line x1="500" y1="150" x2="548" y2="150" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="553" y="154" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">V_out</text>
  <!-- wire from junction to R2 -->
  <line x1="500" y1="150" x2="500" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <!-- R2 vertical -->
  <rect x="489" y="175" width="22" height="50" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="520" y="203" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">R₂</text>
  <!-- wire to GND -->
  <line x1="500" y1="225" x2="500" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="482" y1="245" x2="518" y2="245" stroke="#94a3b8" stroke-width="2"/>
  <line x1="488" y1="251" x2="512" y2="251" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="494" y1="257" x2="506" y2="257" stroke="#94a3b8" stroke-width="1"/>
  <!-- Vout formula -->
  <text x="300" y="230" font-family="IBM Plex Mono, monospace" font-size="10" fill="#64748b" text-anchor="middle">V_out = V_in × R₂/(R₁+R₂)</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-2 — Series and parallel resistor combinations; voltage (potential) divider</text>
</svg>
