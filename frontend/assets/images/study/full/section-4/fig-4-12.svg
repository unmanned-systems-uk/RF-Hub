<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Current-carrying wire cross-section with concentric magnetic field rings -->
  <!-- Wire at centre (300, 135) — dot showing current OUT of page -->

  <!-- Concentric field rings (CCW for current out of page) -->
  <!-- Ring r=45 -->
  <circle cx="300" cy="135" r="45" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Ring r=80 -->
  <circle cx="300" cy="135" r="80" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Ring r=115 -->
  <circle cx="300" cy="135" r="115" fill="none" stroke="#2d3a4a" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Arrow on r=45 ring (at top, pointing left = CCW) -->
  <defs>
    <marker id="ccw" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="ccwc" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#06b6d4"/>
    </marker>
  </defs>
  <!-- Arrow at top of r=45 ring (pointing left, i.e., west at 12 o'clock) -->
  <line x1="310" y1="90" x2="292" y2="90" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ccw)"/>
  <!-- Arrow at bottom of r=45 ring (pointing right, east at 6 o'clock) -->
  <line x1="290" y1="180" x2="308" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ccw)"/>

  <!-- Arrows on r=80 ring -->
  <line x1="310" y1="55" x2="292" y2="55" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ccw)"/>
  <line x1="290" y1="215" x2="308" y2="215" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ccw)"/>

  <!-- B field labels on rings -->
  <text x="352" y="110" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8">B</text>
  <text x="388" y="80" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b">B</text>

  <!-- Wire cross-section circle -->
  <circle cx="300" cy="135" r="20" fill="#0d1321" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Dot (current coming out of page) -->
  <circle cx="300" cy="135" r="5" fill="#06b6d4"/>

  <!-- Current label -->
  <text x="300" y="168" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4" text-anchor="middle">I (out)</text>

  <!-- Right-hand rule annotation -->
  <text x="520" y="100" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Right-hand</text>
  <text x="520" y="114" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">rule: thumb →</text>
  <text x="520" y="128" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">current; fingers</text>
  <text x="520" y="142" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">curl → field</text>

  <!-- B ∝ 1/r note -->
  <text x="80" y="100" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">B ∝ I/r</text>
  <text x="80" y="116" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">weaker</text>
  <text x="80" y="130" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">with</text>
  <text x="80" y="144" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">distance</text>

  <!-- CCW direction label -->
  <text x="300" y="26" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Magnetic field circulates anti-clockwise around the wire</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-12 — Cross-section of conductor carrying current I; concentric magnetic field rings (right-hand rule)</text>
</svg>
