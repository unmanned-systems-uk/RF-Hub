<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <marker id="flux" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
    <marker id="fluxgrey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Solenoid side view: coil from x=130 to x=470, centred at y=135 -->
  <!-- Coil outline box -->
  <rect x="130" y="105" width="340" height="60" fill="none" stroke="#334155" stroke-width="1" rx="4"/>

  <!-- Inductor coil symbol: bumps above the axis (front turns) -->
  <!-- 8 bumps from x=130 to x=470: bump width = 340/8 = 42.5px -->
  <!-- Each bump: Q bezier from (x,135) peak at (x+21,98) to (x+42,135) -->
  <path d="M130,135 Q151,92 172,135 Q193,92 214,135 Q235,92 256,135 Q277,92 298,135 Q319,92 340,135 Q361,92 382,135 Q403,92 424,135 Q445,92 466,135"
    fill="none" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round"/>

  <!-- Axis line through coil -->
  <line x1="75" y1="135" x2="525" y2="135" stroke="#334155" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Flux lines inside solenoid: arrows pointing right (left→right = N on right) -->
  <line x1="145" y1="120" x2="440" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fluxgrey)"/>
  <line x1="145" y1="135" x2="440" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fluxgrey)"/>
  <line x1="145" y1="150" x2="440" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fluxgrey)"/>

  <!-- External flux: loop over top from N(right) back to S(left) -->
  <!-- Top loop: arc from (470,135) up and over to (130,135) -->
  <path d="M 470,135 C 490,95 490,40 300,35 C 110,40 110,95 130,135"
    fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Arrow at the end of top loop (arriving at left=S end) -->
  <line x1="142" y1="136" x2="132" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fluxgrey)"/>

  <!-- Bottom loop -->
  <path d="M 470,135 C 490,175 490,230 300,235 C 110,230 110,175 130,135"
    fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- N and S pole labels -->
  <text x="490" y="140" font-family="IBM Plex Mono, monospace" font-size="18" fill="#06b6d4" font-weight="bold">N</text>
  <text x="98" y="140" font-family="IBM Plex Mono, monospace" font-size="18" fill="#e2e8f0" font-weight="bold">S</text>

  <!-- Current direction labels on coil (I_in on left, I_out on right) -->
  <text x="130" y="186" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">I in</text>
  <text x="470" y="186" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">I out</text>

  <!-- Wire connections (leads) -->
  <line x1="80" y1="135" x2="130" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <line x1="466" y1="135" x2="520" y2="135" stroke="#94a3b8" stroke-width="2"/>

  <!-- Label -->
  <text x="300" y="262" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">B = μ₀μᵣ N I / l   (uniform inside, loops outside)</text>

  <!-- Caption -->
  <text x="300" y="275" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-13 — Solenoid inductor: current produces axial magnetic field; flux loops outside</text>
</svg>
