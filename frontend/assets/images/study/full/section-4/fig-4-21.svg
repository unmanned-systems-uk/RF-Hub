<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <marker id="pR3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="pL3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="pC3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="pS3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#e2e8f0"/>
    </marker>
    <marker id="pNet" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- RLC series phasor: V_L upward, V_C downward (partial cancellation, V_L > V_C shown) -->
  <!-- Origin at (160, 185) -->
  <!-- V_R: right (160px), V_L: up from tip of V_R (130px), V_C: down from tip of V_R (80px) -->
  <!-- Net reactive = V_L - V_C = 50px upward from tip of V_R -->
  <!-- V_S: from origin to final tip -->

  <!-- Reference axes -->
  <line x1="80" y1="185" x2="420" y2="185" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="160" y1="240" x2="160" y2="30" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- V_R: horizontal, length=160px: (160,185) to (320,185) -->
  <line x1="160" y1="185" x2="313" y2="185" stroke="#06b6d4" stroke-width="3" marker-end="url(#pR3)"/>
  <text x="240" y="202" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">R</tspan></text>

  <!-- V_L: upward from (320,185) to (320,55), length=130px -->
  <line x1="320" y1="185" x2="320" y2="61" stroke="#f59e0b" stroke-width="3" marker-end="url(#pL3)"/>
  <text x="345" y="118" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b">V<tspan baseline-shift="sub" font-size="70%">L</tspan></text>

  <!-- V_C: downward from (320,185) to (320,265→280 capped), length=80px: (320,185) to (320,265) -->
  <line x1="320" y1="185" x2="320" y2="258" stroke="#94a3b8" stroke-width="3" marker-end="url(#pC3)"/>
  <text x="340" y="240" font-family="IBM Plex Mono, monospace" font-size="13" fill="#94a3b8">V<tspan baseline-shift="sub" font-size="70%">C</tspan></text>

  <!-- Net reactive vector V_L−V_C: upward 50px from (320,185) to (320,135), shown in green -->
  <!-- This is already visible as the gap between V_C tip and V_L tip -->
  <!-- Brace showing net = V_L − V_C -->
  <line x1="355" y1="55" x2="355" y2="265" stroke="#10b981" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="350" y1="55" x2="360" y2="55" stroke="#10b981" stroke-width="1.5"/>
  <line x1="350" y1="265" x2="360" y2="265" stroke="#10b981" stroke-width="1.5"/>
  <line x1="350" y1="185" x2="360" y2="185" stroke="#10b981" stroke-width="1.5"/>
  <text x="372" y="112" font-family="IBM Plex Mono, monospace" font-size="11" fill="#10b981">V<tspan baseline-shift="sub" font-size="70%">L</tspan>−V<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
  <text x="372" y="127" font-family="IBM Plex Mono, monospace" font-size="11" fill="#10b981">(net X)</text>

  <!-- V_S: from origin (160,185) to (320,55), the resultant -->
  <line x1="160" y1="185" x2="313" y2="61" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#pS3)"/>
  <text x="215" y="105" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">S</tspan></text>

  <!-- Right-angle marker at (320,185) for V_L-->
  <path d="M 305,185 L 305,170 L 320,170" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Phase angle label -->
  <path d="M 210,185 A 50,50 0 0,0 193,160" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="222" y="168" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">φ</text>

  <!-- Caption annotation: above resonance (X_L > X_C), inductive behaviour -->
  <text x="80" y="58" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#f59e0b">Above resonance:</text>
  <text x="80" y="72" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#f59e0b">X<tspan baseline-shift="sub" font-size="70%">L</tspan> &gt; X<tspan baseline-shift="sub" font-size="70%">C</tspan>,</text>
  <text x="80" y="86" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#f59e0b">net inductive</text>

  <!-- Formula -->
  <text x="80" y="240" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0">|Z| = √(R²+(X<tspan baseline-shift="sub" font-size="70%">L</tspan>−X<tspan baseline-shift="sub" font-size="70%">C</tspan>)²)</text>

  <!-- Caption -->
  <text x="300" y="275" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-21 — RLC series phasor: V<tspan baseline-shift="sub" font-size="70%">L</tspan> (up) and V<tspan baseline-shift="sub" font-size="70%">C</tspan> (down) partially cancel; net reactive = V<tspan baseline-shift="sub" font-size="70%">L</tspan> − V<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
</svg>
