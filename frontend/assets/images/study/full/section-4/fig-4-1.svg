<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Circuit loop corners: TL(155,75) TR(445,75) BR(445,205) BL(155,205) -->
  <!-- Top wire left of resistor -->
  <line x1="155" y1="75" x2="255" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- Top wire right of resistor -->
  <line x1="345" y1="75" x2="445" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- Right wire -->
  <line x1="445" y1="75" x2="445" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="155" y1="205" x2="445" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left wire above battery -->
  <line x1="155" y1="75" x2="155" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left wire below battery -->
  <line x1="155" y1="160" x2="155" y2="205" stroke="#94a3b8" stroke-width="2"/>

  <!-- Battery: long line = positive terminal (top) -->
  <line x1="130" y1="120" x2="180" y2="120" stroke="#e2e8f0" stroke-width="3.5"/>
  <!-- Battery: short line = negative terminal (bottom) -->
  <line x1="140" y1="160" x2="170" y2="160" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- + / − symbols beside battery -->
  <text x="188" y="124" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4">+</text>
  <text x="188" y="165" font-family="IBM Plex Mono, monospace" font-size="14" fill="#94a3b8">−</text>

  <!-- Voltage source label -->
  <text x="108" y="144" font-family="IBM Plex Mono, monospace" font-size="20" fill="#e2e8f0" text-anchor="middle" font-style="italic">V</text>

  <!-- Resistor IEC rectangle (horizontal) -->
  <rect x="255" y="65" width="90" height="20" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <!-- Resistor label -->
  <text x="300" y="56" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-style="italic">R</text>

  <!-- Current direction arrow on right wire -->
  <line x1="445" y1="128" x2="445" y2="154" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="460" y="147" font-family="IBM Plex Mono, monospace" font-size="16" fill="#06b6d4" font-style="italic">I</text>

  <!-- Ohm's law annotation -->
  <text x="300" y="178" font-family="IBM Plex Mono, monospace" font-size="13" fill="#64748b" text-anchor="middle">I = V / R</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-1 — Voltage source V drives current I through resistive load R</text>
</svg>
