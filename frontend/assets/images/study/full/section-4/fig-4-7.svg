<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Capacitors in parallel: 3 capacitors between top and bottom bus -->
  <!-- Top bus: y=70, Bottom bus: y=200, x from 80 to 520 -->

  <!-- Top bus -->
  <line x1="80" y1="70" x2="520" y2="70" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Bottom bus -->
  <line x1="80" y1="200" x2="520" y2="200" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Terminal connections (left) -->
  <line x1="80" y1="70" x2="50" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="200" x2="50" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="50" cy="70" r="3" fill="#94a3b8"/>
  <circle cx="50" cy="200" r="3" fill="#94a3b8"/>
  <!-- Terminal connections (right) -->
  <line x1="520" y1="70" x2="550" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <line x1="520" y1="200" x2="550" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="550" cy="70" r="3" fill="#94a3b8"/>
  <circle cx="550" cy="200" r="3" fill="#94a3b8"/>

  <!-- C1 at x=160 -->
  <line x1="160" y1="70" x2="160" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="136" y1="120" x2="184" y2="120" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="136" y1="130" x2="184" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="160" y1="130" x2="160" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="194" y="128" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">C₁</text>

  <!-- C2 at x=300 -->
  <line x1="300" y1="70" x2="300" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="276" y1="120" x2="324" y2="120" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="276" y1="130" x2="324" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="300" y1="130" x2="300" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="334" y="128" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">C₂</text>

  <!-- C3 at x=440 -->
  <line x1="440" y1="70" x2="440" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <line x1="416" y1="120" x2="464" y2="120" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="416" y1="130" x2="464" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="440" y1="130" x2="440" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="474" y="128" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">C₃</text>

  <!-- Bus polarity labels -->
  <text x="30" y="66" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="end">+</text>
  <text x="30" y="204" font-family="IBM Plex Mono, monospace" font-size="14" fill="#94a3b8" text-anchor="end">−</text>

  <!-- Result formula -->
  <text x="300" y="230" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">C<tspan baseline-shift="sub" font-size="70%">T</tspan> = C₁ + C₂ + C₃</text>
  <text x="300" y="248" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Parallel combination — total capacitance increases</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-7 — Capacitors in parallel share the same voltage; total capacitance adds directly</text>
</svg>
