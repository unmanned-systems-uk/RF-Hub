<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Crystal equivalent circuit: C₀ parallel with series branch (L_m, C_m, R_s) -->
  <!-- Two terminal connections at top and bottom of the component -->
  <!-- Layout: vertical two-port. Terminal 1 at top (x=300,y=35), Terminal 2 at bottom (x=300,y=245) -->

  <!-- Terminal wires -->
  <line x1="300" y1="35" x2="300" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="225" x2="300" y2="245" stroke="#94a3b8" stroke-width="2"/>

  <!-- Left junction (top) -->
  <line x1="300" y1="55" x2="175" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="55" x2="425" y2="55" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left junction (bottom) -->
  <line x1="300" y1="225" x2="175" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300" y1="225" x2="425" y2="225" stroke="#94a3b8" stroke-width="2"/>

  <!-- Junction dots -->
  <circle cx="300" cy="55" r="3.5" fill="#94a3b8"/>
  <circle cx="300" cy="225" r="3.5" fill="#94a3b8"/>

  <!-- === LEFT BRANCH: C₀ (static / plate capacitance) === -->
  <!-- Vertical wire from (175,55) down to C₀ plates, then to (175,225) -->
  <line x1="175" y1="55" x2="175" y2="115" stroke="#94a3b8" stroke-width="2"/>
  <!-- C₀ plates (horizontal) -->
  <line x1="149" y1="115" x2="201" y2="115" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="149" y1="127" x2="201" y2="127" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="175" y1="127" x2="175" y2="225" stroke="#94a3b8" stroke-width="2"/>
  <!-- C₀ label -->
  <text x="100" y="124" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">C₀</text>
  <text x="100" y="140" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="end">static</text>
  <text x="100" y="153" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="end">3–7 pF</text>

  <!-- === RIGHT BRANCH: Motional arm (L_m in series with C_m in series with R_s) === -->
  <!-- From (425,55) down through L_m, C_m, R_s to (425,225) -->
  <line x1="425" y1="55" x2="425" y2="85" stroke="#94a3b8" stroke-width="2"/>

  <!-- R_s (series loss resistance): vertical IEC rect -->
  <rect x="413" y="85" width="24" height="32" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="460" y="104" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8">R<tspan baseline-shift="sub" font-size="70%">s</tspan></text>
  <text x="460" y="117" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">5–50 Ω</text>
  <line x1="425" y1="117" x2="425" y2="135" stroke="#94a3b8" stroke-width="2"/>

  <!-- C_m (motional capacitance): vertical capacitor plates -->
  <line x1="399" y1="135" x2="451" y2="135" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="399" y1="147" x2="451" y2="147" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="460" y="144" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0">C<tspan baseline-shift="sub" font-size="70%">m</tspan></text>
  <text x="460" y="157" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">10–30 fF</text>
  <line x1="425" y1="147" x2="425" y2="165" stroke="#94a3b8" stroke-width="2"/>

  <!-- L_m (motional inductance): vertical bumps arching right -->
  <path d="M 425,165 Q 443,172 425,179 Q 443,186 425,193 Q 443,200 425,207"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="460" y="187" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">L<tspan baseline-shift="sub" font-size="70%">m</tspan></text>
  <text x="460" y="200" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b">10–100 mH</text>
  <line x1="425" y1="207" x2="425" y2="225" stroke="#94a3b8" stroke-width="2"/>

  <!-- Motional arm label -->
  <rect x="400" y="80" width="90" height="153" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" rx="4"/>
  <text x="445" y="250" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Motional arm</text>

  <!-- Terminal labels -->
  <circle cx="300" cy="35" r="4" fill="#94a3b8"/>
  <circle cx="300" cy="245" r="4" fill="#94a3b8"/>

  <!-- f_s and f_p labels -->
  <text x="300" y="26" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Crystal two-terminal equivalent circuit (Butterworth–Van Dyke model)</text>

  <!-- Frequency formulae -->
  <text x="90" y="178" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="start">f<tspan baseline-shift="sub" font-size="70%">s</tspan> = 1/(2π√(L<tspan baseline-shift="sub" font-size="70%">m</tspan> C<tspan baseline-shift="sub" font-size="70%">m</tspan>))</text>
  <text x="90" y="196" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="start">f<tspan baseline-shift="sub" font-size="70%">p</tspan> ≈ f<tspan baseline-shift="sub" font-size="70%">s</tspan> √(1+C<tspan baseline-shift="sub" font-size="70%">m</tspan>/C₀)</text>
  <text x="90" y="214" font-family="IBM Plex Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="start">Q = 2πf<tspan baseline-shift="sub" font-size="70%">s</tspan> L<tspan baseline-shift="sub" font-size="70%">m</tspan> / R<tspan baseline-shift="sub" font-size="70%">s</tspan></text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-29 — Crystal equivalent circuit: static C₀ in parallel with motional arm (L<tspan baseline-shift="sub" font-size="70%">m</tspan>, C<tspan baseline-shift="sub" font-size="70%">m</tspan>, R<tspan baseline-shift="sub" font-size="70%">s</tspan>)</text>
</svg>
