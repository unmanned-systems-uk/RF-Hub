<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Transformer: primary winding, core, secondary winding, load R_L -->
  <!-- Centred at y=140. Primary on left, core in middle, secondary on right. -->

  <!-- Core (two parallel vertical lines) -->
  <line x1="285" y1="65" x2="285" y2="215" stroke="#94a3b8" stroke-width="3"/>
  <line x1="315" y1="65" x2="315" y2="215" stroke="#94a3b8" stroke-width="3"/>

  <!-- Primary winding: bumps arching LEFT from x=285, from y=80 to y=200 -->
  <!-- 5 bumps, each 24px -->
  <path d="M 285,80 Q 265,92 285,104 Q 265,116 285,128 Q 265,140 285,152 Q 265,164 285,176 Q 265,188 285,200"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Primary leads -->
  <line x1="285" y1="80" x2="180" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <line x1="285" y1="200" x2="180" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="80" x2="180" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <!-- Primary source: battery symbol -->
  <line x1="155" y1="128" x2="205" y2="128" stroke="#e2e8f0" stroke-width="3.5"/>
  <line x1="165" y1="152" x2="195" y2="152" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="180" y1="80" x2="180" y2="128" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="152" x2="180" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="143" font-family="IBM Plex Mono, monospace" font-size="16" fill="#e2e8f0" text-anchor="middle" font-style="italic">V₁</text>
  <text x="212" y="132" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">+</text>
  <text x="212" y="157" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a3b8">−</text>

  <!-- Secondary winding: bumps arching RIGHT from x=315, from y=80 to y=200 -->
  <path d="M 315,80 Q 335,92 315,104 Q 335,116 315,128 Q 335,140 315,152 Q 335,164 315,176 Q 335,188 315,200"
    fill="none" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- Secondary leads -->
  <line x1="315" y1="80" x2="420" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <line x1="315" y1="200" x2="420" y2="200" stroke="#94a3b8" stroke-width="2"/>

  <!-- Load R_L on secondary -->
  <rect x="420" y="118" width="24" height="44" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <line x1="420" y1="80" x2="432" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <line x1="432" y1="80" x2="432" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <line x1="432" y1="162" x2="432" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="432" y1="200" x2="420" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <text x="455" y="143" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" font-style="italic">R<tspan baseline-shift="sub" font-size="70%">L</tspan></text>
  <!-- V2 across load -->
  <text x="490" y="140" font-family="IBM Plex Mono, monospace" font-size="15" fill="#e2e8f0" font-style="italic">V₂</text>

  <!-- Turns labels -->
  <text x="248" y="248" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="middle">N₁ turns</text>
  <text x="352" y="248" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">N₂ turns</text>

  <!-- Transformer equations -->
  <text x="300" y="35" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">V₂/V₁ = N₂/N₁     I₁/I₂ = N₂/N₁     Z₁/Z₂ = (N₁/N₂)²</text>

  <!-- Dot notation (polarity dots) -->
  <circle cx="278" cy="86" r="4" fill="#06b6d4"/>
  <circle cx="322" cy="86" r="4" fill="#e2e8f0"/>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-28 — Transformer: primary N₁ and secondary N₂ windings on shared core; voltage and impedance ratio</text>
</svg>
