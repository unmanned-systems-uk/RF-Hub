<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Bandwidth response curve with f_1, f_2 at -3dB, f_r at peak -->
  <!-- Chart: x=70-545, y=25-220 -->

  <line x1="70" y1="220" x2="548" y2="220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="220" x2="70" y2="22" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="545,217 545,223 553,220" fill="#94a3b8"/>
  <polygon points="67,22 73,22 70,14" fill="#94a3b8"/>

  <text x="556" y="224" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">f</text>
  <text x="63" y="18" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="end">|A|</text>
  <text x="63" y="32" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="end">(or |Z|)</text>

  <!-- Bell-shaped response curve (similar to parallel resonance or bandpass response) -->
  <!-- Peak at x=307 (f_r), y=35 (top of chart) -->
  <!-- -3dB points: amplitude drops to 0.707 of peak (power -3dB) -->
  <!-- 0.707 * (220-35) + 35 = 0.707 * 185 + 35 = 131 + 35 = 166 — no. -->
  <!-- Peak at y=35. -3dB means y_3dB = 35 + (220-35)*(1-0.707) = 35 + 185*0.293 = 35+54 = 89 -->
  <!-- Hmm: at peak y=35, floor y=220. -3dB means amplitude at 0.707 of peak. -->
  <!-- If peak amplitude = 1, then 0.707 at f_1 and f_2. -->
  <!-- y=35: amplitude=1 (peak). y=220: amplitude=0 (floor). Scale: 185px per unit amplitude. -->
  <!-- 0.707 amplitude → y = 220 - 0.707*185 = 220-131=89 → y=89 for -3dB points -->
  <!-- -3dB level is at y=89 -->

  <!-- Response curve: starts near floor, rises sharply to peak, falls sharply -->
  <!-- f_1 at x=250 (BW left edge), f_2 at x=364 (BW right edge), f_r at x=307 -->
  <!-- Beyond BW edges, curve continues at low level -->
  <path d="M 70,218 C 100,217 140,215 185,210 C 220,204 238,185 250,89 C 262,40 295,35 307,35 C 319,35 352,40 364,89 C 376,185 390,204 420,210 C 460,215 500,217 545,218"
    fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Peak marker at f_r -->
  <circle cx="307" cy="35" r="4" fill="#06b6d4"/>
  <line x1="307" y1="35" x2="307" y2="220" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="307" y="238" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">f<tspan baseline-shift="sub" font-size="70%">r</tspan></text>

  <!-- -3dB level horizontal line -->
  <line x1="70" y1="89" x2="545" y2="89" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="63" y="93" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b" text-anchor="end">−3dB</text>
  <text x="63" y="105" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="end">(0.707)</text>

  <!-- f_1 marker -->
  <circle cx="250" cy="89" r="4" fill="#f59e0b"/>
  <line x1="250" y1="89" x2="250" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="250" y="238" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b" text-anchor="middle">f₁</text>

  <!-- f_2 marker -->
  <circle cx="364" cy="89" r="4" fill="#f59e0b"/>
  <line x1="364" y1="89" x2="364" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="364" y="238" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f59e0b" text-anchor="middle">f₂</text>

  <!-- Bandwidth arrow -->
  <defs>
    <marker id="bw1" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f59e0b"/>
    </marker>
    <marker id="bw2" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f59e0b"/>
    </marker>
  </defs>
  <line x1="250" y1="255" x2="364" y2="255" stroke="#f59e0b" stroke-width="2" marker-end="url(#bw1)" marker-start="url(#bw2)"/>
  <text x="307" y="270" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f59e0b" text-anchor="middle">BW = f₂ − f₁</text>

  <!-- Q annotation -->
  <text x="450" y="135" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">Q = f<tspan baseline-shift="sub" font-size="70%">r</tspan> / BW</text>
  <text x="450" y="155" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Higher Q →</text>
  <text x="450" y="169" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">narrower BW,</text>
  <text x="450" y="183" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">sharper skirts</text>

  <!-- Caption -->
  <text x="245" y="275" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Fig 4-26 — Bandwidth: response falls to −3 dB (0.707 of peak) at f₁ and f₂; BW = f₂ − f₁; Q = f<tspan baseline-shift="sub" font-size="70%">r</tspan>/BW</text>
</svg>
