<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Capacitors in series: 3 capacitors in a horizontal line -->
  <!-- Horizontal axis at y=135 -->

  <!-- Left terminal -->
  <circle cx="50" cy="135" r="3" fill="#94a3b8"/>
  <line x1="50" y1="135" x2="80" y2="135" stroke="#94a3b8" stroke-width="2"/>

  <!-- Wire to C1 -->
  <line x1="80" y1="135" x2="130" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <!-- C1 plates (vertical) -->
  <line x1="130" y1="108" x2="130" y2="162" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="140" y1="108" x2="140" y2="162" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- Wire C1 to C2 -->
  <line x1="140" y1="135" x2="230" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <!-- C2 plates -->
  <line x1="230" y1="108" x2="230" y2="162" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="240" y1="108" x2="240" y2="162" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- Wire C2 to C3 -->
  <line x1="240" y1="135" x2="330" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <!-- C3 plates -->
  <line x1="330" y1="108" x2="330" y2="162" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="340" y1="108" x2="340" y2="162" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- Wire C3 to right terminal -->
  <line x1="340" y1="135" x2="370" y2="135" stroke="#94a3b8" stroke-width="2"/>

  <!-- Right terminal -->
  <circle cx="370" cy="135" r="3" fill="#94a3b8"/>

  <!-- Capacitor labels above -->
  <text x="135" y="96" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">C₁</text>
  <text x="235" y="96" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">C₂</text>
  <text x="335" y="96" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">C₃</text>

  <!-- Voltage labels below each capacitor -->
  <text x="135" y="180" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">V₁</text>
  <text x="235" y="180" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">V₂</text>
  <text x="335" y="180" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">V₃</text>

  <!-- Total voltage annotation -->
  <line x1="50" y1="192" x2="370" y2="192" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="188" x2="50" y2="196" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="370" y1="188" x2="370" y2="196" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="210" y="208" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">T</tspan> = V₁ + V₂ + V₃</text>

  <!-- Formula -->
  <text x="300" y="235" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">1/C<tspan baseline-shift="sub" font-size="70%">T</tspan> = 1/C₁ + 1/C₂ + 1/C₃</text>
  <text x="300" y="252" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Series combination — total capacitance decreases</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-8 — Capacitors in series carry the same charge Q; total capacitance is less than smallest</text>
</svg>
