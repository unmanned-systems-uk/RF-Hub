<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- RF inductor coil with adjustable ferrite slug -->
  <!-- Coil centred at y=135, x=150 to x=450 -->

  <!-- Wire leads -->
  <line x1="60" y1="135" x2="150" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <line x1="450" y1="135" x2="540" y2="135" stroke="#94a3b8" stroke-width="2"/>

  <!-- Coil symbol: bumps above axis (6 bumps) -->
  <!-- 6 bumps from x=150 to x=450: width=300, bump=50px -->
  <path d="M150,135 Q175,90 200,135 Q225,90 250,135 Q275,90 300,135 Q325,90 350,135 Q375,90 400,135 Q425,90 450,135"
    fill="none" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Coil body outline: dashed box suggesting toroid/wound core shape -->
  <rect x="148" y="112" width="304" height="46" fill="none" stroke="#334155" stroke-width="1.5" rx="4" stroke-dasharray="4,3"/>

  <!-- Ferrite slug: a filled rectangle partially inside the coil, with adjustment arrow -->
  <!-- Slug partially inserted from the left end -->
  <rect x="148" y="120" width="100" height="30" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
  <text x="198" y="140" font-family="IBM Plex Mono, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">SLUG</text>

  <!-- Ferrite slug material hatching lines -->
  <line x1="158" y1="120" x2="148" y2="130" stroke="#334155" stroke-width="1"/>
  <line x1="168" y1="120" x2="148" y2="140" stroke="#334155" stroke-width="1"/>
  <line x1="178" y1="120" x2="153" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="188" y1="120" x2="163" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="198" y1="120" x2="173" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="208" y1="120" x2="183" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="218" y1="120" x2="193" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="228" y1="120" x2="203" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="238" y1="120" x2="213" y2="150" stroke="#334155" stroke-width="1"/>
  <line x1="248" y1="120" x2="223" y2="150" stroke="#334155" stroke-width="1"/>

  <!-- Double-head arrow showing slug can be pushed in or pulled out -->
  <defs>
    <marker id="both" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#f59e0b"/>
    </marker>
    <marker id="both2" markerWidth="6" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
      <polygon points="0 0, 6 2.5, 0 5" fill="#f59e0b"/>
    </marker>
  </defs>
  <line x1="120" y1="170" x2="275" y2="170" stroke="#f59e0b" stroke-width="2" marker-end="url(#both)" marker-start="url(#both2)"/>
  <text x="197" y="188" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">Screwdriver adjustment</text>

  <!-- Effect labels -->
  <text x="100" y="215" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Slug in →</text>
  <text x="100" y="229" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">μ increases →</text>
  <text x="100" y="243" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">L increases →</text>
  <text x="100" y="257" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">f resonance ↓</text>

  <text x="450" y="215" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">← Slug out</text>
  <text x="450" y="229" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">← μ decreases</text>
  <text x="450" y="243" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">← L decreases</text>
  <text x="450" y="257" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">↑ f resonance</text>

  <!-- Caption -->
  <text x="300" y="275" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-14 — RF inductor with adjustable ferrite slug; inserting slug increases L, lowers resonant frequency</text>
</svg>
