<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Three capacitor types: Film | Ceramic Disc | Electrolytic -->
  <!-- Panel dividers -->
  <line x1="200" y1="20" x2="200" y2="255" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="20" x2="400" y2="255" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === FILM CAPACITOR (x=100) === -->
  <text x="100" y="38" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle" letter-spacing="1">FILM</text>
  <!-- Circuit symbol: two equal vertical lines -->
  <line x1="100" y1="75" x2="100" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="100" x2="120" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="80" y1="108" x2="120" y2="108" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="100" y1="108" x2="100" y2="133" stroke="#94a3b8" stroke-width="2"/>
  <!-- Body outline: small rectangular (axial film body) -->
  <rect x="55" y="150" width="90" height="35" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <!-- Lead wires from body -->
  <line x1="55" y1="167" x2="25" y2="167" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="145" y1="167" x2="175" y2="167" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Value label inside body -->
  <text x="100" y="172" font-family="IBM Plex Mono, monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">4n7</text>
  <!-- Type label below -->
  <text x="100" y="208" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Polyester/polypropylene</text>
  <text x="100" y="220" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Non-polarised · low loss</text>

  <!-- === CERAMIC DISC (x=300) === -->
  <text x="300" y="38" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle" letter-spacing="1">CERAMIC DISC</text>
  <!-- Circuit symbol: two equal vertical lines (same as film) -->
  <line x1="300" y1="75" x2="300" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="100" x2="320" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="280" y1="108" x2="320" y2="108" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="300" y1="108" x2="300" y2="133" stroke="#94a3b8" stroke-width="2"/>
  <!-- Body: ceramic disc shape (oval/circle) -->
  <ellipse cx="300" cy="165" rx="35" ry="20" fill="#0d1321" stroke="#94a3b8" stroke-width="2"/>
  <!-- Lead wires -->
  <line x1="265" y1="165" x2="230" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="335" y1="165" x2="370" y2="165" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Value -->
  <text x="300" y="169" font-family="IBM Plex Mono, monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">100p</text>
  <!-- Type label -->
  <text x="300" y="208" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Non-polarised</text>
  <text x="300" y="220" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">X7R / NP0 / C0G grades</text>

  <!-- === ELECTROLYTIC (x=500) === -->
  <text x="500" y="38" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#06b6d4" text-anchor="middle" letter-spacing="1">ELECTROLYTIC</text>
  <!-- Circuit symbol: flat line (−) and curved line (+) with polarity -->
  <line x1="500" y1="75" x2="500" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <!-- + plate: long straight line -->
  <line x1="480" y1="100" x2="520" y2="100" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- − plate: curved line (arc bowing toward negative) -->
  <path d="M 480,110 Q 500,118 520,110" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="500" y1="115" x2="500" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <!-- + polarity marker -->
  <text x="526" y="104" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4">+</text>
  <!-- Body: tall cylindrical can -->
  <rect x="465" y="148" width="70" height="55" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <!-- Polarity stripe at top of can -->
  <rect x="465" y="148" width="25" height="55" fill="#1e293b" rx="4"/>
  <text x="453" y="177" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="end">−</text>
  <!-- Lead wires (from bottom of can) -->
  <line x1="480" y1="203" x2="480" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="520" y1="203" x2="520" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Value -->
  <text x="505" y="182" font-family="IBM Plex Mono, monospace" font-size="10" fill="#e2e8f0" text-anchor="middle">100µ</text>
  <!-- Type label -->
  <text x="500" y="238" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Polarised · high C</text>
  <text x="500" y="250" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Observe + terminal</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-6 — Capacitor types: film (non-polarised), ceramic disc, electrolytic (polarised)</text>
</svg>
