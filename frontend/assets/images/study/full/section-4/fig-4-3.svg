<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Real battery model: E (EMF) in series with r (internal resistance), driving load R -->
  <!-- Circuit: battery cell (E) in series with small r, then external R in a loop -->
  <!-- Layout: left side = E + r (inside dashed box = battery), right side = R (load) -->

  <!-- Dashed battery boundary box -->
  <rect x="80" y="55" width="200" height="170" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,3" rx="6"/>
  <text x="180" y="46" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Battery</text>

  <!-- Circuit loop corners: TL(130,75) TR(470,75) BR(470,205) BL(130,205) -->
  <!-- Top wire segments -->
  <line x1="130" y1="75" x2="200" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- r (internal resistance) IEC rect on top wire -->
  <rect x="200" y="66" width="60" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="230" y="57" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-style="italic">r</text>
  <line x1="260" y1="75" x2="380" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- R (load) IEC rect on top-right wire -->
  <rect x="380" y="66" width="70" height="18" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="415" y="57" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle" font-style="italic">R</text>
  <line x1="450" y1="75" x2="470" y2="75" stroke="#94a3b8" stroke-width="2"/>
  <!-- Right wire -->
  <line x1="470" y1="75" x2="470" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <!-- Bottom wire -->
  <line x1="130" y1="205" x2="470" y2="205" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left wire segments around battery cell -->
  <line x1="130" y1="75" x2="130" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <line x1="130" y1="155" x2="130" y2="205" stroke="#94a3b8" stroke-width="2"/>

  <!-- EMF source: long line + short line (battery cell) -->
  <line x1="106" y1="125" x2="154" y2="125" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="116" y1="155" x2="144" y2="155" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- + / − labels -->
  <text x="162" y="129" font-family="IBM Plex Mono, monospace" font-size="13" fill="#06b6d4">+</text>
  <text x="162" y="160" font-family="IBM Plex Mono, monospace" font-size="13" fill="#94a3b8">−</text>
  <!-- E label -->
  <text x="82" y="143" font-family="IBM Plex Mono, monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-style="italic">E</text>

  <!-- Terminal voltage annotation (V_T across load R) -->
  <line x1="360" y1="88" x2="360" y2="192" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="470" y1="88" x2="470" y2="88" stroke="none"/>
  <!-- Bracket/arrow for V_T -->
  <line x1="355" y1="88" x2="365" y2="88" stroke="#06b6d4" stroke-width="1"/>
  <line x1="355" y1="192" x2="365" y2="192" stroke="#06b6d4" stroke-width="1"/>
  <text x="345" y="143" font-family="IBM Plex Mono, monospace" font-size="12" fill="#06b6d4" text-anchor="end">V<tspan baseline-shift="sub" font-size="70%">T</tspan></text>

  <!-- Labels for r and R below circuit -->
  <text x="230" y="105" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">internal</text>
  <text x="415" y="105" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">load</text>

  <!-- Formulae -->
  <text x="300" y="230" font-family="IBM Plex Mono, monospace" font-size="12" fill="#64748b" text-anchor="middle">I = E / (R + r)     V<tspan baseline-shift="sub" font-size="70%">T</tspan> = E − Ir</text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-3 — Real battery: EMF source E with internal resistance r driving external load R</text>
</svg>
