<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <marker id="pR2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#06b6d4"/>
    </marker>
    <marker id="pL" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="pS2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- RL series phasor diagram -->
  <!-- Origin at (180, 200) -->
  <!-- V_R: horizontal, pointing right -->
  <!-- V_L: vertical, pointing upward (leads I by 90°) -->
  <!-- V_S: diagonal resultant (up and right) -->

  <!-- Reference axes -->
  <line x1="100" y1="200" x2="420" y2="200" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="180" y1="250" x2="180" y2="60" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- V_R: horizontal right, length=180px -->
  <line x1="180" y1="200" x2="353" y2="200" stroke="#06b6d4" stroke-width="3" marker-end="url(#pR2)"/>
  <text x="270" y="218" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
  <text x="270" y="232" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">(in phase with I)</text>

  <!-- V_L: upward from tip of V_R, length=120px: from (360,200) to (360,80) -->
  <line x1="360" y1="200" x2="360" y2="86" stroke="#f59e0b" stroke-width="3" marker-end="url(#pL)"/>
  <text x="400" y="145" font-family="IBM Plex Mono, monospace" font-size="14" fill="#f59e0b">V<tspan baseline-shift="sub" font-size="70%">L</tspan></text>
  <text x="400" y="162" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b">+90° (leads)</text>

  <!-- Right angle marker at (360,200) -->
  <path d="M 345,200 L 345,185 L 360,185" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- V_S: resultant from origin (180,200) to (360,80) -->
  <line x1="180" y1="200" x2="353" y2="86" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#pS2)"/>
  <text x="245" y="130" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">S</tspan></text>

  <!-- Phase angle φ arc -->
  <path d="M 230,200 A 50,50 0 0,0 212,172" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="250" y="183" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0">φ</text>

  <!-- Formula panel -->
  <rect x="440" y="55" width="145" height="145" fill="#0d1321" stroke="#334155" stroke-width="1" rx="6"/>
  <text x="512" y="76" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">RL Series</text>
  <line x1="450" y1="82" x2="575" y2="82" stroke="#334155" stroke-width="1"/>
  <text x="512" y="98" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">|Z| = √(R²+X<tspan baseline-shift="sub" font-size="70%">L</tspan>²)</text>
  <text x="512" y="116" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">|V<tspan baseline-shift="sub" font-size="70%">S</tspan>| = √(V<tspan baseline-shift="sub" font-size="70%">R</tspan>²+V<tspan baseline-shift="sub" font-size="70%">L</tspan>²)</text>
  <text x="512" y="134" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="middle">tan φ = V<tspan baseline-shift="sub" font-size="70%">L</tspan> / V<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
  <text x="512" y="152" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">V<tspan baseline-shift="sub" font-size="70%">L</tspan> leads V<tspan baseline-shift="sub" font-size="70%">R</tspan></text>
  <text x="512" y="168" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">by 90°</text>
  <text x="512" y="186" font-family="IBM Plex Mono, monospace" font-size="11" fill="#64748b" text-anchor="middle">Current lags V<tspan baseline-shift="sub" font-size="70%">S</tspan></text>

  <!-- Caption -->
  <text x="300" y="270" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-20 — RL series phasor: V<tspan baseline-shift="sub" font-size="70%">R</tspan> in phase with I (horizontal), V<tspan baseline-shift="sub" font-size="70%">L</tspan> leads 90° (upward), V<tspan baseline-shift="sub" font-size="70%">S</tspan> is resultant</text>
</svg>
