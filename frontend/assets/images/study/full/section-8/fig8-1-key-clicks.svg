<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-label="CW envelope shaping comparison">
<rect width="680" height="220" fill="#0a0e1a" rx="8"/>
<line x1="20" y1="170" x2="320" y2="170" stroke="#1e293b" stroke-width="1"/>
<path d="M 20,170 L 102.0,170 L 102.0,80 L 238.0,80 L 238.0,170 L 320,170" stroke="#ef4444" stroke-width="2.2" fill="none"/>
<text x="170.0" y="30" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">Square keying — wide spectral spread</text>
<line x1="360" y1="170" x2="660" y2="170" stroke="#1e293b" stroke-width="1"/>
<path d="M 360,170 L 442.0,170 C 457.0,170 457.0,80 472.0,80 L 548.0,80 C 563.0,80 563.0,170 578.0,170 L 660,170" stroke="#22c55e" stroke-width="2.2" fill="none"/>
<text x="510.0" y="30" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">Shaped (cosine) rise — narrow spread</text>
<line x1="340" y1="20" x2="340" y2="190" stroke="#1e293b" stroke-width="1.5"/>
<text x="340.0" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 8.1 &#8212; CW envelope shaping: square keying (left) has abrupt edges and wide sidebands; shaped cosine rise (right) has narrow, clean sidebands</text>
</svg>
