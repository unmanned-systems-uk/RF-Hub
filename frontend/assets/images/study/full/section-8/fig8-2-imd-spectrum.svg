<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-label="Two-tone SSB IMD spectrum comparison">
<rect width="680" height="220" fill="#0a0e1a" rx="8"/>
<line x1="30" y1="175" x2="320" y2="175" stroke="#64748b" stroke-width="1.2"/>
<line x1="142.8" y1="175" x2="142.8" y2="65.0" stroke="#22c55e" stroke-width="4"/>
<line x1="197.2" y1="175" x2="197.2" y2="65.0" stroke="#22c55e" stroke-width="4"/>
<text x="170.0" y="30" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">Clean</text>
<text x="170.0" y="197" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">clean two-tone (linear PA)</text>
<line x1="370" y1="175" x2="660" y2="175" stroke="#64748b" stroke-width="1.2"/>
<line x1="482.8" y1="175" x2="482.8" y2="65.0" stroke="#22c55e" stroke-width="4"/>
<line x1="537.2" y1="175" x2="537.2" y2="65.0" stroke="#22c55e" stroke-width="4"/>
<line x1="456.8" y1="175" x2="456.8" y2="130.0" stroke="#ef4444" stroke-width="4"/>
<line x1="563.2" y1="175" x2="563.2" y2="130.0" stroke="#ef4444" stroke-width="4"/>
<line x1="430.8" y1="175" x2="430.8" y2="155.0" stroke="#ef4444" stroke-width="4"/>
<line x1="589.2" y1="175" x2="589.2" y2="155.0" stroke="#ef4444" stroke-width="4"/>
<text x="510.0" y="30" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">Overdriven — IMD visible</text>
<text x="510.0" y="197" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">3rd-order IMD products either side</text>
<line x1="340" y1="20" x2="340" y2="190" stroke="#1e293b" stroke-width="1.5"/>
<text x="340.0" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 8.2 &#8212; Two-tone SSB spectrum: clean linear-PA output (left) vs an overdriven PA showing 3rd-order IMD products (right)</text>
