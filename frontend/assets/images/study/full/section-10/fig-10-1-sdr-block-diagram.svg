<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" width="700" height="190">
  <rect width="700" height="190" fill="#0a0e1a" rx="8"/>

  <!-- SDR overview: Antenna → Analogue FE → ADC | Digital Samples → Software DSP → Audio/Data -->
  <!-- Vertical dashed divider shows analogue/digital boundary -->

  <!-- Antenna symbol -->
  <line x1="28" y1="85" x2="28" y2="62" stroke="#94a3b8" stroke-width="2"/>
  <line x1="17" y1="62" x2="39" y2="62" stroke="#94a3b8" stroke-width="2"/>
  <line x1="20" y1="67" x2="36" y2="67" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="23" y1="72" x2="33" y2="72" stroke="#94a3b8" stroke-width="1"/>
  <line x1="28" y1="85" x2="46" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="43,81 43,89 50,85" fill="#94a3b8"/>

  <!-- Analogue Front-End block -->
  <rect x="50" y="64" width="110" height="42" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="105" y="81" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Analogue</text>
  <text x="105" y="93" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Front-End</text>
  <text x="105" y="104" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">BPF · LNA · Mixer</text>
  <line x1="160" y1="85" x2="176" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="173,81 173,89 180,85" fill="#94a3b8"/>

  <!-- ADC block -->
  <rect x="180" y="64" width="70" height="42" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="215" y="83" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4" text-anchor="middle">ADC</text>
  <text x="215" y="96" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">digitise</text>
  <line x1="250" y1="85" x2="268" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="265,81 265,89 272,85" fill="#94a3b8"/>

  <!-- Analogue/Digital boundary -->
  <line x1="272" y1="48" x2="272" y2="122" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="215" y="125" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">← analogue domain →</text>
  <text x="420" y="125" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">← digital domain →</text>

  <!-- Digital Samples block -->
  <rect x="272" y="64" width="110" height="42" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="327" y="81" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Digital</text>
  <text x="327" y="93" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Samples</text>
  <text x="327" y="104" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">I/Q data stream</text>
  <line x1="382" y1="85" x2="398" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="395,81 395,89 402,85" fill="#94a3b8"/>

  <!-- Software DSP block -->
  <rect x="402" y="64" width="110" height="42" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="457" y="81" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Software</text>
  <text x="457" y="93" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">DSP</text>
  <text x="457" y="104" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">demod · decode · filter</text>
  <line x1="512" y1="85" x2="528" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="525,81 525,89 532,85" fill="#94a3b8"/>

  <!-- Audio / Decoded Data block -->
  <rect x="532" y="64" width="100" height="42" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="582" y="80" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Audio /</text>
  <text x="582" y="92" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Decoded</text>
  <text x="582" y="104" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Data</text>

  <!-- Caption -->
  <text x="350" y="178" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 10-1 — Software Defined Radio: analogue signal digitised by ADC; all processing done in software</text>
</svg>
