<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <rect width="700" height="220" fill="#0a0e1a" rx="8"/>

  <!-- SDR hardware front-end: Antenna → BPF → LNA → Mixer → Baseband filter → ADC -->
  <!-- Local oscillator (software-controlled) feeds up into Mixer from below -->

  <!-- Antenna symbol -->
  <line x1="22" y1="74" x2="22" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="12" y1="50" x2="32" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="15" y1="55" x2="29" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="18" y1="60" x2="26" y2="60" stroke="#94a3b8" stroke-width="1"/>
  <text x="22" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ANT</text>
  <line x1="22" y1="74" x2="52" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="49,70 49,78 56,74" fill="#94a3b8"/>

  <!-- BPF block -->
  <rect x="56" y="55" width="68" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="90" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">BPF</text>
  <text x="90" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">band select</text>
  <line x1="124" y1="74" x2="142" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="139,70 139,78 146,74" fill="#94a3b8"/>

  <!-- LNA block -->
  <rect x="146" y="55" width="68" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="180" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">LNA</text>
  <text x="180" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">low noise amp</text>
  <line x1="214" y1="74" x2="232" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="229,70 229,78 236,74" fill="#94a3b8"/>

  <!-- Mixer block -->
  <rect x="236" y="55" width="68" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="270" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Mixer</text>
  <text x="270" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">down-convert</text>
  <line x1="304" y1="74" x2="322" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="319,70 319,78 326,74" fill="#94a3b8"/>

  <!-- Baseband Filter block -->
  <rect x="326" y="55" width="96" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="374" y="70" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Baseband</text>
  <text x="374" y="81" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Filter</text>
  <text x="374" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">low-IF / LPF</text>
  <line x1="422" y1="74" x2="440" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="437,70 437,78 444,74" fill="#94a3b8"/>

  <!-- ADC block -->
  <rect x="444" y="55" width="68" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="478" y="70" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="middle">ADC</text>
  <text x="478" y="83" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">digitise</text>
  <text x="478" y="91" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">I/Q samples</text>
  <line x1="512" y1="74" x2="530" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="527,70 527,78 534,74" fill="#94a3b8"/>

  <!-- Software label after ADC -->
  <rect x="534" y="55" width="110" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="589" y="70" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Software</text>
  <text x="589" y="81" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Processing</text>
  <text x="589" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">demod / decode</text>

  <!-- Local Oscillator block (below Mixer) -->
  <rect x="236" y="135" width="68" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="270" y="151" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">LO</text>
  <text x="270" y="163" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">software ctrl</text>

  <!-- Arrow: LO up to Mixer -->
  <line x1="270" y1="135" x2="270" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="266,99 274,99 270,93" fill="#f59e0b"/>
  <text x="291" y="118" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b">NCO /</text>
  <text x="291" y="128" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b">PLL</text>

  <!-- Analogue boundary annotation -->
  <line x1="528" y1="44" x2="528" y2="108" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="430" y="114" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">← RF analogue →</text>
  <text x="589" y="114" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle">digital →</text>

  <!-- Caption -->
  <text x="350" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 10-2 — SDR hardware front-end: LNA + Mixer + filter condition the RF signal before the ADC</text>
</svg>
