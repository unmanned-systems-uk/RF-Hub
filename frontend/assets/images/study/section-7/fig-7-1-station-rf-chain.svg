<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <rect width="700" height="220" fill="#0a0e1a" rx="8"/>

  <!-- Station RF chain with EMC mitigation points -->
  <!-- Mains → Power Supply → TX/RX → SWR Meter → ATU → Feeder → Antenna -->
  <!-- Annotations: ferrite ring on mains lead; screened mic/audio cables -->

  <!-- Mains symbol (AC plug) -->
  <rect x="10" y="55" width="46" height="38" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="33" y="70" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Mains</text>
  <!-- Small AC sine inside -->
  <path d="M 20,79 Q 25,72 30,79 Q 35,86 40,79" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="56" y1="74" x2="68" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="65,70 65,78 72,74" fill="#94a3b8"/>

  <!-- Power Supply block -->
  <rect x="72" y="55" width="82" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="113" y="71" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Power</text>
  <text x="113" y="83" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Supply</text>
  <line x1="154" y1="74" x2="170" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="167,70 167,78 174,74" fill="#94a3b8"/>

  <!-- TX/RX block -->
  <rect x="174" y="55" width="76" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="212" y="71" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">TX / RX</text>
  <text x="212" y="83" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">transceiver</text>
  <line x1="250" y1="74" x2="266" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="263,70 263,78 270,74" fill="#94a3b8"/>

  <!-- SWR Meter block -->
  <rect x="270" y="55" width="82" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="311" y="71" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">SWR</text>
  <text x="311" y="83" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Meter</text>
  <line x1="352" y1="74" x2="368" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="365,70 365,78 372,74" fill="#94a3b8"/>

  <!-- ATU block -->
  <rect x="372" y="55" width="64" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="404" y="71" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">ATU</text>
  <text x="404" y="83" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">matcher</text>
  <line x1="436" y1="74" x2="452" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="449,70 449,78 456,74" fill="#94a3b8"/>

  <!-- Feeder block -->
  <rect x="456" y="55" width="66" height="38" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="489" y="71" font-family="IBM Plex Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Feeder</text>
  <text x="489" y="83" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">coax / open</text>
  <line x1="522" y1="74" x2="542" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="539,70 539,78 546,74" fill="#94a3b8"/>

  <!-- Antenna symbol -->
  <line x1="546" y1="74" x2="546" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="534" y1="50" x2="558" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="537" y1="55" x2="555" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="541" y1="60" x2="551" y2="60" stroke="#94a3b8" stroke-width="1"/>
  <text x="546" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ANT</text>

  <!-- EMC annotation 1: Ferrite ring on mains lead -->
  <!-- Arrow pointing UP to wire between Mains and Power Supply -->
  <line x1="65" y1="118" x2="65" y2="96" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="61,99 69,99 65,93" fill="#06b6d4"/>
  <text x="65" y="130" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">Ferrite ring</text>
  <text x="65" y="142" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">on mains lead</text>

  <!-- EMC annotation 2: Screened cables at TX/RX -->
  <!-- Arrow pointing UP to TX/RX block bottom -->
  <line x1="212" y1="118" x2="212" y2="96" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="208,99 216,99 212,93" fill="#06b6d4"/>
  <text x="212" y="130" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">Screened mic</text>
  <text x="212" y="142" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">&amp; audio cables</text>

  <!-- Caption -->
  <text x="350" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 7-1 — Station RF chain: ferrite rings and screened cables reduce RF ingress at EMC-sensitive points</text>
</svg>
