<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Standing wave: incident + reflected → standing wave with nodes every λ/2 -->

  <!-- === Row 1: Incident wave (travelling RIGHT) y=55 === -->
  <text x="60" y="45" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#06b6d4">Incident wave →</text>
  <!-- Sine wave centered y=56, amplitude 16, 2 cycles from x=140 to x=540 (400px, 200px/cycle) -->
  <path d="M 140,56 Q 165,24 190,56 Q 215,88 240,56 Q 265,24 290,56 Q 315,88 340,56 Q 365,24 390,56 Q 415,88 440,56 Q 465,24 490,56 Q 515,88 540,56"
        stroke="#06b6d4" stroke-width="1.5" fill="none"/>
  <!-- Direction arrow -->
  <polygon points="537,52 537,60 544,56" fill="#06b6d4"/>

  <!-- === Row 2: Reflected wave (travelling LEFT) y=120 === -->
  <text x="60" y="110" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#f59e0b">← Reflected wave</text>
  <!-- Same wave but phase-shifted (reflected has 180° phase flip at the end) -->
  <!-- Reflected: flipped vertically and travelling left -->
  <path d="M 140,120 Q 165,152 190,120 Q 215,88 240,120 Q 265,152 290,120 Q 315,88 340,120 Q 365,152 390,120 Q 415,88 440,120 Q 465,152 490,120 Q 515,88 540,120"
        stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <!-- Direction arrow (left) -->
  <polygon points="143,124 143,116 136,120" fill="#f59e0b"/>

  <!-- + symbol between rows -->
  <text x="80" y="148" font-family="IBM Plex Mono, monospace" font-size="18" fill="#94a3b8" text-anchor="middle">+</text>
  <line x1="115" y1="148" x2="565" y2="148" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="170" font-family="IBM Plex Mono, monospace" font-size="18" fill="#94a3b8" text-anchor="middle">=</text>

  <!-- === Row 3: Standing wave envelope y=210 === -->
  <text x="60" y="175" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#e2e8f0">Standing wave</text>

  <!-- Baseline for standing wave -->
  <line x1="115" y1="210" x2="565" y2="210" stroke="#334155" stroke-width="1"/>

  <!-- Nodes every 100px (λ/2): x=140,240,340,440,540 -->
  <!-- Upper envelope: bumps above baseline using quadratic bezier -->
  <path d="M 140,210 Q 190,170 240,210 Q 290,170 340,210 Q 390,170 440,210 Q 490,170 540,210"
        stroke="#06b6d4" stroke-width="2" fill="none"/>
  <!-- Lower envelope: bumps below baseline -->
  <path d="M 140,210 Q 190,250 240,210 Q 290,250 340,210 Q 390,250 440,210 Q 490,250 540,210"
        stroke="#06b6d4" stroke-width="2" fill="none"/>
  <!-- Fill between envelopes (subtle) -->
  <path d="M 140,210 Q 190,170 240,210 Q 290,170 340,210 Q 390,170 440,210 Q 490,170 540,210 Q 490,250 440,210 Q 390,250 340,210 Q 290,250 240,210 Q 190,250 140,210 Z"
        fill="#06b6d4" fill-opacity="0.08"/>

  <!-- Node markers (N) -->
  <line x1="140" y1="165" x2="140" y2="255" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="140" y="262" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">N</text>
  <line x1="240" y1="165" x2="240" y2="255" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="240" y="262" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">N</text>
  <line x1="340" y1="165" x2="340" y2="255" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="340" y="262" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">N</text>
  <line x1="440" y1="165" x2="440" y2="255" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="262" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">N</text>
  <line x1="540" y1="165" x2="540" y2="255" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="540" y="262" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="middle">N</text>

  <!-- Antinode markers (A) -->
  <text x="190" y="166" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">A</text>
  <text x="290" y="166" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">A</text>
  <text x="390" y="166" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">A</text>
  <text x="490" y="166" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">A</text>

  <!-- λ/2 label between first two nodes -->
  <line x1="140" y1="257" x2="240" y2="257" stroke="#94a3b8" stroke-width="1"/>
  <polygon points="143,254 143,260 136,257" fill="#94a3b8"/>
  <polygon points="237,254 237,260 244,257" fill="#94a3b8"/>
  <text x="190" y="275" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">λ/2</text>

  <!-- Caption -->
  <text x="300" y="12" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-2 — Standing wave: nodes (N) are zero-displacement points every λ/2; antinodes (A) are maxima</text>
</svg>
