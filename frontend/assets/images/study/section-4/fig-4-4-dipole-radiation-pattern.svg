<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Half-wave dipole azimuthal radiation pattern (H-plane, top view) -->
  <!-- Figure-of-eight: two lobes broadside, nulls off ends -->

  <!-- Title -->
  <text x="300" y="26" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Half-Wave Dipole — Radiation Pattern</text>

  <!-- Centre of pattern at (300, 145) -->

  <!-- Polar grid (faint reference circles) -->
  <circle cx="300" cy="145" r="30" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="300" cy="145" r="60" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="300" cy="145" r="90" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Radial reference lines every 45° (faint) -->
  <line x1="300" y1="55" x2="300" y2="235" stroke="#1e293b" stroke-width="1"/>
  <line x1="210" y1="145" x2="390" y2="145" stroke="#1e293b" stroke-width="1"/>
  <line x1="236" y1="81" x2="364" y2="209" stroke="#1e293b" stroke-width="1"/>
  <line x1="364" y1="81" x2="236" y2="209" stroke="#1e293b" stroke-width="1"/>

  <!-- Radiation pattern lobes — r = |sin(φ)| → two circles -->
  <!-- Top lobe circle: cx=300, cy=145-60=85, r=60 -->
  <circle cx="300" cy="85" r="60" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2"/>
  <!-- Bottom lobe circle: cx=300, cy=145+60=205, r=60 -->
  <circle cx="300" cy="205" r="60" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2"/>

  <!-- Dipole element (horizontal, east-west orientation) -->
  <line x1="225" y1="145" x2="375" y2="145" stroke="#f59e0b" stroke-width="3"/>
  <!-- Feedpoint marker -->
  <circle cx="300" cy="145" r="5" fill="#f59e0b"/>
  <!-- Dipole end tips -->
  <line x1="225" y1="138" x2="225" y2="152" stroke="#f59e0b" stroke-width="2"/>
  <line x1="375" y1="138" x2="375" y2="152" stroke="#f59e0b" stroke-width="2"/>

  <!-- Dipole label -->
  <text x="388" y="149" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b">Dipole</text>

  <!-- "MAX" labels at lobe peaks -->
  <text x="300" y="18" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">▲ max</text>
  <text x="300" y="40" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Broadside</text>
  <text x="300" y="248" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">Broadside</text>
  <text x="300" y="260" font-family="IBM Plex Mono, monospace" font-size="9" fill="#06b6d4" text-anchor="middle">▼ max</text>

  <!-- "NULL" labels at ends of dipole axis -->
  <text x="195" y="149" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b" text-anchor="end">Null</text>
  <text x="405" y="149" font-family="IBM Plex Mono, monospace" font-size="9" fill="#f59e0b">Null</text>

  <!-- 0 dB reference tick at max radius (r=90) -->
  <text x="308" y="60" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b">0 dBd</text>

  <!-- Caption -->
  <text x="300" y="272" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-4 — Dipole radiation pattern (H-plane): figure-of-eight with broadside maxima, nulls off ends</text>
</svg>
