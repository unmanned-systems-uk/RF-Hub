<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Vertical polarisation: E-field vertical, H-field horizontal, propagation perpendicular to both -->

  <!-- Title -->
  <text x="300" y="30" font-family="IBM Plex Mono, monospace" font-size="13" fill="#e2e8f0" text-anchor="middle">Vertical Polarisation</text>

  <!-- === LEFT PANEL: cross-section view (end-on) x=20-260 === -->
  <text x="140" y="54" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cross-section (end-on view)</text>

  <!-- E-field: vertical double arrow (cyan) -->
  <line x1="140" y1="80" x2="140" y2="200" stroke="#06b6d4" stroke-width="2.5"/>
  <polygon points="136,84 144,84 140,77" fill="#06b6d4"/>
  <polygon points="136,196 144,196 140,203" fill="#06b6d4"/>
  <text x="155" y="120" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4">E</text>
  <text x="159" y="132" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4">(vertical)</text>

  <!-- H-field: horizontal double arrow (amber) -->
  <line x1="60" y1="140" x2="220" y2="140" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="64,136 64,144 57,140" fill="#f59e0b"/>
  <polygon points="216,136 216,144 223,140" fill="#f59e0b"/>
  <text x="140" y="160" font-family="IBM Plex Mono, monospace" font-size="11" fill="#f59e0b" text-anchor="middle">H</text>
  <text x="140" y="172" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">(horizontal)</text>

  <!-- Propagation: circle with dot (coming out of page toward viewer) -->
  <circle cx="140" cy="140" r="14" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="140" cy="140" r="4" fill="#94a3b8"/>
  <text x="140" y="202" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">⊙ propagation</text>
  <text x="140" y="213" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(out of page)</text>

  <!-- Panel divider -->
  <line x1="278" y1="45" x2="278" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- === RIGHT PANEL: side view — wave travelling right x=295-580 === -->
  <text x="435" y="54" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Side view (E-field wave)</text>

  <!-- Propagation axis -->
  <line x1="295" y1="140" x2="565" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="561,136 561,144 568,140" fill="#94a3b8"/>
  <text x="560" y="158" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#94a3b8">→ z</text>

  <!-- E-field sine wave (2 cycles, amplitude 52, centered y=140) -->
  <!-- Points computed for 2 cycles from x=300 to x=540 (240px, 120px per cycle, 30px per quarter) -->
  <path d="M 300,140 Q 330,36 360,140 Q 390,244 420,140 Q 450,36 480,140 Q 510,244 540,140"
        stroke="#06b6d4" stroke-width="2.5" fill="none"/>

  <!-- E-field label at peak -->
  <text x="555" y="92" font-family="IBM Plex Mono, monospace" font-size="11" fill="#06b6d4">E</text>

  <!-- Vertical amplitude arrows at first peak -->
  <line x1="342" y1="88" x2="342" y2="140" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="352" y="118" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#06b6d4">amplitude</text>

  <!-- H-field indicators: ⊙ at peaks (E max → H=0, but H lags 90°; at E zero-crossings H is max) -->
  <!-- At E troughs (y=192): H out of page -->
  <circle cx="390" cy="192" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="390" cy="192" r="2.5" fill="#f59e0b"/>
  <!-- At x=360 (zero crossing going down) -->
  <circle cx="510" cy="192" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="510" cy="192" r="2.5" fill="#f59e0b"/>
  <!-- Label -->
  <text x="450" y="215" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle">H (out) ⊙</text>

  <!-- Caption -->
  <text x="300" y="268" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-1 — Vertical polarisation: E-field vertical, H-field horizontal, both ⊥ to direction of propagation</text>
</svg>
