<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#0a0e1a" rx="8"/>

  <!-- Trapped dipole: 40m/20m dual-band -->
  <!-- Centre feedpoint → inner 20m elements → traps → outer 40m extensions -->

  <!-- Title -->
  <text x="300" y="28" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">Trapped Dipole (40m / 20m)</text>

  <!-- Centre feedpoint (x=300, y=90) -->
  <circle cx="300" cy="90" r="6" fill="#06b6d4"/>
  <text x="300" y="80" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Feedpoint</text>
  <!-- Feedline down from centre -->
  <line x1="300" y1="96" x2="300" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <!-- Coax symbol -->
  <line x1="292" y1="125" x2="308" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="140" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">50Ω coax</text>

  <!-- === LEFT SIDE === -->
  <!-- Left inner element (20m section): feedpoint → trap -->
  <line x1="130" y1="90" x2="294" y2="90" stroke="#06b6d4" stroke-width="3"/>

  <!-- Left trap at x=130, y=90 -->
  <rect x="108" y="76" width="44" height="28" fill="#0d1321" stroke="#f59e0b" stroke-width="2" rx="3"/>
  <text x="130" y="87" font-family="IBM Plex Mono, monospace" font-size="8" fill="#f59e0b" text-anchor="middle">TRAP</text>
  <text x="130" y="98" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">L∥C (20m)</text>

  <!-- Left outer element (40m extension): trap → tip -->
  <line x1="40" y1="90" x2="108" y2="90" stroke="#94a3b8" stroke-width="3"/>
  <!-- Left tip mark -->
  <line x1="40" y1="82" x2="40" y2="98" stroke="#94a3b8" stroke-width="2"/>

  <!-- === RIGHT SIDE === -->
  <!-- Right inner element: feedpoint → trap -->
  <line x1="306" y1="90" x2="470" y2="90" stroke="#06b6d4" stroke-width="3"/>

  <!-- Right trap at x=470, y=90 -->
  <rect x="448" y="76" width="44" height="28" fill="#0d1321" stroke="#f59e0b" stroke-width="2" rx="3"/>
  <text x="470" y="87" font-family="IBM Plex Mono, monospace" font-size="8" fill="#f59e0b" text-anchor="middle">TRAP</text>
  <text x="470" y="98" font-family="IBM Plex Sans, sans-serif" font-size="7" fill="#64748b" text-anchor="middle">L∥C (20m)</text>

  <!-- Right outer element: trap → tip -->
  <line x1="492" y1="90" x2="560" y2="90" stroke="#94a3b8" stroke-width="3"/>
  <!-- Right tip mark -->
  <line x1="560" y1="82" x2="560" y2="98" stroke="#94a3b8" stroke-width="2"/>

  <!-- === DIMENSION LABELS === -->
  <!-- 20m section label (inner, between feedpoint and each trap) -->
  <!-- Left inner bracket -->
  <line x1="130" y1="108" x2="300" y2="108" stroke="#06b6d4" stroke-width="1"/>
  <polygon points="133,105 133,111 126,108" fill="#06b6d4"/>
  <polygon points="297,105 297,111 304,108" fill="#06b6d4"/>
  <text x="215" y="120" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">20m inner section</text>

  <!-- Right inner bracket -->
  <line x1="300" y1="108" x2="470" y2="108" stroke="#06b6d4" stroke-width="1"/>
  <text x="385" y="120" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">20m inner section</text>

  <!-- Full 40m span label -->
  <line x1="40" y1="152" x2="560" y2="152" stroke="#94a3b8" stroke-width="1"/>
  <polygon points="43,149 43,155 36,152" fill="#94a3b8"/>
  <polygon points="557,149 557,155 564,152" fill="#94a3b8"/>
  <text x="300" y="164" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">40m total span</text>

  <!-- How the traps work note -->
  <text x="300" y="183" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">At 20m: traps are high-impedance → outer sections isolated → resonates as 20m dipole</text>
  <text x="300" y="195" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">At 40m: traps are low-impedance → full antenna is active → resonates as 40m dipole</text>

  <!-- Caption -->
  <text x="300" y="212" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 4-3 — Trapped dipole: LC traps switch resonant length between 20m and 40m bands</text>
</svg>
