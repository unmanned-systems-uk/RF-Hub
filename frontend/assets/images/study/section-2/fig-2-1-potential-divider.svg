<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <rect width="600" height="280" fill="#0a0e1a" rx="8"/>

  <!-- Potential divider: +Vs → R1 → junction (V_out) → R2 → GND -->

  <!-- +Vs supply label at top -->
  <text x="200" y="28" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4" text-anchor="middle">+Vs</text>
  <line x1="200" y1="32" x2="200" y2="55" stroke="#94a3b8" stroke-width="2"/>

  <!-- R1 (top resistor, IEC rectangle) -->
  <rect x="180" y="55" width="40" height="60" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="240" y="88" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">R1</text>

  <!-- Wire from R1 bottom to junction node -->
  <line x1="200" y1="115" x2="200" y2="145" stroke="#94a3b8" stroke-width="2"/>

  <!-- Junction node -->
  <circle cx="200" cy="145" r="4" fill="#06b6d4"/>

  <!-- V_out tap: horizontal line to the right -->
  <line x1="200" y1="145" x2="330" y2="145" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="141" font-family="IBM Plex Mono, monospace" font-size="14" fill="#06b6d4">V_out</text>
  <text x="340" y="157" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b">= Vs × R2 / (R1 + R2)</text>

  <!-- R2 (bottom resistor, IEC rectangle) -->
  <line x1="200" y1="145" x2="200" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <rect x="180" y="165" width="40" height="60" fill="#0d1321" stroke="#94a3b8" stroke-width="2" rx="2"/>
  <text x="240" y="198" font-family="IBM Plex Mono, monospace" font-size="14" fill="#e2e8f0">R2</text>

  <!-- Wire from R2 bottom to GND -->
  <line x1="200" y1="225" x2="200" y2="248" stroke="#94a3b8" stroke-width="2"/>

  <!-- GND symbol -->
  <line x1="178" y1="248" x2="222" y2="248" stroke="#94a3b8" stroke-width="2"/>
  <line x1="184" y1="254" x2="216" y2="254" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="190" y1="260" x2="210" y2="260" stroke="#94a3b8" stroke-width="1"/>

  <!-- Key rule annotation -->
  <text x="460" y="100" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">If load draws</text>
  <text x="460" y="115" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">no current:</text>
  <text x="460" y="140" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">V_out = Vs × R2</text>
  <text x="460" y="156" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">        ───────</text>
  <text x="460" y="172" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">        R1 + R2</text>

  <!-- Caption -->
  <text x="300" y="275" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 2-1 — Potential divider: V_out = Vs × R2 / (R1 + R2). Valid when load draws negligible current.</text>
</svg>
