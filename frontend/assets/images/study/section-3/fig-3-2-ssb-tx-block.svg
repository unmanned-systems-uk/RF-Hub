<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <rect width="700" height="220" fill="#0a0e1a" rx="8"/>

  <!-- SSB transmitter block diagram -->
  <!-- Chain: Mic → AF Amp → Bal.Mod → SSB Filter → Mixer → PA → Antenna -->
  <!-- VFO/PLL feeds up into Mixer from below -->

  <!-- Block layout: MIC(14-30) wire(30-54) AF Amp(54-122) Bal.Mod(142-224) SSB Filt(244-322) Mixer(342-410) PA(430-494) ANT(516) -->

  <!-- Microphone symbol -->
  <rect x="14" y="52" width="16" height="24" rx="8" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="22" y1="76" x2="22" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <line x1="14" y1="85" x2="30" y2="85" stroke="#94a3b8" stroke-width="2"/>
  <text x="22" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">MIC</text>
  <line x1="30" y1="74" x2="50" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="47,70 47,78 54,74" fill="#94a3b8"/>

  <!-- AF Amplifier block -->
  <rect x="54" y="55" width="68" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="88" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">AF Amp</text>
  <text x="88" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">preamp</text>
  <line x1="122" y1="74" x2="138" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="135,70 135,78 142,74" fill="#94a3b8"/>

  <!-- Balanced Modulator block -->
  <rect x="142" y="55" width="82" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="183" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Bal. Mod</text>
  <text x="183" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">carrier</text>
  <text x="183" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">suppressed</text>
  <line x1="224" y1="74" x2="240" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="237,70 237,78 244,74" fill="#94a3b8"/>

  <!-- SSB Filter block -->
  <rect x="244" y="55" width="78" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="283" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">SSB Filter</text>
  <text x="283" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">removes one</text>
  <text x="283" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">sideband</text>
  <line x1="322" y1="74" x2="338" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="335,70 335,78 342,74" fill="#94a3b8"/>

  <!-- Mixer block -->
  <rect x="342" y="55" width="68" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="376" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Mixer</text>
  <text x="376" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">upconvert</text>
  <line x1="410" y1="74" x2="426" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="423,70 423,78 430,74" fill="#94a3b8"/>

  <!-- PA block -->
  <rect x="430" y="55" width="64" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="462" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">PA</text>
  <text x="462" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">power</text>
  <text x="462" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">amplifier</text>
  <line x1="494" y1="74" x2="512" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="509,70 509,78 516,74" fill="#94a3b8"/>

  <!-- Antenna symbol -->
  <line x1="516" y1="74" x2="516" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="504" y1="50" x2="528" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="508" y1="55" x2="524" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="512" y1="60" x2="520" y2="60" stroke="#94a3b8" stroke-width="1"/>
  <text x="516" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ANT</text>

  <!-- VFO/PLL block (below Mixer) -->
  <rect x="342" y="135" width="68" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="376" y="152" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">VFO/PLL</text>
  <text x="376" y="165" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">sets TX freq</text>

  <!-- Arrow: VFO/PLL up to Mixer -->
  <line x1="376" y1="135" x2="376" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="372,99 380,99 376,93" fill="#f59e0b"/>
  <text x="393" y="120" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b">LO freq</text>

  <!-- Signal labels below chain -->
  <text x="88" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">audio</text>
  <text x="183" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">DSB-SC</text>
  <text x="283" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">SSB (IF)</text>
  <text x="462" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">RF out</text>

  <!-- Key annotation (right panel) -->
  <text x="608" y="75" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Bal. Mod</text>
  <text x="608" y="87" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">kills carrier</text>
  <text x="608" y="107" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">SSB Filter</text>
  <text x="608" y="119" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">one sideband</text>
  <text x="608" y="139" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Mixer shifts</text>
  <text x="608" y="151" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">IF → RF freq</text>

  <!-- Caption -->
  <text x="350" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 3-2 — SSB transmitter: balanced modulator suppresses carrier; SSB filter removes one sideband</text>
</svg>
