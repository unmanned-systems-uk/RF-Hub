<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <rect width="700" height="220" fill="#0a0e1a" rx="8"/>

  <!-- Superhet receiver block diagram -->
  <!-- Chain: Antenna → RF Amp → Mixer → IF Amp → Detector → AF Amp → Speaker -->
  <!-- Local Oscillator feeds up into Mixer from below -->

  <!-- Block dimensions: 72×38, y=55..93, spacing: x positions below -->
  <!-- ANT(20) → RF Amp(60) → Mixer(155) → IF Amp(250) → Detector(345) → AF Amp(445) → SPK(540) -->

  <!-- Antenna symbol -->
  <line x1="22" y1="74" x2="22" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="12" y1="50" x2="32" y2="50" stroke="#94a3b8" stroke-width="2"/>
  <line x1="15" y1="55" x2="29" y2="55" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="18" y1="60" x2="26" y2="60" stroke="#94a3b8" stroke-width="1"/>
  <text x="22" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ANT</text>
  <line x1="22" y1="74" x2="55" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="52,70 52,78 59,74" fill="#94a3b8"/>

  <!-- RF Amplifier block -->
  <rect x="59" y="55" width="72" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="95" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">RF Amp</text>
  <text x="95" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">noise figure</text>
  <line x1="131" y1="74" x2="150" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="147,70 147,78 154,74" fill="#94a3b8"/>

  <!-- Mixer block -->
  <rect x="154" y="55" width="72" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="190" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Mixer</text>
  <text x="190" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">IF = RF ± LO</text>
  <line x1="226" y1="74" x2="245" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="242,70 242,78 249,74" fill="#94a3b8"/>

  <!-- IF Amplifier block -->
  <rect x="249" y="55" width="72" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="285" y="70" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">IF Amp</text>
  <text x="285" y="81" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">+ IF Filter</text>
  <text x="285" y="90" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">selectivity</text>
  <line x1="321" y1="74" x2="340" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="337,70 337,78 344,74" fill="#94a3b8"/>

  <!-- Detector block -->
  <rect x="344" y="55" width="72" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="380" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Detector</text>
  <text x="380" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">AM/SSB/CW</text>
  <line x1="416" y1="74" x2="435" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="432,70 432,78 439,74" fill="#94a3b8"/>

  <!-- AF Amplifier block -->
  <rect x="439" y="55" width="72" height="38" fill="#0d1321" stroke="#06b6d4" stroke-width="1.5" rx="4"/>
  <text x="475" y="72" font-family="IBM Plex Mono, monospace" font-size="10" fill="#06b6d4" text-anchor="middle">AF Amp</text>
  <text x="475" y="85" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">audio</text>
  <line x1="511" y1="74" x2="530" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="527,70 527,78 534,74" fill="#94a3b8"/>

  <!-- Speaker symbol -->
  <polygon points="534,63 534,85 545,85 558,95 558,53 545,63" fill="#0d1321" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 562,62 Q 575,74 562,86" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 566,57 Q 582,74 566,91" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="578" y="100" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">SPK</text>

  <!-- Local Oscillator block (below Mixer) -->
  <rect x="154" y="135" width="72" height="38" fill="#0d1321" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="190" y="152" font-family="IBM Plex Mono, monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Local Osc</text>
  <text x="190" y="165" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">VFO / PLL</text>

  <!-- Arrow: Local Osc up to Mixer -->
  <line x1="190" y1="135" x2="190" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="186,99 194,99 190,93" fill="#f59e0b"/>
  <text x="205" y="120" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#f59e0b">LO freq</text>

  <!-- Frequency labels below chain -->
  <text x="95" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">f<tspan baseline-shift="sub" font-size="70%">RF</tspan></text>
  <text x="285" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">f<tspan baseline-shift="sub" font-size="70%">IF</tspan> (fixed)</text>
  <text x="475" y="105" font-family="IBM Plex Mono, monospace" font-size="8" fill="#64748b" text-anchor="middle">audio</text>

  <!-- Key equation -->
  <text x="400" y="165" font-family="IBM Plex Mono, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">IF = |f<tspan baseline-shift="sub" font-size="70%">RF</tspan> − f<tspan baseline-shift="sub" font-size="70%">LO</tspan>|</text>
  <text x="400" y="182" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">IF filter sets selectivity — fixed frequency = precise filtering</text>

  <!-- Caption -->
  <text x="350" y="210" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Fig 3-1 — Superheterodyne receiver: converts all RF to fixed IF for precise filtering and detection</text>
</svg>
