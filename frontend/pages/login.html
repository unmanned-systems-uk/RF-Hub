<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — RF-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/rf-hub-v2.css">
<style>
.auth-wrap {
  min-height: calc(100vh - 120px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

.auth-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2.25rem 2.5rem;
  width: 100%;
  max-width: 440px;
}

.auth-title {
  font-family: var(--font-display);
  font-size: 1.75rem;
  color: var(--text-primary);
  margin: 0 0 0.35rem 0;
}

.auth-subtitle {
  font-size: 0.875rem;
  color: var(--text-dim);
  margin: 0 0 1.75rem 0;
}

.form-group {
  margin-bottom: 1.1rem;
}

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  margin-bottom: 0.4rem;
  letter-spacing: 0.03em;
}

.form-group input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.6rem 0.85rem;
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 0.92rem;
  transition: border-color 0.2s;
  box-sizing: border-box;
}

.form-group input:focus {
  outline: none;
  border-color: var(--accent-em);
}

.form-error {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  padding: 0.65rem 0.9rem;
  font-size: 0.85rem;
  color: #fca5a5;
  margin-bottom: 1.1rem;
  display: none;
}

.btn-submit {
  width: 100%;
  padding: 0.7rem 1rem;
  background: linear-gradient(135deg, var(--accent-em), var(--accent-h));
  border: none;
  border-radius: 8px;
  color: var(--bg-deep);
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-top: 0.5rem;
}

.btn-submit:hover { opacity: 0.88; }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.auth-footer {
  text-align: center;
  margin-top: 1.25rem;
  font-size: 0.84rem;
  color: var(--text-dim);
}

.auth-footer a {
  color: var(--accent-em);
  text-decoration: none;
}

.auth-footer a:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="/assets/css/search.css">
</head>
<body>

<!-- ═══ NAVIGATION ═══ -->
<nav class="site-nav">
  <div class="container container--wide">
    <a href="../index.html" class="site-nav-brand">RF-Hub</a>
    <ul class="site-nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="frequency-bands.html">Spectrum</a></li>
      <li><a href="antennas.html">Antennas</a></li>
      <li><a href="learning-path.html">Learn</a></li>
      <li><a href="sidebands/">Sidebands</a></li>
      <li><a href="gsm-cellular.html">GSM</a></li>
      <li><a href="blog/">Blog</a></li>
    </ul>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Log in</h1>
    <p class="auth-subtitle">Welcome back to RF-Hub.</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="identifier">Email or username</label>
        <input type="text" id="identifier" name="identifier" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Log in</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>
</div>

<!-- ═══ FOOTER ═══ -->
<footer class="site-footer">
  <div class="container">
    <p>RF-Hub &mdash; Amateur Radio Reference Platform</p>
  </div>
</footer>

<script src="../assets/js/api.js"></script>
<script>
(function () {
  const form      = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    formError.style.display = 'none';
    formError.textContent   = '';

    const identifier = document.getElementById('identifier').value.trim();
    const password   = document.getElementById('password').value;

    if (!identifier || !password) {
      formError.textContent = 'Please enter your email/username and password.';
      formError.style.display = 'block';
      return;
    }

    submitBtn.disabled    = true;
    submitBtn.textContent = 'Logging in…';

    try {
      await api.login(identifier, password);
      window.location.href = '/pages/portal.html';
    } catch (err) {
      formError.textContent = err.message || 'Login failed. Check your credentials and try again.';
      formError.style.display = 'block';
      submitBtn.disabled    = false;
      submitBtn.textContent = 'Log in';
    }
  });
})();
</script>
<script src="/assets/js/search.js" defer></script>
<script src="/assets/js/nav-auth.js" defer></script>
</body>
</html>
